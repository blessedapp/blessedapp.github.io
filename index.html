function agNextDate(d, t, from){
  const [h, m] = String(t || "19:00").split(":").map(Number), x = new Date(from);
  x.setHours(h || 0, m || 0, 0, 0);
  let add = (d - x.getDay() + 7) % 7; if (add === 0 && x < from) add = 7;
  x.setDate(x.getDate() + add); return x;
}
function agUpcoming(){
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const end = new Date(start); end.setDate(end.getDate() + 14);

  }));

const pad2 = n => String(n).padStart(2, "0");
function agDayLabel(d){
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((x - t) / 86400000);
  return diff === 0 ? "Hoje" : diff === 1 ? "Amanhã" : DOW3[d.getDay()] + " " + pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1);
}
function agIcs({title, start, minutes, weekly, desc}){
  const f = d => d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "T" + pad2(d.getHours()) + pad2(d.getMinutes()) + "00";
  const e = v => String(v || "").replace(/[\\,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const end = new Date(start.getTime() + (minutes || 90) * 60000);
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Blessed//Agenda//PT", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "BEGIN:VEVENT",
    "UID:" + Date.now() + "-" + Math.random().toString(36).slice(2) + "@blessed", "DTSTAMP:" + f(new Date()), "DTSTART:" + f(start), "DTEND:" + f(end), "SUMMARY:" + e(title)];
  if (desc) L.push("DESCRIPTION:" + e(desc));
  if (weekly != null) L.push("RRULE:FREQ=WEEKLY;BYDAY=" + ICS_DAY[weekly]);
  L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + e(title), "TRIGGER:-PT1H", "END:VALARM", "END:VEVENT", "END:VCALENDAR");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([L.join("\r\n")], {type: "text/calendar"}));
  a.download = (title || "evento").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".ics";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  flash("Abrindo no calendário do celular 🔔 Confirme para salvar.");
}

const MOD_TERMS=["caralho", "porra", "merda", "foda", "foder", "fodase", "fudido", "fudida", "puta", "puto", "putaria", "arrombado", "arrombada", "vagabundo", "vagabunda", "otario", "otaria", "babaca", "imbecil", "idiota", "desgracado", "desgracada", "buceta", "fdp", "vsf", "pqp", "vai tomar no cu"];

const MOD_BAD_RE=new RegExp('(^|[^a-z0-9])('+MOD_TERMS.map(t=>[...t.replace(/ /g,'')].join('[^a-z0-9]*')).join('|')+')($|[^a-z0-9])');
function modOffensive(value){return MOD_BAD_RE.test(modNormalize(value).replace(/[013457@$]/g,c=>({'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','@':'a','$':'s'}[c])));}

async function blLoad(){
  if (BLS.loading || !BLS.more) return;
  BLS.loading = true;
  const from = (BLS.list || []).length;
  const {data, error} = await TEAM.client.from("blessings").select("*")
    .order("created_at", {ascending: false}).range(from, from + 9);
  BLS.loading = false;
  if (error) { BLS.list = BLS.list || []; BLS.more = false; BLS.err = /does not exist|schema cache/i.test(error.message || "") ? "missing" : "net"; blRefresh(true); return; }
  BLS.err = "";
  if (data.length < 10) BLS.more = false;
  await blAfter(data);
  data.forEach(x => BLS.items[x.id] = x);
  const have = new Set(BLS.list || []);
  BLS.list = (BLS.list || []).concat(data.map(x => x.id).filter(id => !have.has(id)));
  blRefresh(from === 0);
}
async function blAfter(list){
  const authors = [...new Set(list.map(x => x.author))].filter(a => !COMM.profiles[a]);
  if (authors.length) {
    const {data} = await TEAM.client.from("community_profiles").select("id,handle,display_name,church,city,instruments,avatar_path,cover_path,theme,created_at,verified,official,kind").in("id", authors);
    commKeep(data);
  }
  const ids = list.map(x => x.id);
  if (!ids.length) return;
  const {data} = await TEAM.client.from("blessing_likes").select("blessing_id,user_id").in("blessing_id", ids);
  ids.forEach(id => BLS.likes[id] = 0);
  (data || []).forEach(r => { BLS.likes[r.blessing_id]++; if (r.user_id === TEAM.user.id) BLS.my.add(r.blessing_id); });
  await pfAfter("blessing", ids);
}

async function blOpen(id){
  state.view = "blessings"; BLS.focus = id;

    const {data} = await TEAM.client.from("blessings").select("*").eq("id", id).maybeSingle();
    if (!data) { flash("Esse Blessing não está mais disponível."); BLS.focus = null; }
    else { await blAfter([data]); BLS.items[id] = data; }

  if (BLS.items[id]) BLS.list = [id].concat((BLS.list || []).filter(x => x !== id));

// Liga o vídeo que está na tela e desliga os outros
let blObs = null, blEndObs = null;
function blSetup(){
  if (blObs) blObs.disconnect(); if (blEndObs) blEndObs.disconnect();
  const feed = $("#bl-feed"); if (!feed) return;
  document.body.classList.add("bl-on");
  const items = [...feed.querySelectorAll(".bl-item")];
  blObs = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target.querySelector("video");
    if (e.isIntersecting && e.intersectionRatio > .6) {
      if (!v.src) v.src = v.dataset.src;
      v.preload = "auto";
      if (!blSaveData() || v.dataset.go) v.play().then(() => blPlayIcon(e.target, false)).catch(() => blPlayIcon(e.target, true)); else blPlayIcon(e.target, true);
      const next = e.target.nextElementSibling && e.target.nextElementSibling.querySelector("video");
      if (next && !next.src && !blSaveData()) { next.preload = "metadata"; next.src = next.dataset.src; }
    } else if (!v.paused) v.pause();
  }), {root: feed, threshold: [0, .6]});
  items.forEach(el => blObs.observe(el));
  const end = $("#bl-end");
  if (end) { blEndObs = new IntersectionObserver(es => { if (es[0].isIntersecting) blLoad(); }, {root: feed, rootMargin: "0px 0px 100% 0px"}); blEndObs.observe(end); }
  if (BLS.focus) { const el = feed.querySelector(`.bl-item[data-id="${CSS.escape(BLS.focus)}"]`); if (el) el.scrollIntoView(); BLS.focus = null; }
}

function pfMissing(error){ if (error && /does not exist|schema cache/i.test(error.message || "")) PF.missing = true; return !!error; }

async function pfLoadMix(rows){
  const pids = rows.filter(r => r.kind === "post" && !COMM.posts[r.target_id]).map(r => r.target_id);
  const bids = rows.filter(r => r.kind === "blessing" && !BLS.items[r.target_id]).map(r => r.target_id);
  if (pids.length) { const {data} = await TEAM.client.from("posts").select(PF_PSEL).in("id", pids); (data || []).forEach(p => COMM.posts[p.id] = p); await commAfterPosts(data || []); }
  if (bids.length) { const {data} = await TEAM.client.from("blessings").select(PF_BSEL).in("id", bids); (data || []).forEach(x => BLS.items[x.id] = x); await blAfter(data || []); }
  return rows.map(r => ({k: r.kind, id: r.target_id})).filter(x => x.k === "post" ? COMM.posts[x.id] : BLS.items[x.id]);
}
async function pfLoad(uid, tab){
  if (tab === "blessings") {
    const {data} = await TEAM.client.from("blessings").select(PF_BSEL).eq("author", uid).order("created_at", {ascending: false}).limit(60);
    (data || []).forEach(x => BLS.items[x.id] = x); await blAfter(data || []);
    PF.bl[uid] = (data || []).map(x => x.id);
  } else {
    const {data, error} = await TEAM.client.from(tab).select("kind,target_id,created_at").eq("user_id", uid).order("created_at", {ascending: false}).limit(90);
    pfMissing(error);
    PF[tab][uid] = await pfLoadMix(data || []);
    if (tab === "shares" && uid === TEAM.user.id) (data || []).forEach(r => PF.mySh.add(r.kind + ":" + r.target_id));
  }
  commRerender("profile");
}
// depois de carregar fotos/vídeos: quem está marcado e quantos comentários os vídeos têm
async function pfAfter(kind, ids){
  ids = ids.filter(i => PF.tagsOf[kind + ":" + i] === undefined);
  if (!ids.length || PF.missing) return;
  ids.forEach(i => PF.tagsOf[kind + ":" + i] = []);
  const [t, c] = await Promise.all([
    TEAM.client.from("tags").select("target_id,user_id").eq("kind", kind).in("target_id", ids),
    kind === "blessing" ? TEAM.client.from("blessing_comments").select("blessing_id").in("blessing_id", ids) : Promise.resolve({data: []})]);
  if (pfMissing(t.error)) return;
  (t.data || []).forEach(r => PF.tagsOf[kind + ":" + r.target_id].push(r.user_id));
  if (kind === "blessing") { ids.forEach(i => PF.bccount[i] = 0); (c.data || []).forEach(r => PF.bccount[r.blessing_id]++); }
  const need = [...new Set((t.data || []).map(r => r.user_id))].filter(u => !COMM.profiles[u]);
  if (need.length) { const {data: pr} = await TEAM.client.from("community_profiles").select(PF_PROF).in("id", need); commKeep(pr); }
}

function pfTabs(id, me, posts){
  const tab = state.pfTab || "fotos";
  const seg = (v, l) => `<button type="button" data-a="pf-tab" data-v="${v}" aria-pressed="${tab === v}" aria-label="${l}"><span class="pf-tab-icon" aria-hidden="true">${PF_TAB_ICONS[v]}</span><span class="pf-tab-label">${l}</span></button>`;

      shares: me ? "Numa foto ou Blessing, toque em compartilhar e escolha “No meu perfil”." : "Ainda não compartilhou nada."}[tab];

  }

  const sel = state.tagPick || [];
  const opts = (COMM.people || []).filter(p => p.id !== TEAM.user.id && !sel.includes(p.id)).map(p => `<option value="@${esc(p.handle)}">${esc(p.display_name)}</option>`).join("");
  return `<div class="pf-tagpick"><span class="muted" style="font-size:13px">👥 Marcar pessoas ou igrejas (opcional)</span>

function pfKeepDrafts(){ const c = $("#cm-caption"); if (c && state.cmPost) state.cmPost.caption = c.value; const b = $("#bl-cap"); if (b) BLS.capDraft = b.value; }
function pfPick(v){
  v = String(v || "").trim().toLowerCase().replace(/^@/, "");
  if (!v) return;
  const p = (COMM.people || []).find(x => x.id !== TEAM.user.id && ((x.handle || "").toLowerCase() === v || (x.display_name || "").toLowerCase() === v));
  if (!p) { flash("Não achei essa pessoa. Escolha um nome da lista."); return; }
  pfKeepDrafts(); state.tagPick = [...new Set((state.tagPick || []).concat(p.id))].slice(0, 10); rerenderKeepScroll();
  const q = $("#pf-tag-q"); if (q) q.focus();
}
async function pfSaveTags(kind, id){
  const sel = state.tagPick || []; state.tagPick = [];
  if (!sel.length) return;
  const {error} = await TEAM.client.from("tags").insert(sel.map(u => ({kind, target_id: id, user_id: u, tagged_by: TEAM.user.id})));
  if (error) { pfMissing(error); flash("Publicado, mas não consegui marcar as pessoas."); return; }

async function pfUntagMe(kind, id){
  closePix();

  if (error) { flash("Não consegui agora."); return; }

}

    TEAM.client.from("shares").select("kind,target_id").eq("user_id", TEAM.user.id).limit(1000).then(({data, error}) => {
      if (pfMissing(error)) return; (data || []).forEach(r => PF.mySh.add(r.kind + ":" + r.target_id)); if ($("#sh-t")) pfShareMenu(kind, id); }); }

async function pfShareToggle(kind, id){
  const k = kind + ":" + id, on = PF.mySh.has(k); closePix();

                 : await TEAM.client.from("shares").insert({kind, target_id: id, user_id: TEAM.user.id});

async function pfBcSend(bid){
  const el = $("#pf-bc"), text = ((el && el.value) || "").trim().slice(0, 500);

async function pfBcDel(id, bid){

  const {error} = await TEAM.client.from("blessing_comments").delete().eq("id", id);
  if (error) { flash("Não consegui apagar agora."); return; }
  PF.bcom[bid] = (PF.bcom[bid] || []).filter(c => c.id !== id); PF.bccount[bid] = PF.bcom[bid].length;

function pfBcCount(bid){ const s = document.querySelector(`.bl-item[data-id="${CSS.escape(bid)}"] [data-a="bl-cmts"] span`); if (s) s.textContent = PF.bccount[bid] || 0; }

function pfClick(a, b){
  if (a === "pf-tab") { state.pfTab = b.dataset.v; rerenderKeepScroll(); }
  else if (a === "pf-unpick") { pfKeepDrafts(); state.tagPick = (state.tagPick || []).filter(u => u !== b.dataset.id); rerenderKeepScroll(); }
  else if (a === "pf-untag") pfUntagMe(b.dataset.k, b.dataset.id);
  else if (a === "pf-share") pfShareToggle(b.dataset.k, b.dataset.id);
  else if (a === "pf-link") { closePix(); if (b.dataset.k === "post") commShare(b.dataset.id); else blShare(b.dataset.id); }
  else if (a === "pf-bc-del") pfBcDel(b.dataset.id, b.dataset.b);
  else return false;
  return true;
}
/* ---------- Mensagens (direct) ----------
   Conversa de duas pessoas. As regras do banco só deixam as duas lerem (nem o administrador lê).
   As mensagens chegam na hora pelo Realtime. Quem denuncia manda o texto junto. */
/* Anexos do direct: bucket privado, revisão antes de enviar e captura só após um toque. */
const DMM={ready:false,panel:null,urls:new Map(),signing:new Set()};
const DMM_FIELDS='id,conversation_id,author,text,created_at,media_kind,media_path,media_mime,media_bytes,media_seconds';
const DMM_PHOTO_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="4"/><circle cx="8" cy="9" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/></svg>';
const DMM_MIC_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg>';
function dmmCurrent(p){return p&&DMM.panel===p&&!p.cancelled&&TEAM.user?.id===p.owner&&TEAM.client===p.client&&DM.generation===p.generation&&DM.open===p.conv&&state.view==='chat';}
function dmmClose(){const p=DMM.panel;if(!p)return;p.cancelled=true;dmmWaveStop(p);document.querySelector('.dmm-inline')?.remove();document.querySelector('#dm-form')?.classList.remove('dm-record-mode');clearInterval(p.timer);clearTimeout(p.limit);p.stream?.getTracks().forEach(t=>t.stop());if(p.recorder?.state==='recording'){try{p.recorder.stop();}catch(e){}}if(p.url)URL.revokeObjectURL(p.url);DMM.panel=null;const box=$('#modal');if(box?.querySelector('#dmm-title')){box.hidden=true;box.innerHTML='';}}
function dmmPanel(kind){if(!DMM.ready||!TEAM.user||!termsGate()||DM.busy)return null;const c=DM.convs?.find(x=>x.id===DM.open);if(!c||DM.blocks.has(dmOther(c)))return null;closePix();if(DWP.edit?.busy||DMM.panel?.busy)return null;const p={kind,owner:TEAM.user.id,client:TEAM.client,generation:DM.generation,conv:DM.open,phase:'pick',error:'',busy:false,cancelled:false};DMM.panel=p;return p;}
function dmmWaveStop(p){cancelAnimationFrame(p?.waveFrame);if(p?.waveContext){p.waveContext.close().catch(()=>{});p.waveContext=null;}if(p)p.analyser=null;}
function dmmWaveStart(p){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();p.waveContext=ctx;p.analyser=ctx.createAnalyser();p.analyser.fftSize=256;ctx.createMediaStreamSource(p.stream).connect(p.analyser);ctx.resume().catch(()=>{});}catch(e){}dmmWavePaint(p);}

 if(m.media_kind==='photo')return `<button class="dmm-photo" data-a="dmm-view" data-id="${esc(m.id)}" aria-label="Abrir foto enviada"><img src="${esc(url)}" loading="lazy" alt="Foto enviada na conversa" data-dmm-id="${esc(m.id)}"></button>`;

async function dmAttentionSend(id=DM.open){
  const c=DM.convs?.find(c=>c.id===id),owner=TEAM.user?.id;
  if(!owner||!c||!DM.attentionReady||DM.attentionBusy||DM.blocks.has(dmOther(c)))return;
  const stored=c.a===owner?c.attention_a_at:c.attention_b_at,last=Math.max(Date.parse(stored)||0,DM.attentionSent[id]||0);
  if(Date.now()-last<60000){flash('Aguarde um minuto antes de chamar essa pessoa novamente.');return;}
  const generation=DM.generation,client=TEAM.client;DM.attentionBusy=true;dmRerender();
  try{
    const {data,error}=await client.from('messages').insert({conversation_id:id,author:owner,text:DM_ATTENTION_TEXT}).select('id,conversation_id,author,text,created_at').single();
    if(DM.generation!==generation||TEAM.user?.id!==owner)return;
    if(error||!data){flash(error?.code==='23514'?'Aguarde um pouco antes de chamar novamente.':'Não consegui chamar agora. Confira se a conversa está disponível.');return;}
    DM.attentionSent[id]=Date.now();dmIncoming(data);ntfSound('attention');flash('Chamado enviado. A tela balança se a pessoa estiver com o Blessed aberto.');
  }catch(_){if(DM.generation===generation)flash('Sem conexão. Tente novamente.');}

}

function dmClick(a, b){

  if(a.startsWith("dmm-")){dmmClick(a,b);return true;}

  else if(a === "dm-attention-send")dmAttentionSend();
  else if(a === "dm-attention-open")dmOpen(b.dataset.id);
  else if(a === "dm-attention-dismiss"){DM.attention=null;dmRerender();dmAttentionPaint();}
  else if (a === "dm-list") { state.view = "chats"; render(); scrollTo(0, 0); }
  else if (a === "dm-open") dmOpen(b.dataset.id);
  else if (a === "dm-safe") dmSafeNotice(true);
  else if (a === "dm-with") dmWith(b.dataset.id);
  else if (a === "dm-back") { DM.open = null; state.view = state.dmBack === "profile" ? "profile" : "chats"; render(); scrollTo(0, 0); }
  else if (a === "dm-msg") dmMsgMenu(b.dataset.id);
  else if (a === "dm-menu") dmConvMenu(b.dataset.id);
  else if (a === "dm-clear") dmClearMenu(b.dataset.id);
  else if (a === "dm-clear-confirm") dmClear(b.dataset.id);
  else if (a === "dm-block") dmBlock(b.dataset.id);
  else if (a === "dm-del") { if (confirm("Apagar esta mensagem para os dois?")) dmDelete(b.dataset.id); }
  else if (a === "dm-copy") { const m = Object.values(DM.msgs).flat().find(x => x.id === b.dataset.id); closePix(); if (m) navigator.clipboard.writeText(m.text).then(() => flash("Copiado ✓"), () => {}); }
  else if (a === "dm-report") dmReportMenu(b.dataset.id);
  else if (a === "dm-report-send") dmReportSend(b.dataset.id, b.dataset.v);
  else return false;
  return true;
}

async function ntfTogglePush(){

   await ntfRequest('subscribe',{subscription:sub.toJSON()});if(!current()){await created?.unsubscribe();return;}

  }

}

// Foto reduzida no aparelho antes de enviar (pesa pouco e não manda a foto original com localização)
function commResize(file, max, cap){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); reject(); };
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx=c.getContext("2d");ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = 0.9, d = c.toDataURL("image/jpeg", q);
      while (d.length > cap * 1.33 && q > 0.5) { q = Math.max(0.5,q - 0.05); d = c.toDataURL("image/jpeg", q); }
      while(d.length>cap*1.33&&c.width>1&&c.height>1){const smaller=document.createElement("canvas");smaller.width=Math.max(1,Math.round(c.width*.85));smaller.height=Math.max(1,Math.round(c.height*.85));const sc=smaller.getContext("2d");sc.imageSmoothingQuality="high";sc.drawImage(c,0,0,smaller.width,smaller.height);c.width=smaller.width;c.height=smaller.height;ctx.drawImage(smaller,0,0);d=c.toDataURL("image/jpeg",q);}
      resolve(d);
    };
    img.src = url;
  });
}

/* ---------- crédito e colaboração (Pix) ---------- */
const PIX_KEY = "ea6fa496-e823-4955-a319-5a9cf8af3976";            // chave Pix de quem recebe as colaborações
const PIX_NAME = "Keliane Lima da Silva";           // nome que aparece no app do banco ao fazer o Pix
// Código "Pix Copia e Cola" (padrão BR Code do Banco Central), sem valor: quem paga escolhe quanto.
function pixPayload(){
  const f = (id, v) => id + String(v.length).padStart(2, "0") + v;
  const plain = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z0-9 ]/g, "").slice(0, 25);
  const body = f("00", "01") + f("26", f("00", "br.gov.bcb.pix") + f("01", PIX_KEY)) + f("52", "0000") + f("53", "986") + f("58", "BR")
    + f("59", plain(PIX_NAME || "BLESSED")) + f("60", "BRASIL") + f("62", f("05", "***")) + "6304";
  let crc = 0xFFFF;
  for (let i = 0; i < body.length; i++) { crc ^= body.charCodeAt(i) << 8; for (let b = 0; b < 8; b++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF; }
  return body + crc.toString(16).toUpperCase().padStart(4, "0");
}
function pixQr(){
  try { const q = qrcode(0, "M"); q.addData(pixPayload()); q.make(); return q.createSvgTag({cellSize: 5, margin: 3, scalable: true}); } catch(e) { return ""; }
}

function setBackupMsg(m){ state.backupMsg = m; const el = $("#backup-msg"); if (el) { el.textContent = m; el.hidden = !m; } }
async function exportRepertoire(){
  const data = JSON.stringify({
    app:"cifra-e-campo", version:1, exportedAt:new Date().toISOString(),
    songs: state.songs.map(s => Object.assign({id:s.id}, songBody(s))),
    artists: state.artists.map(a => ({id:a.id, name:a.name, photo:a.photo||""})),
    setlist: state.setlist
  });
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){}
  const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  if (!dl) {
    // versão site (fora do Claude): no celular abre a tela de compartilhar (WhatsApp); senão baixa o arquivo
    if (window.claude) { setBackupMsg("Este aparelho não deixou salvar arquivos por aqui. Tente exportar pelo app aberto no computador."); return; }
    try {
      const file = new File([data], `repertorio-blessed-${stamp}.json`, {type: "application/json"});
      if (navigator.canShare && navigator.canShare({files: [file]})) {
        await navigator.share({files: [file], title: "Repertório Blessed", text: "Meu repertório do Blessed. Abra o app e toque em Receber repertório."});
        setBackupMsg("Repertório enviado ✓"); return;
      }
    } catch(e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    a.download = `repertorio-blessed-${stamp}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    setBackupMsg(`Arquivo pronto ✓ ${state.songs.length} músicas e ${state.artists.length} pastas.`);
    return;
  }
  try {
    await dl.save({filename:`repertorio-blessed-${stamp}.json`, data});
    setBackupMsg(`Arquivo pronto ✓ ${state.songs.length} músicas e ${state.artists.length} pastas. Mande pelo WhatsApp para o outro celular.`);
  } catch(e) {
    if (e && e.code === "declined") return;
    setBackupMsg("Não consegui gerar o arquivo agora. Tente de novo em instantes.");
  }

      doc.setFont("courier", l.t === "ch" ? "bold" : "normal"); doc.setFontSize(fs);
      if (l.t === "ch") doc.setTextColor(118, 38, 186); else doc.setTextColor(20);

  if (dl) {

    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: song.name}); say("PDF pronto ✓"); return; }

  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);

/* ---------- roda dos caminhos (círculo das quintas) ----------
   Anel de fora: acordes maiores, andando de quinta em quinta. Anel de dentro: o relativo menor de cada um.
   O tom fica sempre no topo: IV · I · V em cima, IIm · VIm · IIIm logo abaixo e o VII° ao lado. */
function cellOf(rootPc, q, Kmaj){
  const iv = (rootPc - Kmaj.pc + 120) % 12;

  return {ring:"i", i:(((iv - 9 + 12) % 12) * 7) % 12};
}
function cellIv(c){ return c.ring === "o" ? (c.i*7) % 12 : (c.i*7 + 9) % 12; }
function cellDia(c){ return c.ring === "o" ? [11,0,1].includes(c.i) : [11,0,1,2].includes(c.i); }
function ivCell(iv){ return [0,5,7].includes(iv) ? {ring:"o", i:(iv*7)%12} : {ring:"i", i:(((iv-9+12)%12)*7)%12}; }

  if (cellDia(c)) return (PATHS[iv] || {to:[]}).to.map(ivCell);
  if (c.ring === "o") return [ivCell((iv + 5) % 12)]; // maior fora do campo puxa para 5 notas abaixo
  return [];
}
function cellName(c, K){
  const iv = cellIv(c), n = spell(K.pc + iv, K);
  const plainN = ({"E#":"F","B#":"C","Cb":"B","Fb":"E"})[n] && state.simple ? ({"E#":"F","B#":"C","Cb":"B","Fb":"E"})[n] : n;

function cellDeg(c){

let wheelSeq = 0;
function wheelSVG(K, opt){
  opt = opt || {};

  const pt = (r, a) => [C + r*Math.cos(a*Math.PI/180), C + r*Math.sin(a*Math.PI/180)];
  const arc = (r1, r2, a0, a1) => { const [x1,y1]=pt(r2,a0),[x2,y2]=pt(r2,a1),[x3,y3]=pt(r1,a1),[x4,y4]=pt(r1,a0);
    return `M${x1.toFixed(1)} ${y1.toFixed(1)}A${r2} ${r2} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}L${x3.toFixed(1)} ${y3.toFixed(1)}A${r1} ${r1} 0 0 0 ${x4.toFixed(1)} ${y4.toFixed(1)}Z`; };
  const same = (a, b) => a && b && a.ring === b.ring && a.i === b.i;
  const allDest = opt.sel && opt.showDest !== false ? cellDest(opt.sel) : [];
  const dest = state.wheelAll ? allDest : allDest.slice(0, 1);
  const mainDest = allDest[0];
  const center = c => pt(c.ring === "o" ? 123 : 79, -90 + c.i*30);
  let cells = "";
  for (const ring of ["o","i"]) for (let i = 0; i < 12; i++) {
    const c = {ring, i}, a = -90 + i*30;
    const cl = ["c", ring==="o"?"out":"in", cellDia(c)?"dia":"",
      same(c,opt.sel)?"sel":"", same(c,opt.next)?"next":"", dest.some(d=>same(d,c))?"dest":"", same(c,mainDest)?"main":""].join(" ");
    const [tx, ty] = center(c);
    const lab = opt.mini ? "" : `<text class="nm" x="${tx.toFixed(1)}" y="${(ty-(ring==="o"?5:4)).toFixed(1)}">${esc(cellName(c,K))}</text><text class="dg" x="${tx.toFixed(1)}" y="${(ty+(ring==="o"?11:9)).toFixed(1)}">${esc(cellDeg(c))}</text>`;
    cells += `<g class="${cl}" ${opt.mini ? "" : `data-a="wheel" data-ring="${ring}" data-i="${i}" role="button" tabindex="0" aria-label="${esc(cellName(c,K))}, grau ${esc(cellDeg(c))}"`}>

  }

    <defs><marker id="${id}d" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="${id}mn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="${id}nx" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path class="ah nx" d="M0 0L10 5L0 10z"/></marker></defs>
    ${cells}
    <circle class="ctr" cx="150" cy="150" r="56"/>
    ${opt.mini ? "" : `<text class="ck" x="150" y="146">${esc(K.tonic)}</text><text class="ct" x="150" y="174">TOM</text>`}
    ${arrows}</svg>`;
}
function wheelExplain(K){

  </div>`;
}

const ART_YT={cache:new Map(),pending:new Set(),failed:new Map()};

function artistTrackRow(song,index,visitor){const m=artistTrackData(song),video=artistVideoId(m.youtube),photo=video?'https://i.ytimg.com/vi/'+video+'/hqdefault.jpg':artistPhoto(song.artist);return `<article class="artist-track" data-artist-track="${esc(song.id||'catalog-'+index)}"><span class="artist-track-number">${index+1}</span><button class="artist-track-main" data-a="${visitor?'pc-track':'open'}" data-id="${esc(song.id||'')}" data-n="${esc(song.name)}" data-artist="${esc(song.artist||'')}" data-video="${esc(video)}"><span class="artist-track-cover">${photo?`<img data-artist-image data-fallback="${esc(artistPhoto(song.artist))}" ${video?'data-youtube-cover':''} src="${esc(photo)}" alt="" loading="lazy" decoding="async">`:initials(song.name)}</span><span class="artist-track-copy"><b>${esc(song.name||'Sem nome')}</b><small>${artistTrackMeta(song)}</small></span></button><a class="artist-track-watch" ${video?'':'hidden'} href="${video?'https://www.youtube.com/watch?v='+video:'#'}" target="_blank" rel="noopener" aria-label="Ver ${esc(song.name)} no YouTube">${DMM_PLAY_ICON}</a></article>`;}

function artistStatsPaint(name,songs){if(state.view!=='artist'||norm(state.currentArtist)!==norm(name))return;for(const song of songs){const row=document.querySelector('[data-artist-track="'+CSS.escape(song.id||'')+'"]');if(!row)continue;const m=artistTrackData(song),video=artistVideoId(m.youtube),text=row.querySelector('.artist-track-copy small'),button=row.querySelector('.artist-track-main'),link=row.querySelector('.artist-track-watch');if(text)text.textContent=artistTrackMeta(song).replace(/&amp;/g,'&');if(button)button.dataset.video=video;if(link){link.hidden=!video;link.href=video?'https://www.youtube.com/watch?v='+video:'#';}if(video){const cover=row.querySelector('.artist-track-cover');if(cover&&!cover.querySelector('[data-youtube-cover]'))cover.innerHTML=`<img data-artist-image data-fallback="${esc(artistPhoto(song.artist))}" data-youtube-cover src="https://i.ytimg.com/vi/${video}/hqdefault.jpg" alt="" loading="lazy" decoding="async">`;}}const note=document.querySelector('.artist-stats-note');if(note)note.hidden=!songs.some(s=>typeof artistTrackData(s).views==='string');}
async function artistStatsLoad(name,songs){
 if(!window.CC_SUPABASE||state.view!=='artist'||norm(state.currentArtist)!==norm(name))return;
 const wanted=songs.filter(s=>s.id&&!s.pending&&!s.catalog&&s.id!=='exemplo'&&!s.example).slice(0,150);
 for(let i=0;i<wanted.length;i+=50){const group=wanted.slice(i,i+50).filter(s=>!(ART_YT.cache.get(s.id)?.until>Date.now())&&!ART_YT.pending.has(s.id)&&!(ART_YT.failed.get(s.id)>Date.now()));if(!group.length)continue;group.forEach(s=>ART_YT.pending.add(s.id));
  try{const response=await fetch(window.CC_SUPABASE.url.replace(/\/$/,'')+'/functions/v1/youtube-stats',{method:'POST',headers:{'Content-Type':'application/json',apikey:window.CC_SUPABASE.key},body:JSON.stringify({ids:group.map(s=>s.id)})});if(!response.ok)throw Error('unavailable');const result=await response.json();if(!Array.isArray(result.tracks))throw Error('data');const allowed=new Set(group.map(s=>s.id));for(const row of result.tracks){if(!allowed.has(row.id))continue;const data={};const video=artistVideoId(row.youtube);if(video)data.youtube='https://www.youtube.com/watch?v='+video;if(/^[A-G](?:#|b)?$/.test(row.origTonic||''))data.origTonic=row.origTonic;if(['major','minor'].includes(row.origMode))data.origMode=row.origMode;if(typeof row.views==='string'&&/^\d{1,20}$/.test(row.views))data.views=row.views;if(ART_YT.cache.size>=400)ART_YT.cache.delete(ART_YT.cache.keys().next().value);ART_YT.cache.set(row.id,{data,until:Date.now()+(result.statsAvailable?21600000:600000)});}for(const song of group)if(!(ART_YT.cache.get(song.id)?.until>Date.now()))ART_YT.cache.set(song.id,{data:{},until:Date.now()+600000});artistStatsPaint(name,songs);
  }catch(e){group.forEach(s=>ART_YT.failed.set(s.id,Date.now()+60000));}finally{group.forEach(s=>ART_YT.pending.delete(s.id));}
 }
}

function resizeImage(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const s = Math.min(1, 720 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        let q = 0.8, d = c.toDataURL("image/jpeg", q);
        while (d.length > 170000 && q > 0.35) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
        resolve(d);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// Tom menor lido como o tom maior "irmão" (relativo): Bm = D, Am = C. Mesmos acordes, nomes mais fáceis.
function asMajorOn(song){ return song.origMode === "minor" && state.asMajor; }
function relMajor(t){ const K = keyInfo(t, "minor"), n = SHARP[(K.pc+3)%12], f = FLAT[(K.pc+3)%12]; const s = spell(K.pc+3, K); return TONICS.major.includes(s) ? s : TONICS.major.includes(n) ? n : f; }
function relMinor(t){ const K = keyInfo(t, "major"); const s = spell(K.pc+9, K); return TONICS.minor.includes(s) ? s : DEFAULT_NAME.minor[(K.pc+9)%12]; }
function songKeyLabel(s, which){
  const t = which === "orig" ? s.origTonic : (s.targetTonic || s.origTonic);
  return asMajorOn(s) ? relMajor(t) : keyLabel(t, s.origMode);
}
function analyse(song){
  const am = asMajorOn(song);
  const K0 = am ? keyInfo(relMajor(song.origTonic), "major") : keyInfo(song.origTonic, song.origMode);
  const KT = am ? keyInfo(relMajor(song.targetTonic || song.origTonic), "major") : keyInfo(song.targetTonic || song.origTonic, song.origMode);
  const lines = parseSong(song.text);
  // violão com capotraste: a cifra mostra as formas que a mão faz; "sound" guarda o tom que soa
  const capo = state.instrument === "violao" ? (song.capo || 0) : 0;
  if (capo) {
    const KS = keyInfo(DEFAULT_NAME[KT.mode][(KT.pc - capo + 12) % 12], KT.mode);
    return {K0, KT:KS, sound:KT, capo, shift:(KS.pc - K0.pc + 12) % 12, lines, chords: songChords(lines)};
  }
  const shift = (KT.pc - K0.pc + 12) % 12;
  return {K0, KT, shift, lines, chords: songChords(lines)};
}

function fieldData(KT){
  const sc = SCALE[KT.mode];
  const tri = KT.mode==="major" ? ["","m","m","","","m","°"] : ["m","°","","m","m","","" ];
  const tet = KT.mode==="major" ? ["7M","m7","m7","7M","7","m7","m7(b5)"] : ["m7","m7(b5)","7M","m7","m7","7M","7"];
  const rom = KT.mode==="major" ? ["I","IIm","IIIm","IV","V","VIm","VII°"] : ["Im","IIø","bIII","IVm","Vm","bVI","bVII"];
  return sc.map((iv, d) => ({iv, rom: rom[d], root: spell(KT.pc+iv, KT), tri: tri[d], tet: tet[d], fn: FUNC[KT.mode][iv]}));
}

function buildTips(song, A){
  const {K0, KT, shift, chords} = A;
  const tips = [];
  const scale = SCALE[KT.mode].map(iv => spell(KT.pc+iv, KT));
  const acc = scale.filter(n => n.length>1);
  const sharps = acc.filter(n=>n.includes("#")).length, flats = acc.filter(n=>n.includes("b")).length;
  if (asMajorOn(song)) tips.push(`A cifra original está em <b>${esc(keyLabel(song.origTonic,"minor"))}</b> (tom menor). ${esc(keyLabel(song.origTonic,"minor"))} usa os mesmos acordes de <b>${esc(relMajor(song.origTonic))}</b> maior, então aqui ela é lida como ${esc(relMajor(song.origTonic))} e o ${esc(keyLabel(song.origTonic,"minor"))} vira o <b>VIm</b>. Quer só teclas brancas? Escolha o tom <b>C</b>: a música fica em Am, F, C, G, Dm, Em.`);
  tips.push(`Escala de <b>${esc(keyLabel(KT.tonic,KT.mode))}</b>: <b>${scale.join(" ")}</b> — ${acc.length ? `${acc.length} ${sharps?"sustenido"+(sharps>1?"s":""):"bemol"+(flats>1?"is":"")} (${acc.join(", ")})` : "só teclas brancas"}.`);
  const odd = scale.filter(n => ["E#","B#","Cb","Fb"].includes(n));
  if (odd.length) tips.push(odd.map(n => `<b>${n}</b> é a tecla branca <b>${({"E#":"F","B#":"C","Cb":"B","Fb":"E"})[n]}</b>`).join("; ") + ". O nome muda só para cada letra aparecer uma vez na escala.");
  const blacks = SCALE[KT.mode].map(iv => (KT.pc+iv)%12).filter(pc => [1,3,6,8,10].includes(pc)).length;
  if (blacks >= 4) tips.push(`Neste tom a mão fica “em cima” das teclas pretas (${blacks} das 7 notas). Apoie o polegar nas brancas (${scale.filter((n,i)=>![1,3,6,8,10].includes((KT.pc+SCALE[KT.mode][i])%12)).join(" e ")}) e deixe os outros dedos nas pretas.`);
  if (shift) {
    const up = shift <= 6, n = up ? shift : 12-shift;
    tips.push(`Original em <b>${esc(keyLabel(K0.tonic,K0.mode))}</b> → culto em <b>${esc(keyLabel(KT.tonic,KT.mode))}</b>: tudo ${up?"sobe":"desce"} ${n} semitom${n>1?"s":""}. Os graus (I, IV, V…) continuam os mesmos — é isso que você decora.`);
  }
  // most repeated progression
  const seq = []; chords.forEach(c => { const r = ROMAN[(c.root-K0.pc+12)%12] + (cls(c)==="m"?"m":cls(c)==="d"?"°":""); if (seq[seq.length-1] !== r) seq.push(r); });
  const counts = {};
  for (let i = 0; i + 4 <= seq.length; i++) { const k = seq.slice(i,i+4).join(" – "); counts[k] = (counts[k]||0)+1; }
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  if (top && top[1] >= 2) {
    const named = {"I – V – VIm – IV":"a progressão mais usada no louvor", "VIm – IV – I – V":"a mesma de cima começando no VIm", "IV – V – VIm – I":""};
    const ex = top[0].split(" – ").map(r => { const iv = Object.keys(ROMAN).find(k => ROMAN[k]===r.replace(/m|°/g,"")); return spell(KT.pc + Number(iv), KT) + (r.endsWith("m")?"m":r.endsWith("°")?"°":""); });
    tips.push(`Sequência que mais se repete: <b>${top[0]}</b> (${top[1]}x)${named[top[0]]?" — "+named[top[0]]:""}. Em ${esc(keyLabel(KT.tonic,KT.mode))}: <b>${ex.join(" – ")}</b>.`);
  }
  // out of field
  const seen = new Set();
  chords.forEach(c => {
    const k = classify(c, K0); if (k.kind === "dia") return;
    const lab = degreeLabel(Object.assign({}, c, {bass:null}), K0);
    if (seen.has(lab)) return; seen.add(lab);
    tips.push(`<b>${esc(chordName(Object.assign({}, c, {bass:null}), KT, shift))}</b> (${esc(lab)}) está fora do campo. ${k.why}`);
  });
  // cadence
  let vi = 0; for (let i=0;i+1<chords.length;i++){ const a=(chords[i].root-K0.pc+12)%12, b=(chords[i+1].root-K0.pc+12)%12; if (a===7 && b===0) vi++; }
  if (vi) tips.push(`A resolução <b>V → I</b> aparece ${vi}x: ${esc(spell(KT.pc+7,KT))} → ${esc(spell(KT.pc,KT))}${KT.mode==="minor"?"m":""}. Deixe a mão já preparada na posição do I.`);
  const sus = chords.some(c=>c.sus4);
  if (sus) tips.push(`Acordes com <b>4</b> (ex.: ${esc(spell(KT.pc+7,KT))}4) trocam a terça pela quarta. Toque o 4 e depois desça um dedo meio tom/um tom para o acorde normal.`);
  const f = fieldData(KT);
  tips.push(`Para treinar antes do culto: toque <b>${f[0].root+f[0].tri} – ${f[3].root+f[3].tri} – ${f[4].root+f[4].tri} – ${f[0].root+f[0].tri}</b> (I – IV – V – I) até sair sem olhar.`);
  return tips;
}

// Modo simplificado: só a tríade (G7M(9) → G, B4 → Bm, F#m/C# → F#m, A7(4) → A)
function simplifyChord(c, K0){
  const i = (c.root - K0.pc + 12) % 12;
  let q = cls(c);
  if (c.sus4 || c.sus2) { const e = EXP[K0.mode][i]; q = e ? e[0] : "M"; }
  return {root:c.root, rootName:c.rootName, suffix: q==="m" ? "m" : q==="d" ? "°" : "", bass:null,
    minor:q==="m", dim:q==="d", halfdim:false, maj7:false, aug:false, sus4:false, sus2:false, seven:false};
}
function renderLines(A){
  const {K0, KT, shift, lines} = A;
  refs = [];
  const out = [];
  for (const l of lines) {
    if (l.type === "sec") { out.push(`<div class="sec">${esc(l.text)}</div>`); continue; }
    if (l.type === "lyric") { out.push(`<div class="ln ly">${esc(l.text)||" "}</div>`); continue; }
    // chord line
    const cSegs = [], dSegs = [];
    let pEnd = -1, dEnd = -1, prevName = null;
    for (const t of l.toks) {
      if (!t.chord) { if (state.simple) continue; const col = Math.max(t.col, pEnd+1); cSegs.push({col, len:t.text.length, html:esc(t.text)}); pEnd = col + t.text.length; continue; }
      const ch = state.simple ? simplifyChord(t.chord, K0) : t.chord;
      const name = chordName(ch, KT, shift);
      if (state.simple && name === prevName) continue; // "A4 A" vira um "A" só
      prevName = name;
      const col = Math.max(t.col, pEnd+1);
      const ref = refs.push({chord:ch, name}) - 1;
      const pre = state.simple ? "" : t.pre, post = state.simple ? "" : t.post;
      const full = pre + name + post;
      const now = state.follow && state.follow.idx === ref ? " now" : "";
      cSegs.push({col, len:full.length, html: esc(pre) + `<button class="ch${now}" data-a="chord" data-r="${ref}">${esc(name)}</button>` + esc(post)});
      pEnd = col + full.length;
      const lab = degreeLabel(ch, K0), k = classify(ch, K0).kind;
      const dcol = Math.max(col + pre.length, dEnd+1);
      dSegs.push({col:dcol, len:lab.length, html: k==="dia" ? esc(lab) : `<span class="x-${k}">${esc(lab)}</span>`});
      dEnd = dcol + lab.length;
    }
    const join = segs => { let s = "", p = 0; for (const g of segs) { s += " ".repeat(Math.max(0, g.col - p)) + g.html; p = Math.max(p, g.col) + g.len; } return s; };
    out.push(`<div class="ln dl">${join(dSegs)}</div><div class="ln cl">${join(cSegs)}</div>`);
  }
  return out.join("");
}

  const field = fieldData(KT);
  const used = new Set(A.chords.filter(c=>classify(c,K0).kind==="dia").map(c => (c.root-K0.pc+12)%12));
  const tonics = TONICS[KT.mode];
  const tips = buildTips(song, A);

  return `

    ${state.mode === "letra" ? `<div class="tools">

function wheelKey(A){ return A.KT.mode === "major" ? A.KT : keyInfo(relMajor(A.KT.tonic), "major"); }
function refCell(r, A){ const s = simplifyChord(r.chord, A.K0); return cellOf((s.root + A.shift) % 12, cls(s), wheelKey(A)); }
function nextRefIdx(i){ let j = i + 1; while (refs[j] && refs[i] && refs[j].name === refs[i].name) j++; return refs[j] ? j : -1; }
function followPair(A){
  const i = state.follow.idx, j = nextRefIdx(i);
  return {i, j, cur: refCell(refs[i], A), next: j >= 0 ? refCell(refs[j], A) : null};
}
function followBar(A){
  const {i, j, cur, next} = followPair(A);

/* limpa o texto copiado do Cifra Club / Letras */
const JUNK_RE = /^\s*(tom:|afinação|afinacao|capotraste|capo\b|composição|composicao|colaboração|colaboracao|revisão|cifra club|cifraclub|letras\.mus|exibir|imprimir|compartilhar|enviar|ver (mais|todas|cifra)|videoaula|vídeo ?aula|aprenda|baixe|publicidade|anúncio|patrocinado|tags?:|favoritar|salvar|ouvir|simplificar|auto ?rolagem|transpor|mudar tom|meio tom|\d+([.,]\d+)?\s*(mil|k)?\s*exibições|cifra:|principal|acordes\s*$|letra\s*$|tablatura|tab\s*$|dicionário|sugerir|corrigir|última atualização|cifra simplificada)/i;
const TAB_RE = /^\s*[eEBGDA]\s*\|[-0-9|hpbrxs\/\\~().\s]*\|?\s*$/;
function cleanCifra(raw){
  const lines = raw.replace(/\r/g,"").replace(/ /g," ").replace(/\t/g,"    ").split("\n");
  let tom = null;
  for (const l of lines) { const m = l.match(/^\s*tom:\s*([A-G])([#b]?)(m(?!aj))?/i); if (m) { tom = {tonic: m[1].toUpperCase()+m[2], mode: m[3] ? "minor" : "major"}; break; } }
  const kept = [];
  for (const l of lines) {
    if (TAB_RE.test(l) || /^\s*parte \d+ de \d+\s*$/i.test(l)) continue;
    if (/^\s*\[?\s*tab\b/i.test(l)) continue;
    if (!parseChordLine(l) && l.trim().length < 70 && JUNK_RE.test(l)) continue;
    kept.push(l.replace(/\s+$/,""));
  }
  // nome/artista: linhas curtas antes do primeiro acorde ou seção
  let title = "", artist = "";
  const firstMusic = kept.findIndex(l => parseChordLine(l) || /^\s*\[[^\]]+\]/.test(l));
  if (firstMusic > 0) {
    const head = kept.slice(0, firstMusic).map(s=>s.trim()).filter(Boolean);
    if (head.length && head.length <= 4) { title = head[0].slice(0,80); artist = (head[1]||"").slice(0,80); kept.splice(0, firstMusic); }
  }
  const text = kept.join("\n").replace(/\n{3,}/g, "\n\n").replace(/^\n+|\n+$/g, "");
  if (tom) {
    const pc = pcOf(tom.tonic[0], tom.tonic.slice(1));
    if (!TONICS[tom.mode].includes(tom.tonic)) tom.tonic = DEFAULT_NAME[tom.mode][pc];
  }
  return {text, tom, title, artist};
}
function handlePaste(raw){
  const e = state.editing; if (!e || !raw || raw.trim().length < 10) return;
  readEditor();
  const r = cleanCifra(raw);
  const key = r.tom || detectKey(songChords(parseSong(r.text)));
  if (!songChords(parseSong(r.text)).length) { flashEditor("Não achei acordes nesse texto. Copie a página da cifra (não só a letra) e cole de novo."); return; }
  e.text = r.text;
  if (key) { e.origTonic = key.tonic; e.origMode = key.mode; }
  if (!e.targetChosen || !TONICS[e.origMode].includes(e.targetTonic)) e.targetTonic = e.origTonic;
  if (!e.name.trim() && r.title) e.name = r.title;
  if (!e.artist.trim() && r.artist && r.title) e.artist = r.artist;
  if (!e.name.trim()) { render(); flashEditor("Cifra colada! Agora escreva o nome da música e toque em Salvar."); $("#f-name").focus(); return; }
  saveEditing(`Música salva ✓ Original em ${esc(keyLabel(e.origTonic,e.origMode))}${e.targetTonic!==e.origTonic ? `, tocando em ${esc(keyLabel(e.targetTonic,e.origMode))}` : ". Toque num tom abaixo para mudar"}.`);
}
function flashEditor(msg){ const el = $("#f-msg"); if (el) { el.textContent = msg; el.hidden = false; } }
function saveEditing(notice){
  const e = state.editing;
  if (!TONICS[e.origMode].includes(e.targetTonic)) e.targetTonic = e.origTonic;
  const song = {id:e.id, name:e.name.trim(), artist:e.artist.trim(), text:e.text, origTonic:e.origTonic, origMode:e.origMode, targetTonic:e.targetTonic, capo:e.capo||0, youtube:ytLink(e.youtube)};
  const i = state.songs.findIndex(s=>s.id===song.id);
  const old = i >= 0 ? state.songs[i] : null;
  // mantém a história se nome e artista não mudaram
  if (old && old.info && norm(old.name) === norm(song.name) && norm(old.artist) === norm(song.artist)) song.info = old.info;
  if (i >= 0) state.songs[i] = song; else state.songs.push(song);
  persist(song);

  state.notice = notice || "";
  state.currentId = song.id; state.view = "song"; state.sheet = null; state.follow = null; state.wheelSel = null; render(); scrollTo(0,0);
}

/* ---------- história da música / sobre o artista ----------
   Pesquisada na internet pelo Claude no chat e gravada na coleção compartilhada "info"

function slug(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60) || "x"; }
function songInfoId(song){ return "musica--" + slug(song.name) + "--" + slug(song.artist); }
function artistInfoId(name){ return "artista--" + slug(name); }
function infoFor(song){ return state.infoDocs[songInfoId(song)] || null; }
function rerenderKeepScroll(){ const y = scrollY; render(); scrollTo(0, y); }
const str = (v, max) => typeof v === "string" && v.trim() ? v.trim().slice(0, max||1500) : null;
function googleUrl(q){ return "https://www.google.com/search?q=" + encodeURIComponent(q); }
function sourcesHtml(list){
  const ok = (Array.isArray(list) ? list : []).filter(x => x && typeof x.url === "string" && /^https:\/\//.test(x.url)).slice(0,6);
  return ok.length ? `<p class="muted" style="font-size:12px;margin-top:12px">Fontes: ${ok.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener" style="color:var(--ink)">${esc(str(x.titulo, 80) || x.url.replace(/^https:\/\/(www\.)?/,"").split("/")[0])}</a>`).join(" · ")}</p>` : "";
}

function infoPanel(song){

/* ---------- chord sheet + keyboard ---------- */
function keyboard(rhPcs, bassPc, scalePcs, names){
  const on = new Map(); // position -> label
  if (bassPc !== null) on.set(bassPc, {bass:true, name:names[bassPc]});
  rhPcs.forEach(pc => on.set(12+pc, {bass:false, name:names[pc]}));
  return kbMarks(on, scalePcs);
}
// teclado de 2 oitavas; `on` = posição (0–23) → {name, bass}
function kbMarks(on, scalePcs){
  const W = [0,2,4,5,7,9,11], B = {1:0,3:1,6:3,8:4,10:5};
  let whites = "", blacks = "";
  for (let o = 0; o < 2; o++) {
    W.forEach(pc => { const p = o*12+pc, n = on.get(p);
      whites += `<div class="w ${scalePcs.includes(pc)?"sc":""} ${n?"on":""} ${n&&n.bass?"bass":""}">${n?`<span class="lab">${esc(n.name)}</span>`:""}</div>`; });
    Object.keys(B).forEach(k => { const pc = +k, p = o*12+pc, n = on.get(p), wi = o*7 + B[pc] + 1;
      blacks += `<div class="b ${scalePcs.includes(pc)?"sc":""} ${n?"on":""} ${n&&n.bass?"bass":""}" style="left:calc(${wi}*100%/14 - 100%/14*0.31)">${n?`<span class="lab">${esc(n.name)}</span>`:""}</div>`; });
  }
  return `<div class="kb" aria-hidden="true">${whites}${blacks}</div>`;
}
function renderSheet(){
  const el = $("#sheet");
  if (!state.sheet || state.view !== "song") { el.hidden = true; el.innerHTML = ""; return; }
  const song = current(); if (!song) { el.hidden = true; return; }
  const A = analyse(song), {K0, KT, shift} = A;
  const c = state.sheet.chord;
  const name = chordName(c, KT, shift);
  const k = classify(c, K0);
  const lab = degreeLabel(c, K0);
  const ints = chordInts(c);
  const root = (c.root + shift) % 12;
  const pcs = ints.map(i => (root + i) % 12);
  const names = {}; for (let p=0;p<12;p++) names[p] = spell(p, KT);
  const bass = c.bass !== null ? (c.bass + shift) % 12 : root;
  const why = k.kind === "dia" ? `${FUNC_NAME[k.fn]} do campo de ${keyLabel(KT.tonic,KT.mode)}.` : k.why;
  const scalePcs = SCALE[KT.mode].map(iv => (KT.pc+iv)%12);
  el.innerHTML = `<div class="bsheet-in">
    <div class="bs-top">
      <div class="bs-info"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="bs-name">${esc(name)}</span><span class="bs-deg">${esc(lab)}</span></div>
      <div class="bs-why">${why}</div></div>
      <button class="btn" data-a="close" aria-label="Fechar">✕</button>
    </div>
    <div class="notes"><span class="bass">baixo ${esc(names[bass])}</span>${pcs.map(p=>`<span>${esc(names[p])}</span>`).join("")}</div>
    ${state.instrument === "violao"
      ? `<div class="gd-wrap">${guitarDiagram(root, chordQ(c), name)}<div class="gd-cap">Bolinha vermelha = tônica (a nota do nome do acorde)${c.bass !== null ? `<br>Baixo em <b>${esc(names[bass])}</b>: toque essa nota na corda mais grave` : ""}${/9|11|13|6|add/.test(c.suffix) ? "<br>Desenho do acorde básico, sem as notas extras" : ""}</div></div>`
      : `${keyboard(pcs, bass, scalePcs, names)}<div class="kb-cap"><span>mão esquerda: baixo</span><span>mão direita: acorde · pontinhos = escala</span></div>`}
  </div>`;
  el.hidden = false;
}

  else if (a === "fnext") { const j = nextRefIdx(state.follow.idx); if (j >= 0) { state.follow.idx = j; render(); scrollToNow(); } }
  else if (a === "fprev") { if (state.follow.idx > 0) { state.follow.idx--; render(); scrollToNow(); } }
  else if (a === "fstop") { state.follow = null; render(); }
  else if (a === "field") {
    const s = current(); const A = analyse(s); const f = fieldData(A.KT)[+b.dataset.d];
    // build chord in ORIGINAL key so analysis/transposition paths stay the same
    const tet = parseChord("C" + f.tet);
    state.sheet = {chord: Object.assign(tet, {root:(A.K0.pc + f.iv)%12, rootName:"", bass:null})};
    renderSheet();
  }
  else if (a === "close") { state.sheet = null; renderSheet(); }
});
document.addEventListener("input", ev => {
  if (bsInput(ev.target) || stInput(ev.target)) return;
  if (ev.target.id === "bb-ask-q") { BIBLE_ASK.question = ev.target.value; return; }
  if (ev.target.id === "cm-handle") { clearTimeout(commCheckHandle.t); const v = ev.target.value; commCheckHandle.t = setTimeout(() => commCheckHandle(v), 450); return; }
  if (ev.target.id === "cm-q") { const q = norm(ev.target.value); document.querySelectorAll(".cm-person").forEach(el => el.hidden = !!q && !el.dataset.s.includes(q)); return; }
  if (ev.target.id === "q") { state.q = ev.target.value; const pos = ev.target.selectionStart; render(); const q = $("#q"); q.focus(); try { q.setSelectionRange(pos,pos); } catch(e){} }
  if (ev.target.id === "f-name" || ev.target.id === "f-artist") {
    const a = $("#f-search"); if (a) a.href = searchUrl($("#f-name").value + " " + $("#f-artist").value);
    state.editing.name = $("#f-name").value; state.editing.artist = $("#f-artist").value; saveDraft();
  }
  if (ev.target.id === "f-text") { clearTimeout(updateDetect.t); updateDetect.t = setTimeout(() => { state.editing.text = ev.target.value; updateDetect(); saveDraft(); }, 250); }
  if (ev.target.id === "f-paste") {
    // reserva: alguns teclados colam sem disparar o evento "paste"
    clearTimeout(handlePaste.t); const v = ev.target.value;
    handlePaste.t = setTimeout(() => { if (v.trim().length > 20) handlePaste(v); }, 400);
  }
});
document.addEventListener("paste", ev => {
  if (ev.target.id !== "f-paste") return;
  const t = ev.clipboardData && ev.clipboardData.getData("text/plain");
  if (t) { ev.preventDefault(); clearTimeout(handlePaste.t); handlePaste(t); }
});
document.addEventListener("submit", ev => {
  if (ev.target.id === "bb-ask-form") { ev.preventDefault(); bibleAskSend(); return; }
  if (ev.target.id === "cm-form") { ev.preventDefault(); commSaveProfile(); return; }
  if (ev.target.id === "pl-form") { ev.preventDefault(); plSubmit(); return; }
  if (ev.target.id === "ag-form") { ev.preventDefault(); agSaveForm(); return; }
  if (ev.target.id === "bb-search-form") { ev.preventDefault(); bibleSearch(($("#bb-q") || {}).value || ""); return; }
  if (ev.target.id === "cm-post-form") { ev.preventDefault(); commPublish(); return; }
  if ((ev.target.id === "cm-comment-form" || ev.target.id === "pf-bc-form" || ev.target.id === "dm-form") && !termsGate()) { ev.preventDefault(); return; }
  if (ev.target.id === "cm-comment-form") { ev.preventDefault(); commAddComment(); return; }
  if (ev.target.id === "aj-pass") { ev.preventDefault(); ajPass(); return; }
  if (ev.target.id === "ct-form") { ev.preventDefault(); ctSend(); return; }
  if (ev.target.id === "dm-form") { ev.preventDefault(); dmSend(); return; }
  if (ev.target.id === "pf-bc-form") { ev.preventDefault(); pfBcSend(ev.target.dataset.b); return; }
  if (ev.target.id !== "login-form") return;
  ev.preventDefault(); teamAuth(state.loginTab === "up" ? "signup" : "in");
});
document.addEventListener("cancel",ev=>{if(ev.target.id==="st-native-camera")stNativeCancel();},true);
document.addEventListener("change", ev => {
  if (ev.target.id === "bs-import") { bsImport(ev.target.files && ev.target.files[0]); return; }
  if (["st-gallery-file","st-gallery-more"].includes(ev.target.id)) { stGalleryChoose(ev.target.files); return; }
  if (ev.target.id === "st-native-camera") { stNativeChoose(ev.target.files && ev.target.files[0]); return; }
  if (ev.target.id === "st-file") { stPick(ev.target.files && ev.target.files[0]); return; }
  if (ev.target.id === "cm-theme-any" && state.cmEdit) { commReadEdit(); state.cmEdit.theme = ev.target.value.toLowerCase(); rerenderKeepScroll(); return; }
  if (ev.target.id === "pf-tag-q") { pfPick(ev.target.value); return; }
  if (ev.target.id === "bl-file") { if (ev.target.files && ev.target.files[0]) blPickFile(ev.target.files[0]); return; }
  if (commChange(ev.target)) return;
  if (ev.target.classList && ev.target.classList.contains("role-sel")) {
    TEAM.client.from("profiles").update({role: ev.target.value}).eq("id", ev.target.dataset.uid).then(({error}) => { if (error) flash("Não consegui mudar agora."); loadTeamUsers(); });
    return;
  }
  if (ev.target.id === "f-orig") { readEditor(); render(); saveDraft(); }
  if (ev.target.id === "f-import" && ev.target.files && ev.target.files[0]) {
    const fr = new FileReader();
    fr.onload = () => importRepertoire(String(fr.result));
    fr.onerror = () => setBackupMsg("Não consegui abrir esse arquivo.");
    fr.readAsText(ev.target.files[0]);
  }
  if (ev.target.id === "f-photo" && ev.target.files && ev.target.files[0]) {
    const e = state.artistEditing; e.name = $("#a-name").value;
    resizeImage(ev.target.files[0]).then(d => { e.photo = d; render(); })
      .catch(() => { const m = $("#f-msg"); if (m) { m.textContent = "Não consegui abrir essa foto. Tente outra (JPG ou PNG)."; m.hidden = false; } });
  }
  if (ev.target.id === "f-target") { readEditor(); state.editing.targetChosen = true; saveDraft(); }
});
document.addEventListener("keydown", blessedFeatureKeys);
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#modal").hidden) closePix(); });
document.addEventListener("keydown", ev => {
  if (ev.key !== "Tab" || !BIBLE_ASK.open) return;
  const box = $(".bb-ask"); if (!box) return;
  const els = [...box.querySelectorAll('button:not(:disabled),textarea:not(:disabled),input:not(:disabled),a[href]')].filter(el => el.getClientRects().length);
  const first = els[0], last = els[els.length-1]; if (!first) return;
  if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && teamRole() === "admin") loadTeamUsers(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && state.wantWake && !state.wake) toggleWake(); });

if (draft && draft.id) { state.editing = Object.assign({isNew:true, name:"", artist:"", text:"", origTonic:"G", origMode:"major", targetTonic:"G"}, draft); state.view = "editor"; }
{ const q = new URLSearchParams(location.search).get("blessing"); if (q && /^[0-9a-f-]{36}$/i.test(q)) { state.deepBlessing = q; state.view = "blessings"; try { history.replaceState(null, "", location.pathname); } catch(e) {} } }
{ const q = new URLSearchParams(location.search).get("foto"); if (q && /^[0-9a-f-]{36}$/i.test(q)) { state.deepPost = q; state.view = "community"; try { history.replaceState(null, "", location.pathname); } catch(e) {} } }
{const params=new URLSearchParams(location.search),conversation=params.get('conversation'),story=params.get('story');if(/^[a-f0-9-]{36}$/i.test(conversation||'')){state.deepConversation=conversation;state.view='community';}if(/^[a-f0-9-]{36}$/i.test(story||'')){state.pushStory=story;state.view='community';}if(conversation||story)history.replaceState(null,'',location.pathname);}
render();
initStore();
teamInit();

if (!window.claude) fetch("info.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : null).then(m => {

}).catch(() => {});
})();

<script>
// Atualiza sozinho: quando sai versão nova, o app troca e recarrega uma vez (o iPhone segurava a versão antiga).
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  addEventListener("load", () => navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(reg => {
    reg.update();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update(); });
  }).catch(() => {}));
}
</script>
