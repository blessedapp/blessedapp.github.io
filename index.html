    if (e.oldName && norm(e.oldName) !== norm(e.name)) // renomeou: leva as músicas junto
      state.songs.filter(s => norm(s.artist) === norm(e.oldName)).forEach(s => { s.artist = e.name; persist(s); });
    state.currentArtist = e.name; state.view = "artist"; render(); scrollTo(0,0);
  }
  else if (a === "artist-del") { state.artistEditing.name = $("#a-name").value; state.confirmDelete = true; render(); }
  else if (a === "artist-del-no") { state.artistEditing.name = $("#a-name").value; state.confirmDelete = false; render(); }
  else if (a === "artist-del-yes") { removeArtist(state.artistEditing.id); state.confirmDelete = false; state.view = "library"; render(); scrollTo(0,0); }
  else if (a === "tutorial") openTutorial();
  else if (a === "tut-ok") closePix();
  else if (a === "paste-clip") {
    navigator.clipboard.readText().then(t => {
      if (!t || t.trim().length < 10) { flashEditor("Não tem cifra copiada. Copie a cifra no Cifra Club e toque de novo."); return; }
      handlePaste(t);
    }).catch(() => flashEditor("O celular não deixou ler o que foi copiado. Segure o dedo no quadro abaixo e toque em Colar."));
  }
  else if (a === "new") { state.editing = {isNew:true, id:newId(), name:"", artist:b.dataset.n||"", text:"", origTonic:"G", origMode:"major", targetTonic:"G"}; state.confirmDelete=false; state.view = "editor"; render(); scrollTo(0,0); }
  else if (a === "edit") { const s = current(); state.editing = Object.assign({}, s, s.example ? {isNew:true, id:newId(), example:false} : {isNew:false}); state.confirmDelete=false; state.view = "editor"; state.sheet=null; render(); }
  else if (a === "cancel") { lsSet("cc-draft", null); state.view = state.editing.isNew ? "library" : "song"; render(); }
  else if (a === "use-detect") { const d = state.detected; if (!d) return; readEditor(); const keepTarget = state.editing.targetTonic===state.editing.origTonic; state.editing.origTonic = d.tonic; state.editing.origMode = d.mode; if (keepTarget || !TONICS[d.mode].includes(state.editing.targetTonic)) state.editing.targetTonic = d.tonic; render(); }
  else if (a === "save") {
    readEditor(); const e = state.editing;
    if (!e.name.trim()) { $("#f-name").focus(); $("#f-name").placeholder = "Dê um nome à música"; return; }
    saveEditing("");
  }
  else if (a === "set-toggle") {
    const id = b.dataset.id;
    state.setlist = state.setlist.includes(id) ? state.setlist.filter(x=>x!==id) : state.setlist.concat(id);
    persistSetlist(); render();
  }
  else if (a === "set-move") {
    const id = b.dataset.id, i = state.setlist.indexOf(id), j = i + Number(b.dataset.d);
    if (i < 0 || j < 0 || j >= state.setlist.length) return;
    const l = state.setlist.slice(); [l[i], l[j]] = [l[j], l[i]]; state.setlist = l;
    persistSetlist(); render();
  }
  else if (a === "set-clear") { state.confirmClear = true; render(); }
  else if (a === "set-clear-no") { state.confirmClear = false; render(); }
  else if (a === "set-clear-yes") { state.confirmClear = false; state.setlist = []; persistSetlist(); render(); }
  else if (a === "set-start") {
    const first = state.setlist.find(id => id==="exemplo" || songsAll().some(s=>s.id===id));
    if (first) { state.currentId = first; state.view = "song"; state.sheet = null; state.notice = ""; render(); scrollTo(0,0); }
  }
  else if (a === "del") { readEditor(); state.confirmDelete = true; render(); }
  else if (a === "del-no") { readEditor(); state.confirmDelete = false; render(); }
  else if (a === "del-yes") { removeSong(state.editing.id); state.view = "library"; render(); }
  else if (a === "tonic") setTarget(b.dataset.t);
  else if (a === "step") {
    const s = current(); const K = keyInfo(s.targetTonic||s.origTonic, s.origMode);
    const pc = (K.pc + Number(b.dataset.d) + 12) % 12;
    const pref = DEFAULT_NAME[s.origMode][pc];
    setTarget(pref, true);
  }
  else if (a === "font") { state.fontSize = Math.min(28, Math.max(11, state.fontSize + Number(b.dataset.d))); lsSet("cc-font", state.fontSize); const c = $(".cifra"); if (c) c.style.fontSize = state.fontSize + "px"; }
  else if (a === "wake") toggleWake();
  else if (a === "pix") openPix();
  else if (a === "safe") openSafe();
  else if (a === "locked") openLock(b.dataset.n);
  else if (a === "lock-login" || a === "lock-signup" || a === "go-signup") { closePix(); state.loginTab = a === "lock-login" ? "in" : "up"; TEAM.msg = ""; state.view = "login"; render(); scrollTo(0, 0); }
  else if (a === "scroll-artists") { const el = document.getElementById("artistas"); if (el) el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"}); }
  else if (a === "install-later") { lsSet("cc-install-later", Date.now() + 5 * 864e5); rerenderKeepScroll(); }
  else if (a === "install-now") { const e = INSTALL.evt; if (e) { e.prompt(); e.userChoice.finally(() => { INSTALL.evt = null; render(); }); } }
  else if (a === "yt-toggle") { state.ytHidden = !state.ytHidden; rerenderKeepScroll(); }
  else if (a === "yt-set") openYtModal();
  else if (a === "yt-save") saveYt(false);
  else if (a === "yt-clear") saveYt(true);
  else if (a === "login-tab") { state.loginTab = b.dataset.v; TEAM.msg = ""; render(); }
  else if (a === "team-out") { if (TEAM.client) TEAM.client.auth.signOut().finally(teamLeave); }
  else if (a === "team-check") { TEAM.client.auth.getUser().then(({data}) => data && data.user ? teamEnter(data.user).then(render) : null); }
  else if (a === "team-role") {
    const uid = b.dataset.uid, role = b.dataset.v;
    TEAM.client.from("profiles").update({role}).eq("id", uid).then(({error}) => { if (error) flash("Não consegui mudar agora."); loadTeamUsers(); });
  }
  else if (a === "mode") { state.mode = b.dataset.v; lsSet("cc-mode", state.mode); state.follow = null; state.sheet = null; rerenderKeepScroll(); }
  else if (a === "pdf") openPdfChoice();
  else if (a === "pdf-letra") exportPdf("letra");
  else if (a === "pdf-cifra") exportPdf("cifra");
  else if (a === "pix-copy") copyPix(false);
  else if (a === "pix-cc") copyPix(true);
  else if (a === "pix-close") closePix();
  else if (a === "inst") { state.instrument = b.dataset.v; lsSet("cc-inst", state.instrument); state.sheet = null; rerenderKeepScroll(); }
  else if (a === "capo" || a === "capo-set") {
    const s2 = current(); if (!s2) return;
    s2.capo = a === "capo" ? Math.max(0, Math.min(9, (s2.capo||0) + Number(b.dataset.d))) : Number(b.dataset.v);
    if (store.mode === "team") saveOverride(s2); else if (!s2.example) persist(s2);
    state.sheet = null; rerenderKeepScroll();
  }
  else if (a === "asmajor") { state.asMajor = b.dataset.v === "1"; lsSet("cc-asmajor", state.asMajor); state.sheet = null; render(); }
  else if (a === "simple") { state.simple = !state.simple; lsSet("cc-simple", state.simple); state.sheet = null; render(); }
  else if (a === "toggle") { const k = b.dataset.k; state[k] = !state[k]; lsSet({fieldOpen:"cc-field", tipsOpen:"cc-tips", wheelOpen:"cc-wheel", infoOpen:"cc-info"}[k], state[k]); rerenderKeepScroll(); }
  else if (a === "chord") {
    if (state.follow) { state.follow.idx = +b.dataset.r; render(); return; }
    state.sheet = {chord: refs[+b.dataset.r].chord}; renderSheet();
  }
  else if (a === "wheel") {
    const c = {ring:b.dataset.ring, i:+b.dataset.i};
    state.wheelSel = state.wheelSel && state.wheelSel.ring === c.ring && state.wheelSel.i === c.i ? null : c;
    const y = scrollY; render(); scrollTo(0, y);
  }
  else if (a === "wheel-all") { state.wheelAll = !state.wheelAll; const y = scrollY; render(); scrollTo(0, y); }
  else if (a === "follow") {
    state.follow = state.follow ? null : (refs.length ? {idx:0} : null);
    state.sheet = null; render();
    if (state.follow) scrollToNow();
  }
  else if (a === "fnext") { const j = nextRefIdx(state.follow.idx); if (j >= 0) { state.follow.idx = j; render(); scrollToNow(); } }
  else if (a === "fprev") { if (state.follow.idx > 0) { state.follow.idx--; render(); scrollToNow(); } }
  else if (a === "fstop") { state.follow = null; render(); }
  else if (a === "field") {
    const s = current(); const A = analyse(s); const f = fieldData(A.KT)[+b.dataset.d];
    // build chord in ORIGINAL key so analysis/transposition paths stay the same
    const tet = parseChord("C" + f.tet);
    state.sheet = {chord: Object.assign(tet, {root:(A.K0.pc + f.iv)%12, rootName:"", bass:null})};
    renderSheet();
  }
  else if (a === "close") { state.sheet = null; renderSheet(); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "bb-ask-q") { BIBLE_ASK.question = ev.target.value; return; }
  if (ev.target.id === "cm-handle") { clearTimeout(commCheckHandle.t); const v = ev.target.value; commCheckHandle.t = setTimeout(() => commCheckHandle(v), 450); return; }
  if (ev.target.id === "cm-q") { const q = norm(ev.target.value); document.querySelectorAll(".cm-person").forEach(el => el.hidden = !!q && !el.dataset.s.includes(q)); return; }
  if (ev.target.id === "q") { state.q = ev.target.value; const pos = ev.target.selectionStart; render(); const q = $("#q"); q.focus(); try { q.setSelectionRange(pos,pos); } catch(e){} }
  if (ev.target.id === "f-name" || ev.target.id === "f-artist") {
    const a = $("#f-search"); if (a) a.href = searchUrl($("#f-name").value + " " + $("#f-artist").value);
    state.editing.name = $("#f-name").value; state.editing.artist = $("#f-artist").value; saveDraft();
  }
  if (ev.target.id === "f-text") { clearTimeout(updateDetect.t); updateDetect.t = setTimeout(() => { state.editing.text = ev.target.value; updateDetect(); saveDraft(); }, 250); }
  if (ev.target.id === "f-paste") {
    // reserva: alguns teclados colam sem disparar o evento "paste"
    clearTimeout(handlePaste.t); const v = ev.target.value;
    handlePaste.t = setTimeout(() => { if (v.trim().length > 20) handlePaste(v); }, 400);
  }
});
document.addEventListener("paste", ev => {
  if (ev.target.id !== "f-paste") return;
  const t = ev.clipboardData && ev.clipboardData.getData("text/plain");
  if (t) { ev.preventDefault(); clearTimeout(handlePaste.t); handlePaste(t); }
});
document.addEventListener("submit", ev => {
  if (ev.target.id === "bb-ask-form") { ev.preventDefault(); bibleAskSend(); return; }
  if (ev.target.id === "cm-form") { ev.preventDefault(); commSaveProfile(); return; }
  if (ev.target.id === "ag-form") { ev.preventDefault(); agSaveForm(); return; }
  if (ev.target.id === "bb-search-form") { ev.preventDefault(); bibleSearch(($("#bb-q") || {}).value || ""); return; }
  if (ev.target.id === "cm-post-form") { ev.preventDefault(); commPublish(); return; }
  if (ev.target.id === "cm-comment-form") { ev.preventDefault(); commAddComment(); return; }
  if (ev.target.id !== "login-form") return;
  ev.preventDefault(); teamAuth(state.loginTab === "up" ? "signup" : "in");
});
document.addEventListener("change", ev => {
  if (commChange(ev.target)) return;
  if (ev.target.classList && ev.target.classList.contains("role-sel")) {
    TEAM.client.from("profiles").update({role: ev.target.value}).eq("id", ev.target.dataset.uid).then(({error}) => { if (error) flash("Não consegui mudar agora."); loadTeamUsers(); });
    return;
  }
  if (ev.target.id === "f-orig") { readEditor(); render(); saveDraft(); }
  if (ev.target.id === "f-import" && ev.target.files && ev.target.files[0]) {
    const fr = new FileReader();
    fr.onload = () => importRepertoire(String(fr.result));
    fr.onerror = () => setBackupMsg("Não consegui abrir esse arquivo.");
    fr.readAsText(ev.target.files[0]);
  }
  if (ev.target.id === "f-photo" && ev.target.files && ev.target.files[0]) {
    const e = state.artistEditing; e.name = $("#a-name").value;
    resizeImage(ev.target.files[0]).then(d => { e.photo = d; render(); })
      .catch(() => { const m = $("#f-msg"); if (m) { m.textContent = "Não consegui abrir essa foto. Tente outra (JPG ou PNG)."; m.hidden = false; } });
  }
  if (ev.target.id === "f-target") { readEditor(); state.editing.targetChosen = true; saveDraft(); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#modal").hidden) closePix(); });
document.addEventListener("keydown", ev => {
  if (ev.key !== "Tab" || !BIBLE_ASK.open) return;
  const box = $(".bb-ask"); if (!box) return;
  const els = [...box.querySelectorAll('button:not(:disabled),textarea:not(:disabled),input:not(:disabled),a[href]')].filter(el => el.getClientRects().length);
  const first = els[0], last = els[els.length-1]; if (!first) return;
  if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && teamRole() === "admin") loadTeamUsers(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && state.wantWake && !state.wake) toggleWake(); });

const draft = lsGet("cc-draft", null);
if (draft && draft.id) { state.editing = Object.assign({isNew:true, name:"", artist:"", text:"", origTonic:"G", origMode:"major", targetTonic:"G"}, draft); state.view = "editor"; }
{ const q = new URLSearchParams(location.search).get("foto"); if (q && /^[0-9a-f-]{36}$/i.test(q)) { state.deepPost = q; state.view = "community"; try { history.replaceState(null, "", location.pathname); } catch(e) {} } }
render();
initStore();
teamInit();
// versão site: as histórias pesquisadas vêm do arquivo info.json publicado junto
if (!window.claude) fetch("info.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : null).then(m => {
  if (m && typeof m === "object") { state.infoDocs = m; lsSet("cc-info-cache", m); if (state.view === "song" || state.view === "artist") rerenderKeepScroll(); }
}).catch(() => {});
})();
</script>

<script>
// Atualiza sozinho: quando sai versão nova, o app troca e recarrega uma vez (o iPhone segurava a versão antiga).
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  addEventListener("load", () => navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(reg => {
    reg.update();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update(); });
  }).catch(() => {}));
}
</script>
