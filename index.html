function dmmWavePaint(p){cancelAnimationFrame(p.waveFrame);const samples=new Uint8Array(256);let last=0;const draw=now=>{if(!dmmCurrent(p)||p.phase!=='recording')return;const canvas=document.querySelector('#dmm-wave');if(canvas){if(now-last>45){let level=0;if(p.analyser){p.analyser.getByteTimeDomainData(samples);level=Math.sqrt(samples.reduce((n,v)=>n+((v-128)/128)**2,0)/samples.length);}p.waveLevels=(p.waveLevels||[]).concat(Math.min(1,level*5)).slice(-64);last=now;}const g=canvas.getContext('2d'),w=canvas.width,h=canvas.height;g.clearRect(0,0,w,h);const levels=p.waveLevels||[],step=w/64;g.strokeStyle='#cf87ff';g.lineWidth=3;g.lineCap='round';for(let i=0;i<64;i++){const height=3+(levels[i-(64-levels.length)]||0)*(h-8);g.beginPath();g.moveTo(i*step+2,(h-height)/2);g.lineTo(i*step+2,(h+height)/2);g.stroke();}}p.waveFrame=requestAnimationFrame(draw);};p.waveFrame=requestAnimationFrame(draw);}
function dmmInline(p){const form=$('#dm-form');if(!form)return;form.classList.add('dm-record-mode');let bar=form.querySelector('.dmm-inline');if(!bar){bar=document.createElement('div');bar.className='dmm-inline';form.appendChild(bar);}bar.innerHTML=`<button type="button" class="dmm-round" data-a="dmm-cancel" aria-label="Cancelar áudio" ${p.busy?'disabled':''}>✕</button><div class="dmm-wave-body">${p.phase==='recording'?'<canvas id="dmm-wave" width="384" height="48" aria-label="Ondas da sua voz"></canvas><small role="status">Gravando · <b id="dmm-seconds">00:00</b></small>':p.phase==='permission'?'<span role="status">Permita o microfone…</span>':p.blob?`<audio class="dmm-preview-audio" src="${esc(p.url)}" controls preload="metadata"></audio>`:`<span>${esc(p.error||'Toque para tentar novamente')}</span>`}</div>${p.phase==='recording'?'<button type="button" class="dmm-round" data-a="dmm-stop" aria-label="Parar gravação">■</button>':p.blob?`<button type="button" class="dmm-round primary" data-a="dmm-send" aria-label="Enviar áudio" ${p.busy?'disabled':''}>${p.busy?'…':'↑'}</button>`:p.phase!=='permission'?'<button type="button" class="dmm-round" data-a="dmm-record" aria-label="Tentar gravar novamente">'+DMM_MIC_ICON+'</button>':''}${p.error&&p.blob?`<small role="alert">${esc(p.error)}</small>`:''}`;if(p.phase==='recording')dmmWavePaint(p);}
function dmmShow(p){if(!dmmCurrent(p))return;if(p.kind==='audio'){dmmInline(p);return;}const box=$('#modal');box.className='modal';box.innerHTML=`<section class="modal-box dmm-editor" role="dialog" aria-modal="true" aria-labelledby="dmm-title"><h2 id="dmm-title">${p.kind==='photo'?'Enviar foto':'Mensagem de áudio'}</h2>${p.phase==='recording'?'<p class="dmm-recording" role="status">● Gravando <b id="dmm-seconds">00:00</b></p><button class="btn primary" data-a="dmm-stop">Parar gravação</button>':p.phase==='permission'?'<p role="status">Permita o microfone para começar.</p>':p.phase==='processing'?'<p role="status">Preparando sua foto…</p>':p.blob?`${p.kind==='photo'?`<img class="dmm-preview" src="${esc(p.url)}" alt="Foto escolhida para enviar"><label>Legenda opcional<textarea id="dmm-caption" ${p.busy?'disabled':''} maxlength="2000" rows="2" placeholder="Escreva uma legenda…">${esc(p.caption||'')}</textarea></label>`:`<audio class="dmm-preview-audio" src="${esc(p.url)}" controls preload="metadata"></audio><p class="muted">${p.seconds} segundos · ouça antes de enviar.</p>`}<div class="actions"><button class="btn primary" data-a="dmm-send" ${p.busy?'disabled':''}>${p.busy?'Enviando…':p.kind==='photo'?'Enviar foto':'Enviar áudio'}</button>${p.kind==='audio'?'<button class="btn ghost" data-a="dmm-again" '+(p.busy?'disabled':'')+'>Gravar novamente</button>':''}</div>`:p.kind==='photo'?'<p>Escolha uma foto da sua galeria.</p><button class="btn" data-a="dmm-pick">Escolher foto</button>':'<p>Grave até 2 minutos. Você poderá ouvir antes de enviar.</p><button class="btn primary" data-a="dmm-record">Começar gravação</button>'}${p.error?`<p class="confirm" role="alert">${esc(p.error)}</p>`:''}<button class="btn ghost" data-a="pix-close" ${p.busy?'disabled':''}>Cancelar</button><p class="muted" style="font-size:12px">Só as duas pessoas desta conversa têm acesso ao arquivo.</p></section>`;box.hidden=false;}
function dmmPick(p){if(!dmmCurrent(p))return;const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>{const f=input.files?.[0];if(f)dmmPhoto(p,f);};input.click();}
async function dmmPreparePhoto(file,maxEdge=1920){if(!file.type.startsWith('image/')||file.size>25*1024*1024)throw Error('size');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();if(!img.naturalWidth||img.naturalWidth*img.naturalHeight>60000000)throw Error('size');const ratio=Math.min(1,maxEdge/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.84));if(!blob||blob.size>10485760)throw Error('size');return blob;}finally{URL.revokeObjectURL(url);}}
async function dmmPhoto(p,file){if(!dmmCurrent(p))return;p.phase='processing';p.error='';dmmShow(p);try{const blob=await dmmPreparePhoto(file);if(!dmmCurrent(p))return;if(p.url)URL.revokeObjectURL(p.url);Object.assign(p,{blob,mime:'image/jpeg',ext:'jpg',url:URL.createObjectURL(blob),phase:'preview'});}catch(e){if(dmmCurrent(p)){p.phase='pick';p.error='Não consegui abrir essa foto. Escolha uma imagem JPG ou PNG de até 25 MB.';}}finally{dmmShow(p);}}

async function dmmRecord(p){if(!dmmCurrent(p)||p.phase==='permission'||p.phase==='recording')return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){p.error='Este navegador não grava áudio. Abra o Blessed no Safari ou Chrome atualizado.';dmmShow(p);return;}if(p.url)URL.revokeObjectURL(p.url);Object.assign(p,{url:null,blob:null,phase:'permission',error:''});dmmShow(p);let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});if(!dmmCurrent(p)){stream.getTracks().forEach(t=>t.stop());return;}const type=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t));if(!type)throw Error('format');const recorder=new MediaRecorder(stream,{mimeType:type,audioBitsPerSecond:96000});Object.assign(p,{stream,recorder,chunks:[],bytes:0,tooLarge:false,recordError:false,stopAt:null,start:Date.now(),phase:'recording',mime:type.split(';')[0],ext:type.startsWith('audio/mp4')?'m4a':type.startsWith('audio/ogg')?'ogg':'webm'});recorder.ondataavailable=e=>{if(e.data.size){p.bytes+=e.data.size;p.chunks.push(e.data);if(p.bytes>10485760){p.tooLarge=true;dmmStop(p);}}};recorder.onerror=()=>{p.recordError=true;dmmStop(p);};recorder.onstop=()=>{dmmWaveStop(p);clearInterval(p.timer);clearTimeout(p.limit);stream.getTracks().forEach(t=>t.stop());if(!dmmCurrent(p))return;const blob=new Blob(p.chunks,{type:p.mime});p.chunks=[];if(p.tooLarge||p.recordError||!blob.size){p.phase='pick';p.error='Não consegui concluir o áudio. Tente gravar novamente.';}else Object.assign(p,{blob,url:URL.createObjectURL(blob),seconds:Math.max(1,Math.min(120,Math.ceil(((p.stopAt||Date.now())-p.start)/1000))),phase:'preview'});dmmShow(p);};recorder.start(1000);dmmWaveStart(p);p.timer=setInterval(()=>{const el=$('#dmm-seconds');if(el)el.textContent=prClock(Math.min(120000,Date.now()-p.start)).slice(-5);},250);p.limit=setTimeout(()=>dmmStop(p),120000);stream.getTracks().forEach(t=>{t.onended=()=>dmmStop(p);});dmmShow(p);}catch(e){stream?.getTracks().forEach(t=>t.stop());if(dmmCurrent(p)){p.phase='pick';p.error=e.name==='NotAllowedError'?'O microfone não foi autorizado. Permita o acesso nas configurações do navegador e tente novamente.':e.name==='NotFoundError'?'Nenhum microfone foi encontrado.':'Não consegui iniciar a gravação. Confira o microfone e tente novamente.';dmmShow(p);}}}
function dmmStop(p){if(p?.recorder?.state==='recording'){p.stopAt=Date.now();p.recorder.stop();p.stream?.getTracks().forEach(t=>t.stop());clearInterval(p.timer);clearTimeout(p.limit);}}
async function dmmSend(p){if(!dmmCurrent(p)||!p.blob||p.busy||DM.busy)return;p.caption=($('#dmm-caption')?.value||'').trim().slice(0,2000);p.busy=true;p.error='';DM.busy=true;dmmShow(p);const path=p.owner+'/'+p.conv+'/'+crypto.randomUUID()+'.'+p.ext;let uploaded=false,committed=false;try{const up=await p.client.storage.from('chat-media').upload(path,p.blob,{contentType:p.mime,cacheControl:'0',upsert:false});if(up.error)throw up.error;uploaded=true;if(!dmmCurrent(p))return;const {data,error}=await p.client.from('messages').insert({conversation_id:p.conv,author:p.owner,text:p.caption||(p.kind==='photo'?'📷 Foto':'🎤 Áudio'),media_kind:p.kind,media_path:path,media_mime:p.mime,media_bytes:p.blob.size,media_seconds:p.kind==='audio'?p.seconds:null}).select(DMM_FIELDS).single();if(error)throw error;committed=true;if(dmmCurrent(p)){p.busy=false;DM.busy=false;closePix();dmIncoming(data);ntfSound('sent');}}catch(e){if(dmmCurrent(p)){p.busy=false;p.error=navigator.onLine?'Não foi possível enviar. Confira sua conexão e tente novamente.':'Sem internet. Sua prévia continua aqui para tentar novamente.';dmmShow(p);}}finally{if(uploaded&&!committed&&TEAM.user?.id===p.owner&&DM.generation===p.generation)await p.client.storage.from('chat-media').remove([path]).catch(()=>{});if(TEAM.user?.id===p.owner&&DM.generation===p.generation)DM.busy=false;}}
function dmmCached(path){const item=DMM.urls.get(path);return item&&item.until>Date.now()?item.url:null;}
function dmmFile(m,url){return m.media_kind==='photo'?`<button class="dmm-photo" data-a="dmm-view" data-id="${esc(m.id)}" aria-label="Abrir foto enviada"><img src="${esc(url)}" loading="lazy" alt="Foto enviada na conversa" data-dmm-id="${esc(m.id)}"></button>`:`<audio data-dmm-audio="${esc(m.id)}" data-dmm-id="${esc(m.id)}" src="${esc(url)}" controls preload="metadata"></audio>`;}

async function dmmHydrate(target){if(!TEAM.user||state.view!=='chat')return;const owner=TEAM.user.id,generation=DM.generation,conv=DM.open,client=TEAM.client;const rows=(DM.msgs[conv]||[]).filter(m=>m.media_path&&(target?m.id===target:true)).slice(-30);const need=rows.filter(m=>!dmmCached(m.media_path));if(!need.length||DMM.signing)return;DMM.signing=true;try{const {data,error}=await client.storage.from('chat-media').createSignedUrls(need.map(m=>m.media_path),900);if(owner!==TEAM.user?.id||generation!==DM.generation)return;if(!error)for(const r of data||[])if(r.signedUrl&&r.path){DMM.urls.set(r.path,{url:r.signedUrl,until:Date.now()+840000});}while(DMM.urls.size>350)DMM.urls.delete(DMM.urls.keys().next().value);if(state.view==='chat'&&DM.open===conv)for(const m of rows){const url=dmmCached(m.media_path),el=document.querySelector('[data-dmm-file="'+CSS.escape(m.id)+'"]');if(url&&el&&!el.querySelector('audio,img'))el.innerHTML=dmmFile(m,url);}}catch(e){}finally{if(generation===DM.generation)DMM.signing=false;}}

function dmmRestoreAudio(list){for(const old of list){const el=document.querySelector('audio[data-dmm-audio="'+CSS.escape(old.id)+'"]');if(!el)continue;const resume=()=>{el.currentTime=old.time;el.playbackRate=old.rate;if(!old.paused)el.play().catch(()=>{});};if(el.readyState>=1)resume();else el.addEventListener('loadedmetadata',resume,{once:true});}}
function dmmClick(a,b){if(a==='dmm-cancel'){if(!DMM.panel?.busy)dmmClose();}else if(a==='dmm-photo'){const p=dmmPanel('photo');if(p){dmmShow(p);dmmPick(p);}}else if(a==='dmm-audio'){const p=dmmPanel('audio');if(p)dmmRecord(p);}else if(a==='dmm-pick')dmmPick(DMM.panel);else if(a==='dmm-record'||a==='dmm-again')dmmRecord(DMM.panel);else if(a==='dmm-stop')dmmStop(DMM.panel);else if(a==='dmm-send')dmmSend(DMM.panel);else if(a==='dmm-fetch')dmmHydrate(b.dataset.id);else if(a==='dmm-view'){const m=(DM.msgs[DM.open]||[]).find(m=>m.id===b.dataset.id),url=m&&dmmCached(m.media_path);if(url){closePix();const box=$('#modal');box.className='modal';box.innerHTML=`<section class="modal-box" role="dialog" aria-modal="true" aria-label="Foto da conversa"><img class="dmm-preview" src="${esc(url)}" alt="Foto da conversa"><button class="btn ghost" data-a="pix-close">Fechar</button></section>`;box.hidden=false;}}}

/* Papel de parede local, separado por conta e conversa. Não envia a imagem ao destinatário. */
const DWP={key:null,url:null,request:0,edit:null};
function dwpKey(){return TEAM.user&&DM.open?TEAM.user.id+':'+DM.open:null;}
function dwpCloseEditor(){const p=DWP.edit;if(p?.url)URL.revokeObjectURL(p.url);DWP.edit=null;const box=$('#modal');if(box?.querySelector('#dwp-title')){box.hidden=true;box.innerHTML='';}}
function dwpReset(){dwpCloseEditor();if(DWP.url)URL.revokeObjectURL(DWP.url);DWP.url=null;DWP.key=null;DWP.request++;}
function dwpStore(mode,key,blob){return new Promise((resolve,reject)=>{let db;const open=indexedDB.open('blessed-chat-wallpaper',1);open.onupgradeneeded=()=>open.result.createObjectStore('wallpapers');open.onerror=()=>reject(Error('storage'));open.onsuccess=()=>{db=open.result;let tx,request;try{tx=db.transaction('wallpapers',mode==='get'?'readonly':'readwrite');const store=tx.objectStore('wallpapers');request=mode==='get'?store.get(key):mode==='delete'?store.delete(key):store.put(blob,key);tx.oncomplete=()=>{const result=request.result;db.close();resolve(result);};tx.onerror=tx.onabort=()=>{db.close();reject(Error('storage'));};}catch(e){db.close();reject(e);}};});}
function dwpPaint(){const list=$('#dm-list');if(!list||DWP.key!==dwpKey())return;list.style.backgroundImage=DWP.url?'linear-gradient(#0c0b0e99,#0c0b0eb8),url("'+DWP.url+'")':'';list.classList.toggle('dwp-on',!!DWP.url);}
async function dwpLoad(){const key=dwpKey();if(!key||state.view!=='chat')return;if(DWP.key===key){dwpPaint();return;}if(DWP.url)URL.revokeObjectURL(DWP.url);DWP.key=key;DWP.url=null;const request=++DWP.request;try{const blob=await dwpStore('get',key);if(request!==DWP.request||key!==dwpKey()||state.view!=='chat')return;if(blob instanceof Blob)DWP.url=URL.createObjectURL(blob);dwpPaint();}catch(e){/* Sem imagem salva: conversa continua com o fundo padrão. */}}
function dwpCurrent(p){return p&&DWP.edit===p&&p.key===dwpKey()&&p.owner===TEAM.user?.id&&p.generation===DM.generation&&state.view==='chat';}
function dwpMenu(){closePix();if(DMM.panel?.busy)return;DWP.edit={key:dwpKey(),owner:TEAM.user?.id,generation:DM.generation,busy:false};dwpShow(DWP.edit);}
function dwpShow(p){if(!dwpCurrent(p))return;const box=$('#modal');box.className='modal';box.innerHTML=`<section class="modal-box dmm-editor" role="dialog" aria-modal="true" aria-labelledby="dwp-title"><h2 id="dwp-title">Papel de parede</h2><p class="muted">Escolha uma foto da galeria para esta conversa. Só você verá, neste aparelho.</p>${p.url?`<div class="dwp-example" style="background-image:linear-gradient(#0c0b0e88,#0c0b0eaa),url('${esc(p.url)}')"><span>Assim ficará sua conversa</span><b>Uma nova mensagem ✨</b></div>`:''}${p.error?`<p class="confirm" role="alert">${esc(p.error)}</p>`:''}<button class="btn" data-a="dwp-pick" ${p.busy?'disabled':''}>Escolher foto da galeria</button>${p.blob?`<button class="btn primary" data-a="dwp-save" ${p.busy?'disabled':''}>${p.busy?'Salvando…':'Usar nesta conversa'}</button>`:''}<button class="btn ghost" data-a="dwp-clear" ${p.busy?'disabled':''}>Restaurar fundo padrão</button><button class="btn ghost" data-a="pix-close" ${p.busy?'disabled':''}>Cancelar</button></section>`;box.hidden=false;}
function dwpPick(){const p=DWP.edit;if(!dwpCurrent(p)||p.busy)return;const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=async()=>{const file=input.files?.[0];if(!file)return;p.busy=true;p.error='';dwpShow(p);try{const blob=await dmmPreparePhoto(file,1600);if(!dwpCurrent(p))return;if(p.url)URL.revokeObjectURL(p.url);p.blob=blob;p.url=URL.createObjectURL(blob);}catch(e){if(dwpCurrent(p))p.error='Não consegui abrir essa foto. Escolha uma imagem JPG ou PNG de até 25 MB.';}finally{if(dwpCurrent(p)){p.busy=false;dwpShow(p);}}};input.click();}
async function dwpSave(clear=false){const p=DWP.edit;if(!dwpCurrent(p)||p.busy||(!clear&&!p.blob))return;p.busy=true;p.error='';dwpShow(p);try{await dwpStore(clear?'delete':'put',p.key,p.blob);if(!dwpCurrent(p))return;if(DWP.url)URL.revokeObjectURL(DWP.url);DWP.url=clear?null:URL.createObjectURL(p.blob);DWP.key=p.key;DWP.request++;p.busy=false;closePix();dwpPaint();flash(clear?'Fundo padrão restaurado.':'Papel de parede salvo neste aparelho ✓');}catch(e){if(dwpCurrent(p)){p.busy=false;p.error='Não consegui salvar neste aparelho. Verifique o espaço disponível e tente novamente.';dwpShow(p);}}}

const DM = {generation:0, attentionReady:false, attention:null, attentionSeen:new Set(), attentionBusy:false, attentionSent:{}, shakeAt:0, convs: null, loading: false, msgs: {}, open: null, reads: {}, blocks: new Set(), ch: null, missing: false, busy: false};

async function dmLoad(incoming=null){
  const generation=DM.generation, client=TEAM.client, owner=TEAM.user?.id;
  if(!owner)return;
  const current=()=>DM.generation===generation&&TEAM.client===client&&TEAM.user?.id===owner;
  const [c, r, k] = await Promise.all([
    TEAM.client.from("conversations").select("*").order("last_at", {ascending: false}).limit(200),
    TEAM.client.from("chat_reads").select("conversation_id,read_at").eq("user_id", TEAM.user.id),
    TEAM.client.from("chat_blocks").select("blocked_id").eq("user_id", TEAM.user.id)]);
  if(!current())return;
  if (c.error) { DM.missing = /does not exist|schema cache/i.test(c.error.message || ""); DM.convs = []; dmRerender(); return; }
  DM.convs = c.data || [];
  (r.data || []).forEach(x => DM.reads[x.conversation_id] = x.read_at);
  DM.blocks = new Set((k.data || []).map(x => x.blocked_id));
  const need = [...new Set(DM.convs.map(dmOther))].filter(u => !COMM.profiles[u]);
  if (need.length) { const {data} = await client.from("community_profiles").select(PF_PROF).in("id", need); if(!current())return; commKeep(data); }
  if(!current())return;
  try{const media=await client.rpc("dm_media_ready");if(!current())return;DMM.ready=media.data===true&&!media.error;}catch(e){}
  dmSubscribe(); dmRerender();
  if(state.deepConversation){const target=state.deepConversation;state.deepConversation=null;if(DM.convs.some(c=>c.id===target))dmOpen(target);}
  try{
    const ready=await client.rpc('dm_attention_ready');if(!current())return;
    DM.attentionReady=ready.data===true&&!ready.error;
    if(DM.attentionReady){
      const recent=await client.from('messages').select('id,conversation_id,author,text,created_at').eq('text',DM_ATTENTION_TEXT).order('created_at',{ascending:false}).limit(30);
      if(!current())return;
      const latest=(recent.data||[]).filter(m=>m.author!==owner&&(!DM.reads[m.conversation_id]||DM.reads[m.conversation_id]<m.created_at)).sort((a,b)=>b.created_at.localeCompare(a.created_at))[0];
      if(latest&&latest.id!==incoming?.id)dmAttentionReceive(latest,false);
    }
  }catch(_){}finally{if(current())dmRerender();}
}
function dmSubscribe(){
  if (DM.ch) return;
  const owner=TEAM.user.id,generation=DM.generation;
  DM.ch = TEAM.client.channel("dm-" + TEAM.user.id)
    .on("postgres_changes", {event: "INSERT", schema: "public", table: "messages"}, p => {if(TEAM.user?.id===owner&&DM.generation===generation)dmIncoming(p.new);})
    .on("postgres_changes", {event: "DELETE", schema: "public", table: "messages"}, p => { if(TEAM.user?.id!==owner||DM.generation!==generation)return; const id = p.old && p.old.id; if (!id) return; Object.keys(DM.msgs).forEach(k => DM.msgs[k] = DM.msgs[k].filter(m => m.id !== id)); dmRerender(); })
    .subscribe();
}
function dmIncoming(m){
  if (!m || !DM.convs) return;
  const list = DM.msgs[m.conversation_id];
  if (list && !list.some(x => x.id === m.id)) list.push(m);
  const c = DM.convs.find(x => x.id === m.conversation_id);
  if (!c) { const generation=DM.generation; dmLoad(m).then(()=>{if(DM.generation===generation&&DM.convs?.some(c=>c.id===m.conversation_id))dmIncoming(m);}); return; }
  dmAttentionReceive(m,true);ntfMessage(m);
  Object.assign(c, {last_at: m.created_at, last_author: m.author, last_text: String(m.text).slice(0, 120)});
  DM.convs.sort((x, y) => x.last_at < y.last_at ? 1 : -1);
  if (state.view === "chat" && DM.open === m.conversation_id && m.author !== TEAM.user.id) dmMarkRead(m.conversation_id);
  dmRerender();
}
// redesenha sem perder o que está sendo digitado

  if (state.view === "chat") { render(); dmScroll(); } else rerenderKeepScroll();

function dmScroll(){ const l = $("#dm-list"); if (l) l.scrollTop = l.scrollHeight; }
async function dmWith(uid){
  if (!COMM.me) { flash("Crie seu perfil na Comunidade para mandar mensagens."); return; }
  if (DM.convs === null) { DM.loading = true; await dmLoad(); DM.loading = false; }
  if (DM.missing) { flash("As mensagens ainda não foram ligadas."); return; }
  const [a, b] = [TEAM.user.id, uid].sort();
  let c = DM.convs.find(x => x.a === a && x.b === b);
  if (!c) {
    const {data, error} = await TEAM.client.from("conversations").insert({a, b}).select("*").single();
    if (error) { const r = await TEAM.client.from("conversations").select("*").eq("a", a).eq("b", b).maybeSingle(); c = r.data; }
    else c = data;
    if (!c) { flash("Não consegui abrir a conversa agora."); return; }
    if (!DM.convs.some(x => x.id === c.id)) DM.convs.unshift(c);

}
function dmOpen(id){

  DM.open = id; state.view = "chat";
  if(DM.attention?.conversation_id===id){DM.attention=null;dmAttentionPaint();}
  if (!DM.msgs[id]) dmLoadMsgs(id);
  dmMarkRead(id); render(); dmScroll(); dmSafeNotice(false);
}
async function dmLoadMsgs(id){
  const owner=TEAM.user?.id,generation=DM.generation;
  const {data} = await TEAM.client.from("messages").select(DMM.ready?DMM_FIELDS:"id,conversation_id,author,text,created_at").eq("conversation_id", id).order("created_at", {ascending: false}).limit(300);
  if(TEAM.user?.id!==owner||DM.generation!==generation)return;
  DM.msgs[id] = (data || []).reverse();
  if (state.view === "chat" && DM.open === id) dmRerender();
}
function dmMarkRead(id){
  const now = new Date().toISOString(); DM.reads[id] = now;

}
async function dmSend(){

function dmDay(iso){ const d = new Date(iso), t = new Date(); const y = new Date(t); y.setDate(t.getDate() - 1);
  return d.toDateString() === t.toDateString() ? "Hoje" : d.toDateString() === y.toDateString() ? "Ontem" : d.toLocaleDateString("pt-BR", {day: "2-digit", month: "short", year: d.getFullYear() === t.getFullYear() ? undefined : "numeric"}); }

// Foto reduzida no aparelho antes de enviar (pesa pouco e não manda a foto original com localização)
function commResize(file, max, cap){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); reject(); };
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = 0.85, d = c.toDataURL("image/jpeg", q);
      while (d.length > cap * 1.37 && q > 0.4) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
      resolve(d);
    };
    img.src = url;
  });
}
async function commUpload(dataUrl, kind, fixedPath){
  const blob = await (await fetch(dataUrl)).blob();
  const path = fixedPath || `${TEAM.user.id}/${kind}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}.jpg`;
  const {error} = await TEAM.client.storage.from("comunidade").upload(path, blob, {contentType: "image/jpeg", upsert: false});
  if (error) throw error;
  COMM.urls[path] = dataUrl;
  return path;
}

function commHandleFrom(name){ return (name || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, ".").replace(/^\.+|\.+$/g, "").slice(0, 20); }
async function commSaveProfile(){
  commReadEdit();
  const e = state.cmEdit, isNew = !COMM.me;
  const handle = (e.handle || "").trim().toLowerCase().replace(/^@/, "");
  const fail = m => { COMM.msg = m; COMM.busy = false; render(); };
  if (!(e.display_name || "").trim()) return fail(e.kind === "igreja" ? "Escreva o nome da igreja." : "Escreva seu nome.");
  if (!/^[a-z0-9_.]{3,20}$/.test(handle)) return fail("O nome de usuário precisa ter de 3 a 20 letras minúsculas, números, ponto ou _ (sem espaço e sem acento).");
  if (isNew && !e.rules) return fail("Para criar o perfil, marque que leu e aceita as regras.");
  COMM.busy = true; COMM.msg = ""; render();
  try {
    const row = {id: TEAM.user.id, handle, display_name: e.display_name.trim().slice(0, 60), church: (e.church || "").trim().slice(0, 80) || null,
      city: (e.city || "").trim().slice(0, 60) || null, kind: ["igreja", "membro"].includes(e.kind) ? e.kind : "musico", schedule: e.kind === "igreja" ? (e.schedule || "").trim().slice(0, 300) || null : null, services: e.kind === "igreja" ? (e.services || []).slice(0, 21) : [],
      instruments: e.kind === "musico" || !e.kind ? e.instruments || [] : [], bio: (e.bio || "").trim().slice(0, 300) || null,
      theme: THEMES[e.theme] ? e.theme : "red", instagram: (e.instagram || "").trim().replace(/^@/, "").slice(0, 40) || null,
      youtube: (e.youtube || "").trim().slice(0, 120) || null, songs: e.kind === "membro" ? [] : (e.songs || []).slice(0, 40), show_recent: e.show_recent !== false, accepted_rules: true};
    const old = COMM.me || {};
    if (e.avatarData) row.avatar_path = await commUpload(e.avatarData, "avatar");
    if (e.coverData) row.cover_path = await commUpload(e.coverData, "capa");
    const {data, error} = await TEAM.client.from("community_profiles").upsert(row).select("*").single();
    if (error) throw error;
    const stale = [row.avatar_path && old.avatar_path, row.cover_path && old.cover_path].filter(Boolean);
    if (stale.length) TEAM.client.storage.from("comunidade").remove(stale);
    COMM.me = data; commKeep([Object.assign(data, {full: true})]); COMM.people = null;
    COMM.busy = false; state.cmEdit = null; state.profileId = data.id; state.view = "profile"; render(); scrollTo(0, 0);
  } catch(err) {
    const m = (err && (err.code === "23505" || /duplicate|unique/i.test(err.message || ""))) ? "Esse nome de usuário já existe. Escolha outro." : "Não consegui salvar agora. Confira a internet e tente de novo.";
    fail(m);
  }
}
async function commPublish(){
  const d = state.cmPost || {}; if (COMM.busy) return;
  d.caption = ($("#cm-caption") || {}).value || "";
  if (d.kind === "texto" && !d.caption.trim()) { COMM.msg = "Escreva alguma coisa para postar."; render(); return; }
  if (d.kind !== "texto" && !d.data) return; const si = ($("#cm-post-song") || {}).value;
  const song = si !== undefined && si !== "" ? (COMM.me.songs || [])[+si] || null : null;
  COMM.busy = true; COMM.msg = ""; render();
  try {
    const path = d.kind === "texto" ? null : await commUpload(d.data, "post");
    if (path) try { const tb = await commResize(await (await fetch(d.data)).blob(), 400, 40000); await commUpload(tb, "", commThumb(path)); } catch(e) {}
    const {data, error} = await TEAM.client.from("posts").insert({author: TEAM.user.id, image_path: path, caption: d.caption.trim().slice(0, 500) || null, song}).select("*").single();
    if (error) throw error;
    COMM.posts[data.id] = data; COMM.likes[data.id] = 0;
    await pfSaveTags("post", data.id);
    COMM.byAuthor[TEAM.user.id] = [data.id].concat(COMM.byAuthor[TEAM.user.id] || []);
    if (COMM.explore) COMM.explore.unshift(data.id); if (COMM.feed) COMM.feed.unshift(data.id);
    COMM.busy = false; state.cmPost = null; state.profileId = TEAM.user.id; state.view = "profile"; render(); scrollTo(0, 0);
  } catch(err) { COMM.busy = false; COMM.msg = "Não consegui publicar agora. Confira a internet e tente de novo."; render(); }
}
async function commToggleFollow(id){
  if (!COMM.me) { state.view = "community"; render(); return; }
  const on = COMM.following.has(id), c = COMM.counts[id];
  if (on) COMM.following.delete(id); else COMM.following.add(id);
  if (c) c.followers += on ? -1 : 1;
  if (COMM.counts[TEAM.user.id]) COMM.counts[TEAM.user.id].following += on ? -1 : 1;
  COMM.feed = null; rerenderKeepScroll();
  const res = on ? await TEAM.client.from("follows").delete().eq("follower", TEAM.user.id).eq("followee", id)
                 : await TEAM.client.from("follows").insert({follower: TEAM.user.id, followee: id});
  if (res.error) { flash("Não consegui agora. Confira a internet."); commLoadMe(); }
}
async function commToggleLike(id){
  if (!COMM.me) return;
  const on = COMM.myLikes.has(id);
  if (on) COMM.myLikes.delete(id); else COMM.myLikes.add(id);
  COMM.likes[id] = Math.max(0, (COMM.likes[id] || 0) + (on ? -1 : 1)); rerenderKeepScroll();
  const res = on ? await TEAM.client.from("post_likes").delete().eq("post_id", id).eq("user_id", TEAM.user.id)
                 : await TEAM.client.from("post_likes").insert({post_id: id, user_id: TEAM.user.id});
  if (res.error) flash("Não consegui curtir agora.");else if(!on)ntfSound('like');
}
async function commDeletePost(id){
  const p = COMM.posts[id]; if (!p) return;
  const {error} = await TEAM.client.from("posts").delete().eq("id", id);
  if (error) { flash("Não consegui apagar agora."); return; }
  if (p.image_path) TEAM.client.storage.from("comunidade").remove([p.image_path, commThumb(p.image_path)]);
  delete COMM.posts[id];
  ["feed", "explore"].forEach(k => { if (COMM[k]) COMM[k] = COMM[k].filter(x => x !== id); });
  Object.keys(COMM.byAuthor).forEach(k => COMM.byAuthor[k] = COMM.byAuthor[k].filter(x => x !== id));
  if (COMM.reports) COMM.reports = COMM.reports.filter(r => !(r.target_kind === "post" && r.target_id === id));
  state.view = state.cmBack || "community"; render();
}
async function commDeleteProfile(id){
  const own = id === TEAM.user.id;
  const ps = COMM.byAuthor[id] ? COMM.byAuthor[id].map(x => COMM.posts[x]).filter(Boolean) : [];
  const p = COMM.profiles[id] || {};
  const {error} = await TEAM.client.from("community_profiles").delete().eq("id", id);
  if (error) { flash("Não consegui apagar agora."); return; }
  const files = ps.flatMap(x => [x.image_path, commThumb(x.image_path)]).concat([p.avatar_path, p.cover_path]).filter(Boolean);
  if (files.length) TEAM.client.storage.from("comunidade").remove(files);
  delete COMM.profiles[id]; COMM.people = null; COMM.feed = null; COMM.explore = null;
  if (own) { COMM.me = null; state.cmEdit = null; }
  state.view = "community"; render(); scrollTo(0, 0);
}

const PIX_KEY = "ea6fa496-e823-4955-a319-5a9cf8af3976";            // chave Pix de quem recebe as colaborações
const PIX_NAME = "Keliane Lima da Silva";           // nome que aparece no app do banco ao fazer o Pix
// Código "Pix Copia e Cola" (padrão BR Code do Banco Central), sem valor: quem paga escolhe quanto.
function pixPayload(){
  const f = (id, v) => id + String(v.length).padStart(2, "0") + v;
  const plain = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z0-9 ]/g, "").slice(0, 25);
  const body = f("00", "01") + f("26", f("00", "br.gov.bcb.pix") + f("01", PIX_KEY)) + f("52", "0000") + f("53", "986") + f("58", "BR")
    + f("59", plain(PIX_NAME || "BLESSED")) + f("60", "BRASIL") + f("62", f("05", "***")) + "6304";
  let crc = 0xFFFF;
  for (let i = 0; i < body.length; i++) { crc ^= body.charCodeAt(i) << 8; for (let b = 0; b < 8; b++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF; }
  return body + crc.toString(16).toUpperCase().padStart(4, "0");
}
function pixQr(){
  try { const q = qrcode(0, "M"); q.addData(pixPayload()); q.make(); return q.createSvgTag({cellSize: 5, margin: 3, scalable: true}); } catch(e) { return ""; }
}

function setBackupMsg(m){ state.backupMsg = m; const el = $("#backup-msg"); if (el) { el.textContent = m; el.hidden = !m; } }
async function exportRepertoire(){
  const data = JSON.stringify({
    app:"cifra-e-campo", version:1, exportedAt:new Date().toISOString(),
    songs: state.songs.map(s => Object.assign({id:s.id}, songBody(s))),
    artists: state.artists.map(a => ({id:a.id, name:a.name, photo:a.photo||""})),
    setlist: state.setlist
  });
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){}
  const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  if (!dl) {
    // versão site (fora do Claude): no celular abre a tela de compartilhar (WhatsApp); senão baixa o arquivo
    if (window.claude) { setBackupMsg("Este aparelho não deixou salvar arquivos por aqui. Tente exportar pelo app aberto no computador."); return; }
    try {
      const file = new File([data], `repertorio-blessed-${stamp}.json`, {type: "application/json"});
      if (navigator.canShare && navigator.canShare({files: [file]})) {
        await navigator.share({files: [file], title: "Repertório Blessed", text: "Meu repertório do Blessed. Abra o app e toque em Receber repertório."});
        setBackupMsg("Repertório enviado ✓"); return;
      }
    } catch(e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    a.download = `repertorio-blessed-${stamp}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    setBackupMsg(`Arquivo pronto ✓ ${state.songs.length} músicas e ${state.artists.length} pastas.`);
    return;
  }
  try {
    await dl.save({filename:`repertorio-blessed-${stamp}.json`, data});
    setBackupMsg(`Arquivo pronto ✓ ${state.songs.length} músicas e ${state.artists.length} pastas. Mande pelo WhatsApp para o outro celular.`);
  } catch(e) {
    if (e && e.code === "declined") return;
    setBackupMsg("Não consegui gerar o arquivo agora. Tente de novo em instantes.");
  }
}
function importRepertoire(text){
  let d;
  try { d = JSON.parse(text); } catch(e) { setBackupMsg("Esse arquivo não é um repertório do Blessed."); return; }
  if (!d || d.app !== "cifra-e-campo" || !Array.isArray(d.songs)) { setBackupMsg("Esse arquivo não é um repertório do Blessed."); return; }
  let ns = 0, na = 0;
  for (const raw of d.songs) {
    if (!raw || typeof raw.text !== "string" || !raw.name || !/^[A-Za-z0-9_\-.~:@+]{1,80}$/.test(String(raw.id||""))) continue;
    const s = {id:String(raw.id), name:String(raw.name), artist:String(raw.artist||""), text:raw.text,
      origTonic: TONICS[raw.origMode==="minor"?"minor":"major"].includes(raw.origTonic) ? raw.origTonic : "C",
      origMode: raw.origMode==="minor" ? "minor" : "major", targetTonic: String(raw.targetTonic||raw.origTonic||"C")};
    if (!TONICS[s.origMode].includes(s.targetTonic)) s.targetTonic = s.origTonic;
    const i = state.songs.findIndex(x => x.id === s.id);
    if (i >= 0) state.songs[i] = s; else state.songs.push(s);
    persist(s); ns++;
  }
  for (const raw of (Array.isArray(d.artists) ? d.artists : [])) {
    if (!raw || !raw.name) continue;
    const photo = typeof raw.photo === "string" && raw.photo.startsWith("data:image/") ? raw.photo : "";
    const ex = folderFor(raw.name);
    if (ex) { if (photo && !ex.photo) { ex.photo = photo; persistArtist(ex); na++; } continue; }
    const a = {id: /^a[A-Za-z0-9]{3,40}$/.test(String(raw.id||"")) ? String(raw.id) : "a"+newId().slice(1), name:String(raw.name), photo};
    state.artists.push(a); persistArtist(a); na++;
  }
  if (Array.isArray(d.setlist) && !state.setlist.length) {
    state.setlist = d.setlist.filter(id => state.songs.some(s => s.id === id)); persistSetlist();
  }
  state.backupMsg = `Importado ✓ ${ns} música${ns===1?"":"s"} e ${na} pasta${na===1?"":"s"}.`;
  render();
}

// O primeiro de cada lista é o caminho MAIS usado no louvor; os outros são alternativas.
const PATHS = {
  0:{to:[7,5,9,2,4], why:"O I é a casa. O caminho mais comum é subir para o V (como em I – V – VIm – IV), mas daqui dá para ir para qualquer grau."},
  2:{to:[7,5], why:"O IIm prepara o V. Juntos formam o famoso II – V – I."},
  4:{to:[9,5,2], why:"O IIIm quase sempre anda para o VIm."},
  5:{to:[0,7,2], why:"O IV costuma voltar para o I (fecha o ciclo I – V – VIm – IV) ou subir para o V, criando tensão."},

function cellIv(c){ return c.ring === "o" ? (c.i*7) % 12 : (c.i*7 + 9) % 12; }
function cellDia(c){ return c.ring === "o" ? [11,0,1].includes(c.i) : [11,0,1,2].includes(c.i); }

  return [];

function cellName(c, K){
  const iv = cellIv(c), n = spell(K.pc + iv, K);

let wheelSeq = 0;
function wheelSVG(K, opt){

  const arc = (r1, r2, a0, a1) => { const [x1,y1]=pt(r2,a0),[x2,y2]=pt(r2,a1),[x3,y3]=pt(r1,a1),[x4,y4]=pt(r1,a0);
    return `M${x1.toFixed(1)} ${y1.toFixed(1)}A${r2} ${r2} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}L${x3.toFixed(1)} ${y3.toFixed(1)}A${r1} ${r1} 0 0 0 ${x4.toFixed(1)} ${y4.toFixed(1)}Z`; };
  const same = (a, b) => a && b && a.ring === b.ring && a.i === b.i;
  const allDest = opt.sel && opt.showDest !== false ? cellDest(opt.sel) : [];
  const dest = state.wheelAll ? allDest : allDest.slice(0, 1);
  const mainDest = allDest[0];

  let cells = "";
  for (const ring of ["o","i"]) for (let i = 0; i < 12; i++) {

    const cl = ["c", ring==="o"?"out":"in", cellDia(c)?"dia":"",
      same(c,opt.sel)?"sel":"", same(c,opt.next)?"next":"", dest.some(d=>same(d,c))?"dest":"", same(c,mainDest)?"main":""].join(" ");
    const [tx, ty] = center(c);
    const lab = opt.mini ? "" : `<text class="nm" x="${tx.toFixed(1)}" y="${(ty-(ring==="o"?5:4)).toFixed(1)}">${esc(cellName(c,K))}</text><text class="dg" x="${tx.toFixed(1)}" y="${(ty+(ring==="o"?11:9)).toFixed(1)}">${esc(cellDeg(c))}</text>`;
    cells += `<g class="${cl}" ${opt.mini ? "" : `data-a="wheel" data-ring="${ring}" data-i="${i}" role="button" tabindex="0" aria-label="${esc(cellName(c,K))}, grau ${esc(cellDeg(c))}"`}>

    <defs><marker id="${id}d" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="${id}mn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="${id}nx" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path class="ah nx" d="M0 0L10 5L0 10z"/></marker></defs>
    ${cells}
    <circle class="ctr" cx="150" cy="150" r="56"/>
    ${opt.mini ? "" : `<text class="ck" x="150" y="146">${esc(K.tonic)}</text><text class="ct" x="150" y="174">TOM</text>`}
    ${arrows}</svg>`;
}
function wheelExplain(K){

  </div>`;

function resizeImage(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const s = Math.min(1, 720 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        let q = 0.8, d = c.toDataURL("image/jpeg", q);
        while (d.length > 170000 && q > 0.35) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
        resolve(d);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// Tom menor lido como o tom maior "irmão" (relativo): Bm = D, Am = C. Mesmos acordes, nomes mais fáceis.
function asMajorOn(song){ return song.origMode === "minor" && state.asMajor; }
function relMajor(t){ const K = keyInfo(t, "minor"), n = SHARP[(K.pc+3)%12], f = FLAT[(K.pc+3)%12]; const s = spell(K.pc+3, K); return TONICS.major.includes(s) ? s : TONICS.major.includes(n) ? n : f; }
function relMinor(t){ const K = keyInfo(t, "major"); const s = spell(K.pc+9, K); return TONICS.minor.includes(s) ? s : DEFAULT_NAME.minor[(K.pc+9)%12]; }
function songKeyLabel(s, which){
  const t = which === "orig" ? s.origTonic : (s.targetTonic || s.origTonic);
  return asMajorOn(s) ? relMajor(t) : keyLabel(t, s.origMode);
}
function analyse(song){
  const am = asMajorOn(song);
  const K0 = am ? keyInfo(relMajor(song.origTonic), "major") : keyInfo(song.origTonic, song.origMode);
  const KT = am ? keyInfo(relMajor(song.targetTonic || song.origTonic), "major") : keyInfo(song.targetTonic || song.origTonic, song.origMode);
  const lines = parseSong(song.text);
  // violão com capotraste: a cifra mostra as formas que a mão faz; "sound" guarda o tom que soa
  const capo = state.instrument === "violao" ? (song.capo || 0) : 0;
  if (capo) {
    const KS = keyInfo(DEFAULT_NAME[KT.mode][(KT.pc - capo + 12) % 12], KT.mode);
    return {K0, KT:KS, sound:KT, capo, shift:(KS.pc - K0.pc + 12) % 12, lines, chords: songChords(lines)};
  }
  const shift = (KT.pc - K0.pc + 12) % 12;
  return {K0, KT, shift, lines, chords: songChords(lines)};
}

function fieldData(KT){
  const sc = SCALE[KT.mode];
  const tri = KT.mode==="major" ? ["","m","m","","","m","°"] : ["m","°","","m","m","","" ];
  const tet = KT.mode==="major" ? ["7M","m7","m7","7M","7","m7","m7(b5)"] : ["m7","m7(b5)","7M","m7","m7","7M","7"];
  const rom = KT.mode==="major" ? ["I","IIm","IIIm","IV","V","VIm","VII°"] : ["Im","IIø","bIII","IVm","Vm","bVI","bVII"];
  return sc.map((iv, d) => ({iv, rom: rom[d], root: spell(KT.pc+iv, KT), tri: tri[d], tet: tet[d], fn: FUNC[KT.mode][iv]}));
}

function buildTips(song, A){
  const {K0, KT, shift, chords} = A;
  const tips = [];
  const scale = SCALE[KT.mode].map(iv => spell(KT.pc+iv, KT));
  const acc = scale.filter(n => n.length>1);
  const sharps = acc.filter(n=>n.includes("#")).length, flats = acc.filter(n=>n.includes("b")).length;
  if (asMajorOn(song)) tips.push(`A cifra original está em <b>${esc(keyLabel(song.origTonic,"minor"))}</b> (tom menor). ${esc(keyLabel(song.origTonic,"minor"))} usa os mesmos acordes de <b>${esc(relMajor(song.origTonic))}</b> maior, então aqui ela é lida como ${esc(relMajor(song.origTonic))} e o ${esc(keyLabel(song.origTonic,"minor"))} vira o <b>VIm</b>. Quer só teclas brancas? Escolha o tom <b>C</b>: a música fica em Am, F, C, G, Dm, Em.`);
  tips.push(`Escala de <b>${esc(keyLabel(KT.tonic,KT.mode))}</b>: <b>${scale.join(" ")}</b> — ${acc.length ? `${acc.length} ${sharps?"sustenido"+(sharps>1?"s":""):"bemol"+(flats>1?"is":"")} (${acc.join(", ")})` : "só teclas brancas"}.`);
  const odd = scale.filter(n => ["E#","B#","Cb","Fb"].includes(n));
  if (odd.length) tips.push(odd.map(n => `<b>${n}</b> é a tecla branca <b>${({"E#":"F","B#":"C","Cb":"B","Fb":"E"})[n]}</b>`).join("; ") + ". O nome muda só para cada letra aparecer uma vez na escala.");
  const blacks = SCALE[KT.mode].map(iv => (KT.pc+iv)%12).filter(pc => [1,3,6,8,10].includes(pc)).length;
  if (blacks >= 4) tips.push(`Neste tom a mão fica “em cima” das teclas pretas (${blacks} das 7 notas). Apoie o polegar nas brancas (${scale.filter((n,i)=>![1,3,6,8,10].includes((KT.pc+SCALE[KT.mode][i])%12)).join(" e ")}) e deixe os outros dedos nas pretas.`);
  if (shift) {
    const up = shift <= 6, n = up ? shift : 12-shift;
    tips.push(`Original em <b>${esc(keyLabel(K0.tonic,K0.mode))}</b> → culto em <b>${esc(keyLabel(KT.tonic,KT.mode))}</b>: tudo ${up?"sobe":"desce"} ${n} semitom${n>1?"s":""}. Os graus (I, IV, V…) continuam os mesmos — é isso que você decora.`);
  }
  // most repeated progression
  const seq = []; chords.forEach(c => { const r = ROMAN[(c.root-K0.pc+12)%12] + (cls(c)==="m"?"m":cls(c)==="d"?"°":""); if (seq[seq.length-1] !== r) seq.push(r); });
  const counts = {};
  for (let i = 0; i + 4 <= seq.length; i++) { const k = seq.slice(i,i+4).join(" – "); counts[k] = (counts[k]||0)+1; }
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  if (top && top[1] >= 2) {
    const named = {"I – V – VIm – IV":"a progressão mais usada no louvor", "VIm – IV – I – V":"a mesma de cima começando no VIm", "IV – V – VIm – I":""};
    const ex = top[0].split(" – ").map(r => { const iv = Object.keys(ROMAN).find(k => ROMAN[k]===r.replace(/m|°/g,"")); return spell(KT.pc + Number(iv), KT) + (r.endsWith("m")?"m":r.endsWith("°")?"°":""); });
    tips.push(`Sequência que mais se repete: <b>${top[0]}</b> (${top[1]}x)${named[top[0]]?" — "+named[top[0]]:""}. Em ${esc(keyLabel(KT.tonic,KT.mode))}: <b>${ex.join(" – ")}</b>.`);
  }
  // out of field
  const seen = new Set();
  chords.forEach(c => {
    const k = classify(c, K0); if (k.kind === "dia") return;
    const lab = degreeLabel(Object.assign({}, c, {bass:null}), K0);
    if (seen.has(lab)) return; seen.add(lab);
    tips.push(`<b>${esc(chordName(Object.assign({}, c, {bass:null}), KT, shift))}</b> (${esc(lab)}) está fora do campo. ${k.why}`);
  });
  // cadence
  let vi = 0; for (let i=0;i+1<chords.length;i++){ const a=(chords[i].root-K0.pc+12)%12, b=(chords[i+1].root-K0.pc+12)%12; if (a===7 && b===0) vi++; }
  if (vi) tips.push(`A resolução <b>V → I</b> aparece ${vi}x: ${esc(spell(KT.pc+7,KT))} → ${esc(spell(KT.pc,KT))}${KT.mode==="minor"?"m":""}. Deixe a mão já preparada na posição do I.`);
  const sus = chords.some(c=>c.sus4);
  if (sus) tips.push(`Acordes com <b>4</b> (ex.: ${esc(spell(KT.pc+7,KT))}4) trocam a terça pela quarta. Toque o 4 e depois desça um dedo meio tom/um tom para o acorde normal.`);
  const f = fieldData(KT);
  tips.push(`Para treinar antes do culto: toque <b>${f[0].root+f[0].tri} – ${f[3].root+f[3].tri} – ${f[4].root+f[4].tri} – ${f[0].root+f[0].tri}</b> (I – IV – V – I) até sair sem olhar.`);
  return tips;
}

// Modo simplificado: só a tríade (G7M(9) → G, B4 → Bm, F#m/C# → F#m, A7(4) → A)
function simplifyChord(c, K0){
  const i = (c.root - K0.pc + 12) % 12;
  let q = cls(c);
  if (c.sus4 || c.sus2) { const e = EXP[K0.mode][i]; q = e ? e[0] : "M"; }
  return {root:c.root, rootName:c.rootName, suffix: q==="m" ? "m" : q==="d" ? "°" : "", bass:null,
    minor:q==="m", dim:q==="d", halfdim:false, maj7:false, aug:false, sus4:false, sus2:false, seven:false};
}
function renderLines(A){
  const {K0, KT, shift, lines} = A;
  refs = [];
  const out = [];
  for (const l of lines) {
    if (l.type === "sec") { out.push(`<div class="sec">${esc(l.text)}</div>`); continue; }
    if (l.type === "lyric") { out.push(`<div class="ln ly">${esc(l.text)||" "}</div>`); continue; }
    // chord line
    const cSegs = [], dSegs = [];
    let pEnd = -1, dEnd = -1, prevName = null;
    for (const t of l.toks) {
      if (!t.chord) { if (state.simple) continue; const col = Math.max(t.col, pEnd+1); cSegs.push({col, len:t.text.length, html:esc(t.text)}); pEnd = col + t.text.length; continue; }
      const ch = state.simple ? simplifyChord(t.chord, K0) : t.chord;
      const name = chordName(ch, KT, shift);
      if (state.simple && name === prevName) continue; // "A4 A" vira um "A" só
      prevName = name;
      const col = Math.max(t.col, pEnd+1);
      const ref = refs.push({chord:ch, name}) - 1;
      const pre = state.simple ? "" : t.pre, post = state.simple ? "" : t.post;
      const full = pre + name + post;
      const now = state.follow && state.follow.idx === ref ? " now" : "";
      cSegs.push({col, len:full.length, html: esc(pre) + `<button class="ch${now}" data-a="chord" data-r="${ref}">${esc(name)}</button>` + esc(post)});
      pEnd = col + full.length;
      const lab = degreeLabel(ch, K0), k = classify(ch, K0).kind;
      const dcol = Math.max(col + pre.length, dEnd+1);
      dSegs.push({col:dcol, len:lab.length, html: k==="dia" ? esc(lab) : `<span class="x-${k}">${esc(lab)}</span>`});
      dEnd = dcol + lab.length;
    }
    const join = segs => { let s = "", p = 0; for (const g of segs) { s += " ".repeat(Math.max(0, g.col - p)) + g.html; p = Math.max(p, g.col) + g.len; } return s; };
    out.push(`<div class="ln dl">${join(dSegs)}</div><div class="ln cl">${join(cSegs)}</div>`);
  }
  return out.join("");
}

    <div class="switches">${modeSwitch()}${state.mode === "cifra" ? instSwitch() : ""}${videoButton(song)}</div>

      <button class="btn primary" data-a="pdf">⇩ Exportar PDF</button>
      <button class="btn" data-a="font" data-d="-1" aria-label="Diminuir letra">A−</button>
      <button class="btn" data-a="font" data-d="1" aria-label="Aumentar letra">A+</button>
      <button class="btn" data-a="wake" aria-pressed="${!!state.wake}">${state.wake ? "Tela acesa ✓" : "Manter tela acesa"}</button>
      <button class="btn" data-a="set-toggle" data-id="${esc(song.id)}" aria-pressed="${state.setlist.includes(song.id)}">${state.setlist.includes(song.id) ? "✓ Na escala" : "+ Escala do culto"}</button>
    </div>` : `
    <div class="keybar">
      <span class="eyebrow">Tom do culto</span>
      <span class="keypill">${esc(keyLabel((A.sound||KT).tonic,KT.mode))}</span>
      <span class="stepper"><button data-a="step" data-d="-1" aria-label="Descer meio tom">−½</button><button data-a="step" data-d="1" aria-label="Subir meio tom">+½</button></span>
      <span class="muted" style="font-size:13px">original ${esc(keyLabel(K0.tonic,K0.mode))}</span>
    </div>
    ${song.origMode === "minor" ? `<div class="keybar">
      <span class="eyebrow">Ler como</span>
      <span class="stepper" role="group" aria-label="Ler como tom maior ou menor">
        <button data-a="asmajor" data-v="1" aria-pressed="${state.asMajor}" style="${state.asMajor?"background:var(--ink);color:var(--bg)":""};padding:0 12px">Tom maior (${esc(relMajor(song.origTonic))})</button>
        <button data-a="asmajor" data-v="0" aria-pressed="${!state.asMajor}" style="${!state.asMajor?"background:var(--ink);color:var(--bg)":""};padding:0 12px">Tom menor (${esc(keyLabel(song.origTonic,"minor"))})</button>
      </span>
    </div>` : ""}
    ${state.instrument === "violao" ? capoRow(song, A) : ""}
    <div class="keys-scroll"><div class="keys" role="group" aria-label="Escolher tom">
      ${tonics.map(t => `<button data-a="tonic" data-t="${t}" aria-pressed="${t===(A.sound||KT).tonic}" class="${t===K0.tonic?"orig":""}">${esc(keyLabel(t,KT.mode))}</button>`).join("")}

    </div></div>

  </section>

    <button class="panel-h" data-a="toggle" data-k="wheelOpen" aria-expanded="${state.wheelOpen}"><h3>Roda dos caminhos</h3>${chevron}</button>

    ${state.tipsOpen ? `<ul class="tips">${tips.map(t=>`<li>${t}</li>`).join("")}</ul>` : ""}
  </section>

  <section class="panel">
    <div class="eyebrow" style="margin-bottom:6px">Cifra em ${esc(keyLabel(KT.tonic,KT.mode))} · graus em cima</div>
    <div class="sheet-wrap"><div class="cifra" style="font-size:${state.fontSize}px">${cifraHtml}</div></div>
  </section>
  ${infoPanel(song)}
  ${siteFooter()}
  ${state.follow ? followBar(A) : setNav(song)}`}`;
}
function wheelKey(A){ return A.KT.mode === "major" ? A.KT : keyInfo(relMajor(A.KT.tonic), "major"); }
function refCell(r, A){ const s = simplifyChord(r.chord, A.K0); return cellOf((s.root + A.shift) % 12, cls(s), wheelKey(A)); }
function nextRefIdx(i){ let j = i + 1; while (refs[j] && refs[i] && refs[j].name === refs[i].name) j++; return refs[j] ? j : -1; }
function followPair(A){
  const i = state.follow.idx, j = nextRefIdx(i);
  return {i, j, cur: refCell(refs[i], A), next: j >= 0 ? refCell(refs[j], A) : null};
}
function followBar(A){
  const {i, j, cur, next} = followPair(A);
  const lab = r => degreeLabel(simplifyChord(r.chord, A.K0), A.K0);
  const c = refs[i], n = j >= 0 ? refs[j] : null;
  return `<div class="follow" role="region" aria-label="Seguir acorde por acorde"><div class="follow-in">
    ${wheelSVG(wheelKey(A), {mini:true, sel:cur, next, showDest:false})}
    <div class="now-next">
      <div class="slot"><small>AGORA</small><b>${esc(c.name)}</b><span>${esc(lab(c))}</span></div>
      <span class="arr">→</span>
      <div class="slot nx"><small>DEPOIS</small><b>${n ? esc(n.name) : "fim"}</b><span>${n ? esc(lab(n)) : ""}</span></div>
    </div>
    <div class="fb"><button class="btn" data-a="fprev" aria-label="Acorde anterior" ${i===0?"disabled":""}>◀</button>
      <button class="btn primary" data-a="fnext" ${n?"":"disabled"}>Próximo ▶</button>
      <button class="btn" data-a="fstop" aria-label="Parar de seguir">✕</button></div>
  </div></div>`;
}
function setNav(song){
  const all = songsAll();
  const ids = state.setlist.filter(id => id==="exemplo" || all.some(s=>s.id===id));
  const i = ids.indexOf(song.id); if (i < 0) return "";
  const name = id => { const s = id==="exemplo" ? EXAMPLE : all.find(x=>x.id===id); return s ? s.name : ""; };
  const prev = ids[i-1], next = ids[i+1];
  return `<nav class="setnav" aria-label="Escala do culto"><div class="setnav-in">
    <button class="btn" data-a="open" data-id="${esc(prev||"")}" ${prev?"":"disabled"}>‹ Anterior</button>
    <div class="mid">Escala ${i+1} de ${ids.length}<b>${next ? "Próxima: " + esc(name(next)) : "Última música"}</b></div>
    <button class="btn primary" data-a="open" data-id="${esc(next||"")}" ${next?"":"disabled"}>Próxima ›</button>
  </div></nav>`;
}

  const tOpts = TONICS[e.origMode].map(t => `<option value="${t}" ${e.targetTonic===t?"selected":""}>${keyLabel(t,e.origMode)}</option>`).join("");
  return `

/* limpa o texto copiado do Cifra Club / Letras */
const JUNK_RE = /^\s*(tom:|afinação|afinacao|capotraste|capo\b|composição|composicao|colaboração|colaboracao|revisão|cifra club|cifraclub|letras\.mus|exibir|imprimir|compartilhar|enviar|ver (mais|todas|cifra)|videoaula|vídeo ?aula|aprenda|baixe|publicidade|anúncio|patrocinado|tags?:|favoritar|salvar|ouvir|simplificar|auto ?rolagem|transpor|mudar tom|meio tom|\d+([.,]\d+)?\s*(mil|k)?\s*exibições|cifra:|principal|acordes\s*$|letra\s*$|tablatura|tab\s*$|dicionário|sugerir|corrigir|última atualização|cifra simplificada)/i;
const TAB_RE = /^\s*[eEBGDA]\s*\|[-0-9|hpbrxs\/\\~().\s]*\|?\s*$/;
function cleanCifra(raw){
  const lines = raw.replace(/\r/g,"").replace(/ /g," ").replace(/\t/g,"    ").split("\n");
  let tom = null;
  for (const l of lines) { const m = l.match(/^\s*tom:\s*([A-G])([#b]?)(m(?!aj))?/i); if (m) { tom = {tonic: m[1].toUpperCase()+m[2], mode: m[3] ? "minor" : "major"}; break; } }
  const kept = [];
  for (const l of lines) {
    if (TAB_RE.test(l) || /^\s*parte \d+ de \d+\s*$/i.test(l)) continue;
    if (/^\s*\[?\s*tab\b/i.test(l)) continue;
    if (!parseChordLine(l) && l.trim().length < 70 && JUNK_RE.test(l)) continue;
    kept.push(l.replace(/\s+$/,""));
  }
  // nome/artista: linhas curtas antes do primeiro acorde ou seção
  let title = "", artist = "";
  const firstMusic = kept.findIndex(l => parseChordLine(l) || /^\s*\[[^\]]+\]/.test(l));
  if (firstMusic > 0) {
    const head = kept.slice(0, firstMusic).map(s=>s.trim()).filter(Boolean);
    if (head.length && head.length <= 4) { title = head[0].slice(0,80); artist = (head[1]||"").slice(0,80); kept.splice(0, firstMusic); }
  }
  const text = kept.join("\n").replace(/\n{3,}/g, "\n\n").replace(/^\n+|\n+$/g, "");
  if (tom) {
    const pc = pcOf(tom.tonic[0], tom.tonic.slice(1));
    if (!TONICS[tom.mode].includes(tom.tonic)) tom.tonic = DEFAULT_NAME[tom.mode][pc];
  }
  return {text, tom, title, artist};
}
function handlePaste(raw){
  const e = state.editing; if (!e || !raw || raw.trim().length < 10) return;
  readEditor();
  const r = cleanCifra(raw);
  const key = r.tom || detectKey(songChords(parseSong(r.text)));
  if (!songChords(parseSong(r.text)).length) { flashEditor("Não achei acordes nesse texto. Copie a página da cifra (não só a letra) e cole de novo."); return; }
  e.text = r.text;
  if (key) { e.origTonic = key.tonic; e.origMode = key.mode; }
  if (!e.targetChosen || !TONICS[e.origMode].includes(e.targetTonic)) e.targetTonic = e.origTonic;
  if (!e.name.trim() && r.title) e.name = r.title;
  if (!e.artist.trim() && r.artist && r.title) e.artist = r.artist;
  if (!e.name.trim()) { render(); flashEditor("Cifra colada! Agora escreva o nome da música e toque em Salvar."); $("#f-name").focus(); return; }
  saveEditing(`Música salva ✓ Original em ${esc(keyLabel(e.origTonic,e.origMode))}${e.targetTonic!==e.origTonic ? `, tocando em ${esc(keyLabel(e.targetTonic,e.origMode))}` : ". Toque num tom abaixo para mudar"}.`);
}
function flashEditor(msg){ const el = $("#f-msg"); if (el) { el.textContent = msg; el.hidden = false; } }
function saveEditing(notice){
  const e = state.editing;

  const song = {id:e.id, name:e.name.trim(), artist:e.artist.trim(), text:e.text, origTonic:e.origTonic, origMode:e.origMode, targetTonic:e.targetTonic, capo:e.capo||0, youtube:ytLink(e.youtube)};

  if (old && old.info && norm(old.name) === norm(song.name) && norm(old.artist) === norm(song.artist)) song.info = old.info;

/* ---------- chord sheet + keyboard ---------- */
function keyboard(rhPcs, bassPc, scalePcs, names){
  const on = new Map(); // position -> label
  if (bassPc !== null) on.set(bassPc, {bass:true, name:names[bassPc]});
  rhPcs.forEach(pc => on.set(12+pc, {bass:false, name:names[pc]}));
  return kbMarks(on, scalePcs);
}
// teclado de 2 oitavas; `on` = posição (0–23) → {name, bass}
function kbMarks(on, scalePcs){
  const W = [0,2,4,5,7,9,11], B = {1:0,3:1,6:3,8:4,10:5};
  let whites = "", blacks = "";
  for (let o = 0; o < 2; o++) {
    W.forEach(pc => { const p = o*12+pc, n = on.get(p);
      whites += `<div class="w ${scalePcs.includes(pc)?"sc":""} ${n?"on":""} ${n&&n.bass?"bass":""}">${n?`<span class="lab">${esc(n.name)}</span>`:""}</div>`; });
    Object.keys(B).forEach(k => { const pc = +k, p = o*12+pc, n = on.get(p), wi = o*7 + B[pc] + 1;
      blacks += `<div class="b ${scalePcs.includes(pc)?"sc":""} ${n?"on":""} ${n&&n.bass?"bass":""}" style="left:calc(${wi}*100%/14 - 100%/14*0.31)">${n?`<span class="lab">${esc(n.name)}</span>`:""}</div>`; });
  }
  return `<div class="kb" aria-hidden="true">${whites}${blacks}</div>`;
}
function renderSheet(){
  const el = $("#sheet");

  const song = current(); if (!song) { el.hidden = true; return; }
  const A = analyse(song), {K0, KT, shift} = A;
  const c = state.sheet.chord;
  const name = chordName(c, KT, shift);
  const k = classify(c, K0);
  const lab = degreeLabel(c, K0);
  const ints = chordInts(c);
  const root = (c.root + shift) % 12;
  const pcs = ints.map(i => (root + i) % 12);
  const names = {}; for (let p=0;p<12;p++) names[p] = spell(p, KT);
  const bass = c.bass !== null ? (c.bass + shift) % 12 : root;
  const why = k.kind === "dia" ? `${FUNC_NAME[k.fn]} do campo de ${keyLabel(KT.tonic,KT.mode)}.` : k.why;
  const scalePcs = SCALE[KT.mode].map(iv => (KT.pc+iv)%12);
  el.innerHTML = `<div class="bsheet-in">
    <div class="bs-top">
      <div class="bs-info"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="bs-name">${esc(name)}</span><span class="bs-deg">${esc(lab)}</span></div>
      <div class="bs-why">${why}</div></div>
      <button class="btn" data-a="close" aria-label="Fechar">✕</button>
    </div>
    <div class="notes"><span class="bass">baixo ${esc(names[bass])}</span>${pcs.map(p=>`<span>${esc(names[p])}</span>`).join("")}</div>
    ${state.instrument === "violao"
      ? `<div class="gd-wrap">${guitarDiagram(root, chordQ(c), name)}<div class="gd-cap">Bolinha vermelha = tônica (a nota do nome do acorde)${c.bass !== null ? `<br>Baixo em <b>${esc(names[bass])}</b>: toque essa nota na corda mais grave` : ""}${/9|11|13|6|add/.test(c.suffix) ? "<br>Desenho do acorde básico, sem as notas extras" : ""}</div></div>`
      : `${keyboard(pcs, bass, scalePcs, names)}<div class="kb-cap"><span>mão esquerda: baixo</span><span>mão direita: acorde · pontinhos = escala</span></div>`}
  </div>`;
  el.hidden = false;
}
