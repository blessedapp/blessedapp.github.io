<style>
/* Layout: one-column phone app — library → song view (field strip, tips, transposed cifra) → chord bottom sheet with keyboard */
/* Visual de streaming com acabamento lilás e aparência escolhida nos Ajustes. */
:root{
  --cream:#F4E9D4;
  --bg:#0A0A0C; --surface:#16161A; --surface2:#222228; --ink:#F3F3F5; --muted:#A4A4AE; --line:#2D2D34;
  --felt:#B70CFF; --felt-soft:#340947; --degree:#46D3C3; --degree-soft:#0F302C;
  --warn:#F5B451; --warn-soft:#3A2B12; --borrow:#B99AF7; --borrow-soft:#2A2040;
  --key-w:#ECECF0; --key-b:#09090B; --key-edge:#3E3E46;
  --f-brand:"Bebas Neue", "Impact", "Arial Narrow", sans-serif;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--felt);border-color:var(--felt);color:#fff;font-weight:700}
.btn.light{background:#fff;border-color:#fff;color:#0A0A0C;font-weight:700}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--felt);border-color:var(--felt)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding-block:6px 14px}
.top h1{font-size:26px;font-weight:800;flex:1;min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand h1{flex:none}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--felt);display:inline-block;transform:translateY(-3px)}

/* library */
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-bottom:12px}
.list{display:grid;gap:8px}
.song-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.song-row .k{font-family:var(--f-mono);font-weight:700;font-size:18px;min-width:52px;text-align:center;padding:6px 4px;border-radius:10px;background:var(--felt-soft);color:var(--felt)}
.song-row .t{flex:1;min-width:0}
.song-row .t b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-row .t span{font-size:13px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:var(--degree-soft);color:var(--degree)}
.empty{padding:20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
.store-note{font-size:12px;color:var(--muted);margin-top:16px}

/* song view */
.song-head{display:grid;gap:10px;margin-bottom:12px}
.song-head h2{font-size:24px;font-weight:800}
.keybar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.keypill{font-family:var(--f-mono);font-weight:700;font-size:20px;padding:4px 12px;border-radius:8px;background:var(--felt);color:#fff}
.stepper{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;min-width:42px;min-height:38px;font-weight:700}
.stepper button+button{border-left:1px solid var(--line)}
.keys-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-16px;padding-inline:16px}
.keys{display:flex;gap:6px;padding-block:2px 6px;width:max-content}
.keys button{font-family:var(--f-mono);font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:9px;min-width:44px;min-height:38px;padding:0 8px}
.keys button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.keys button.orig{box-shadow:inset 0 -3px 0 var(--degree)}
.tools{display:flex;flex-wrap:wrap;gap:6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.panel-h{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0;text-align:left}
.panel-h h3{font-size:17px;flex:1}
.chev{transition:transform .2s}
.panel-h[aria-expanded="false"] .chev{transform:rotate(-90deg)}

.scale{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.scale span{font-family:var(--f-mono);font-weight:700;padding:3px 9px;border-radius:8px;border:1px solid var(--line)}
.scale span.blk{background:#000;color:#fff;border-color:#55555e}

.field-scroll{overflow-x:auto;margin-inline:-14px;padding-inline:14px}
.field{display:grid;grid-template-columns:repeat(7,minmax(64px,1fr));gap:6px;min-width:470px}
.deg{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;background:var(--bg);display:grid;gap:2px}
.deg .r{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--degree)}
.deg .c{font-family:var(--f-mono);font-weight:700;font-size:17px}
.deg .c7{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.deg .fn{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:2px}
.fn-T{color:var(--degree)} .fn-S{color:var(--borrow)} .fn-D{color:var(--felt)}
.deg.used{border-color:var(--degree);box-shadow:inset 0 0 0 1px var(--degree)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.tips{display:grid;gap:10px;margin:10px 0 0;padding:0;list-style:none}
.tips li{padding-left:14px;position:relative;font-size:15px}
.tips li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:2px;background:var(--felt)}
.tips b{font-family:var(--f-mono)}

/* cifra */
.sheet-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cifra{font-family:var(--f-mono);white-space:pre;line-height:1.35;padding-block:4px 8px}
.cifra .ln{min-height:1.35em}
.cifra .dl{color:var(--degree);font-size:.78em;font-weight:700;line-height:1.5}
.cifra .dl .x-sec{color:var(--warn)} .cifra .dl .x-bor{color:var(--borrow)} .cifra .dl .x-chr{color:var(--felt)}
.cifra .cl{font-weight:700}
.cifra .ch{all:unset;cursor:pointer;color:var(--felt);font-weight:700;border-radius:4px}
.cifra .ch:focus-visible{outline:2px solid var(--felt)}
.cifra .sec{font-family:var(--f-display);font-weight:800;font-size:.92em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:.9em}
.cifra .ly{color:var(--ink)}

/* editor */
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-weight:700;font-size:14px}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:400;font-size:16px}
.form textarea{font-family:var(--f-mono);font-size:14px;min-height:340px;line-height:1.4;white-space:pre;overflow-x:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.detect{font-size:13px;color:var(--degree);font-weight:700}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-radius:12px;background:var(--felt-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* colar cifra */
.paste{display:grid;gap:10px;padding:16px;border:2px dashed var(--felt);border-radius:16px;background:var(--felt-soft)}
.paste h3{font-size:18px}
.paste textarea{min-height:120px!important;background:var(--surface);font-family:var(--f-body)!important;font-size:16px!important;white-space:normal!important}
.steps{margin:0;padding-left:22px;display:grid;gap:6px;font-size:15px}
.ok{padding:10px 12px;border-radius:12px;background:var(--degree-soft);color:var(--degree);font-weight:700}

/* escala do culto */
.set-row{display:flex;align-items:center;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.set-list .set-row:first-child{border-top:0}
.set-n{font-family:var(--f-mono);font-weight:700;color:var(--muted);width:22px;text-align:center}
.set-open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:flex;align-items:center;gap:10px}
.set-open b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.set-open .t{flex:1;min-width:0}
.set-open .kk{font-family:var(--f-mono);font-weight:700;color:var(--felt)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-width:36px;min-height:36px;font-weight:700}
.icon-btn:disabled{opacity:.35}
.song-item{display:flex;gap:8px;align-items:stretch}
.song-item .song-row{flex:1;min-width:0}
.add-set{border:1px solid var(--line);background:var(--surface);border-radius:14px;min-width:64px;font-weight:700;font-size:13px;color:var(--degree);line-height:1.2}
.add-set[aria-pressed="true"]{background:var(--degree-soft);border-color:var(--degree)}
.setnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.setnav-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.setnav .mid{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted)}
.setnav .mid b{display:block;color:var(--ink);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setnav .btn{min-width:96px;justify-content:center}

/* bottom sheet */
.bsheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.18);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0}
.bsheet-in{max-width:760px;margin:0 auto;display:grid;gap:10px}
.bs-top{display:flex;align-items:flex-start;gap:10px}
.bs-name{font-family:var(--f-mono);font-weight:700;font-size:28px;line-height:1}
.bs-deg{font-family:var(--f-display);font-weight:800;color:var(--degree);font-size:18px}
.bs-info{flex:1;min-width:0;display:grid;gap:4px}
.bs-why{font-size:14px;color:var(--muted)}
.notes{display:flex;flex-wrap:wrap;gap:6px}
.notes span{font-family:var(--f-mono);font-weight:700;padding:2px 8px;border-radius:7px;background:var(--felt-soft);color:var(--felt);font-size:14px}
.notes span.bass{background:var(--degree-soft);color:var(--degree)}

/* keyboard */
.kb{position:relative;height:120px;display:flex;user-select:none}
.kb .w{flex:1;border:1px solid var(--key-edge);border-left:0;background:var(--key-w);border-radius:0 0 6px 6px;position:relative}
.kb .w:first-child{border-left:1px solid var(--key-edge)}
.kb .b{position:absolute;top:0;width:calc(100%/14*0.62);height:62%;background:var(--key-b);border-radius:0 0 4px 4px;z-index:2}
.kb .sc::after{content:"";position:absolute;left:50%;bottom:8px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--degree);opacity:.55}
.kb .b.sc::after{bottom:6px;background:#fff;opacity:.5}
.kb .on{background:var(--felt)!important}
.kb .on.bass{background:var(--degree)!important}
.kb .on::after{display:none}
.kb .lab{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:700 10px var(--f-mono);color:#fff}
.kb-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* ---------- home estilo streaming ---------- */
#app.wide{max-width:none;padding-inline:0;padding-block:0 120px;overflow-x:hidden}
.nf-head{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 28px;background:linear-gradient(rgba(0,0,0,.9),rgba(0,0,0,.55) 60%,transparent)}
.wordmark{font-family:"Anton",var(--f-brand);font-weight:400;color:var(--cream);text-transform:uppercase;flex:1;min-width:0;margin:0;display:grid;gap:3px;line-height:.95;text-shadow:0 2px 3px rgba(0,0,0,.7),0 0 18px rgba(0,0,0,.6)}
.wordmark span{font-size:32px;letter-spacing:.015em}
.wordmark small{font:700 10px/1 var(--f-body);letter-spacing:.28em;color:var(--cream);display:flex;align-items:center;gap:6px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.wordmark small::before{content:"";width:18px;height:3px;background:var(--felt);border-radius:2px}
.brand2{flex:1;min-width:0;display:grid;gap:7px}
.credit{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font:400 12px var(--f-body);color:#d9d2c4;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.credit b{font-weight:700;color:var(--cream)}
.credit button{border:0;background:var(--felt);color:#fff;font:700 11px var(--f-body);letter-spacing:.04em;padding:4px 10px;border-radius:99px;min-height:26px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);display:grid;place-items:end center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){ .modal{place-items:center} }
.modal-box{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px}
.modal-box h2{font-family:"Anton",var(--f-brand);font-weight:400;text-transform:uppercase;color:var(--cream);font-size:28px;line-height:1}
.modal-box p{margin:0;color:#d8d8de}
.pix{display:grid;gap:4px;padding:12px;border-radius:12px;background:var(--surface2);border:1px dashed var(--felt)}
.pix small{font:700 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pix-qr{background:#fff;border-radius:12px;padding:6px;width:min(220px,70%);justify-self:center}
.pix-qr svg{display:block;width:100%;height:auto}
.modal-box{max-height:calc(100vh - 32px);overflow-y:auto}
.pix code{font:700 16px var(--f-mono);color:#fff;overflow-wrap:anywhere;user-select:all}
.page-title{font-family:"Anton",var(--f-brand);font-weight:400;text-transform:uppercase;color:var(--cream);font-size:34px;line-height:1;margin:0}

/* barra de abas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:rgba(10,10,12,.96);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;min-width:0;max-width:160px;border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:2px;font:700 11px var(--f-body);padding:4px 2px;white-space:nowrap}
/* com 6 abas no celular, letra um pouco menor para caber */
@media (max-width:420px){.tabbar button:first-child:nth-last-child(6),.tabbar button:first-child:nth-last-child(6)~button{font-size:9.5px;letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis;padding-inline:0}}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:#fff}

/* backup */
.backup{margin:24px 16px 0;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;gap:10px;max-width:640px}
.backup h3{font:800 17px var(--f-display)}

/* estudo */
.study{display:grid;gap:14px}
.lesson h3{font:800 19px var(--f-display);display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.lesson h3 .n{font-family:"Anton",var(--f-brand);font-weight:400;color:var(--felt);font-size:24px}
.lesson p{margin:0 0 10px;color:#d8d8de;max-width:62ch}
.lesson p b{color:#fff}
.steps-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:6px 0 12px}
.steps-row .nt{font:700 16px var(--f-mono);padding:4px 8px;border-radius:6px;background:var(--surface2)}
.steps-row .st{font:700 11px var(--f-body);color:var(--muted)}
.steps-row .st.s{color:var(--felt)}
.pattern{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.pattern span{font:700 14px var(--f-mono);padding:4px 10px;border-radius:99px;border:1px solid var(--line)}
.pattern .M{background:var(--degree-soft);color:var(--degree);border-color:transparent}
.pattern .m{background:var(--borrow-soft);color:var(--borrow);border-color:transparent}
.pattern .d{background:var(--felt-soft);color:#E5A7FF;border-color:transparent}
.deg[aria-pressed="true"]{background:var(--felt);border-color:var(--felt)}
.deg[aria-pressed="true"] .r,.deg[aria-pressed="true"] .c,.deg[aria-pressed="true"] .fn{color:#fff}
.fam{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fam div{border-radius:10px;padding:10px;background:var(--surface2);display:grid;gap:4px}
.fam b{font:800 14px var(--f-display)}
.fam .chs{font:700 18px var(--f-mono)}
.fam small{color:var(--muted);font-size:12px}
.pairs{display:grid;gap:8px}
.pair{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--surface2)}
.pair .c{font:700 20px var(--f-mono)}
.pair .eq{color:var(--muted);font-size:13px;flex:1;min-width:150px}
.pair .eq b{color:var(--degree)}
.paths-map{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.paths-map button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;min-width:58px;min-height:52px;display:grid;justify-items:center;padding:4px 8px}
.paths-map button .r{font:800 13px var(--f-display);color:var(--degree)}
.paths-map button .c{font:700 16px var(--f-mono)}
.paths-map button[aria-pressed="true"]{background:var(--felt);border-color:var(--felt)}
.paths-map button[aria-pressed="true"] .r{color:#fff}
.paths-map button.to{border-color:var(--degree);box-shadow:inset 0 0 0 1px var(--degree)}
.path-out{padding:12px;border-radius:10px;background:var(--surface2);margin-bottom:12px}
.path-out .arrows{font:700 18px var(--f-mono);display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px}
.prog{display:grid;gap:8px}
.prog div{display:grid;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.prog .g{font:800 13px var(--f-display);color:var(--degree)}
.prog .c{font:700 18px var(--f-mono)}
.prog small{color:var(--muted)}
/* roda dos caminhos */
.wheel-wrap{max-width:400px;margin:8px auto 0}
.wheel{width:100%;height:auto;display:block;user-select:none}
.wheel g.c{cursor:pointer}
.wheel g.c path{fill:var(--bg);stroke:var(--line);stroke-width:1;transition:fill .15s}
.wheel g.dia path{fill:#2c2c34}
.wheel g.dest path{fill:var(--degree-soft);stroke:var(--degree);stroke-width:2}
.wheel g.next path{fill:#11463f;stroke:#fff;stroke-width:3}
.wheel g.sel path{fill:var(--felt);stroke:#fff;stroke-width:2}
.wheel text{pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.wheel .nm{font:700 15px var(--f-mono);fill:#6b6b75}
.wheel .in .nm{font-size:12px}
.wheel .dg{font:800 9px var(--f-display);fill:#55555e}
.wheel g.dia .nm{fill:#fff} .wheel g.dia .dg{fill:var(--degree)}
.wheel g.sel .nm,.wheel g.sel .dg,.wheel g.next .nm,.wheel g.next .dg,.wheel g.dest .nm{fill:#fff}
.wheel g.c:focus-visible path{stroke:#fff;stroke-width:3}
.wheel .ctr{fill:var(--surface)}
.wheel .ck{font:400 34px "Anton",var(--f-brand);fill:#fff}
.wheel .ct{font:700 10px var(--f-body);fill:var(--muted);letter-spacing:.15em}
.wheel .arw{stroke:var(--degree);stroke-width:3;stroke-linecap:round}
.wheel .arw{stroke-dasharray:6 5;opacity:.75}
.wheel .arw.mn{stroke-width:6;stroke-dasharray:none;opacity:1}
.wheel .arw.nx{stroke:#fff;stroke-width:6;stroke-dasharray:none;opacity:1}
.wheel g.dest.main path{fill:#11463f;stroke:var(--degree);stroke-width:3}
.wheel .ah{fill:var(--degree)} .wheel .ah.nx{fill:#fff}
.wheel.mini g.c path{stroke-width:2}

/* modo seguir */
.follow{position:fixed;left:0;right:0;bottom:0;z-index:16;background:rgba(18,18,22,.98);border-top:2px solid var(--felt);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.follow-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:96px 1fr;gap:6px 12px;align-items:center}
.follow .wheel{width:96px;grid-row:span 2}
.follow .now-next{display:flex;align-items:center;gap:10px;min-width:0}
.follow .slot{display:grid;min-width:0}
.follow .slot small{font:700 10px var(--f-body);letter-spacing:.14em;color:var(--muted)}
.follow .slot b{font:700 30px/1.05 var(--f-mono);white-space:nowrap}
.follow .slot.nx b{color:var(--degree)}
.follow .slot span{font:800 13px var(--f-display);color:var(--degree)}
.follow .arr{font-size:26px;color:var(--muted)}
.follow .fb{display:flex;gap:6px}
.follow .fb .btn{flex:1;justify-content:center;min-height:44px}
.cifra .ch.now{background:var(--felt);color:#fff;outline:3px solid var(--felt)}

/* história */
.story h4{font:800 15px var(--f-display);margin:14px 0 4px;color:#fff}
.story p{margin:0 0 6px;color:#dcdce2;max-width:65ch}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0 0}
.facts div{background:var(--surface2);border-radius:8px;padding:8px 10px;min-width:0}
.facts dt{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:700;overflow-wrap:anywhere}
.cert{display:inline-block;font:700 12px var(--f-body);padding:3px 9px;border-radius:99px}
.cert.c-alta{background:var(--degree-soft);color:var(--degree)}
.cert.c-media{background:var(--warn-soft);color:var(--warn)}
.cert.c-baixa{background:var(--felt-soft);color:#EBB9FF}
.lnk2{border:0;background:none;color:var(--ink);text-decoration:underline;padding:0;font-size:inherit}

/* instrumento + violão */
.inst{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--surface);justify-self:start}
.inst button{border:0;background:none;color:var(--muted);font-weight:700;padding:7px 16px;border-radius:99px;min-height:36px}
.inst button[aria-pressed="true"]{background:var(--felt);color:#fff}
.capo-n{display:inline-grid;place-items:center;min-width:84px;font-weight:700;font-size:14px;border-inline:1px solid var(--line)}
.gd-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gd{width:150px;height:auto;flex:none}
.gd .st{stroke:#9a9aa4;stroke-width:1.3} .gd .fr{stroke:#55555e;stroke-width:1.3} .gd .nut{stroke:#f3f3f5;stroke-width:5}
.gd .dot{fill:var(--cream)} .gd .dot.rt{fill:var(--felt)} .gd .op{fill:none;stroke:#f3f3f5;stroke-width:2}
.gd .mk{fill:#9a9aa4;font:700 15px var(--f-body)} .gd .fn{fill:var(--muted);font:700 12px var(--f-body)}
.gd-cap{font-size:13px;color:var(--muted);flex:1;min-width:150px}
.fb-scroll{overflow-x:auto;margin-top:8px}
.fboard{width:640px;max-width:none;height:auto;display:block}
.fboard .st{stroke:#9a9aa4;stroke-width:1.2} .fboard .fr{stroke:#4a4a52;stroke-width:1.5} .fboard .nut{stroke:#f3f3f5;stroke-width:5}
.fboard .inlay{fill:#2c2c34} .fboard .dot{fill:var(--cream)} .fboard .dot.rt{fill:var(--felt)}
.fboard .nl{font:700 9px var(--f-mono);fill:#0A0A0C;pointer-events:none} .fboard .rt + .nl{fill:#fff}
.fboard .fn{fill:var(--muted);font:700 11px var(--f-body)}

.switches{display:flex;flex-wrap:wrap;gap:8px}
.lyrics{line-height:1.65;max-width:62ch}
.lyrics h4{font:800 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--felt);margin:18px 0 6px}
.lyrics h4:first-child{margin-top:0}
.lyrics p{margin:0;color:#eeeef2}
.lyrics .gap{height:.9em}
.pdf-opts{display:grid;gap:8px}
.pdf-opts .btn{justify-content:center;min-height:48px;font-size:16px}

.big-paste{justify-content:center;min-height:56px;font-size:18px;border-radius:12px}
.tut .tut-steps{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.tut .tut-steps li{display:flex;gap:12px;align-items:flex-start}
.tut .tut-steps .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--felt);color:#fff;display:grid;place-items:center;font:400 18px "Anton",var(--f-brand)}
.tut .tut-steps b{color:#fff}
.tut .tut-steps p{margin:2px 0 6px;font-size:14px}
.tut .mock{display:inline-flex;gap:0;pointer-events:none}
.tut .mock .btn{min-height:34px;font-size:13px}
.tut .mock.ios{background:#2b2b2f;border-radius:9px;overflow:hidden;font-size:13px}
.tut .mock.ios span{padding:7px 11px;color:#fff;border-left:1px solid #4a4a50}
.tut .mock.ios span:first-child{border-left:0}

.login{max-width:440px}
.login .form label{color:#fff}
.role-sel{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:8px;font-weight:700}

.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--felt);color:#fff;font:700 11px var(--f-body);margin-left:3px;vertical-align:1px}
.tabbar button{position:relative}
.team-alert{position:fixed;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top,0px));z-index:6;border:0;background:var(--felt);color:#fff;font:600 14px var(--f-body);padding:10px 16px;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:calc(100% - 32px)}

.yt-btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:7px 14px;min-height:42px;background:#A81FFF;color:#fff;font-weight:700;text-decoration:none}
.yt-btn.ghost{background:transparent;border:1px solid #A81FFF;color:#D383FF}
.yt-btn[aria-pressed="true"]{background:var(--surface2);border:1px solid var(--line)}
.yt-wrap{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:#000}
.yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.install{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:14;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#1c1c22;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:560px;margin:0 auto}
.install-img{width:46px;height:46px;border-radius:11px;flex:none}
.install-ic{font-size:30px;flex:none}
.install-tx{flex:1;min-width:180px;display:grid;gap:2px;font-size:14px;color:#d8d8de}
.install-tx b{color:#fff}
.share-ic{display:inline-flex;align-items:center;gap:3px;color:#4da3ff!important}
.share-ic svg{vertical-align:-3px}

.mosaic-hero{background:#0A0A0C}
.mosaic{position:absolute;inset:-30% -20%;display:flex;gap:12px;transform:rotate(-14deg);z-index:0}
.mcol{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.mcol.down{animation:mosaicDown 60s linear infinite}
.mcol.up{animation:mosaicUp 60s linear infinite}
@keyframes mosaicDown{from{transform:translateY(-50%)}to{transform:translateY(0)}}
@keyframes mosaicUp{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.mt{flex:none;aspect-ratio:3/4;width:100%;border:0;padding:0;border-radius:14px;background:#222 center/cover no-repeat;box-shadow:0 8px 24px rgba(0,0,0,.45);display:grid;place-items:center;cursor:pointer}
.mt span{font:400 34px "Anton",var(--f-brand);color:rgba(255,255,255,.35)}
.mosaic-hero::after{background:linear-gradient(180deg,rgba(10,10,12,.55) 0%,rgba(10,10,12,.15) 30%,rgba(10,10,12,.6) 62%,var(--bg) 92%)}
@media (prefers-reduced-motion: reduce){ .mcol.down,.mcol.up{animation:none} }

.card.locked .lock{position:absolute;top:6px;right:6px;z-index:1;font-size:14px;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 5px}
.lock-cta{margin:0 16px;padding:16px;border-radius:14px;background:linear-gradient(135deg,#340947,#1c1c22);border:1px solid #50166C;display:grid;gap:12px}
.lock-cta b{display:block;font:800 17px var(--f-display);color:#fff;margin-bottom:4px}
.lock-cta span{font-size:14px;color:#d8d8de}

.safe-wrap{padding:22px 16px 0;display:flex}
.safe-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid #1f6b46;background:#0d2a1d;color:#7ee2a8;border-radius:99px;padding:7px 14px 7px 10px;font:700 13px var(--f-body);justify-self:start;cursor:pointer}
.safe .safe-list{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px;color:#d8d8de}
.safe .safe-list b{color:#fff}

.site-foot{margin:28px 16px 0;padding:22px 16px;border-top:1px solid var(--line);display:grid;gap:6px;justify-items:center;text-align:center}
#app:not(.wide) .site-foot{margin-inline:0}
.sf-brand{font:400 22px "Anton",var(--f-brand);text-transform:uppercase;color:var(--cream);letter-spacing:.02em}
.sf-credit{font-size:14px;color:var(--muted)}
.sf-credit b{color:var(--cream)}
.sf-acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}
.sf-acts .safe-badge{justify-self:auto}

.quiz-q{font:800 20px var(--f-display);margin:4px 0 10px}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quiz-opts button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font:700 20px var(--f-mono)}
.quiz-opts button.right{background:#0f5132;border-color:#2ecc71}
.quiz-opts button.wrong{background:#510970;border-color:var(--felt)}
.quiz-bar{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.icon{border:0;background:rgba(0,0,0,.35);color:#fff;width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center}
.icon svg{width:22px;height:22px}
.hero{position:relative;min-height:min(78vh,620px);display:flex;align-items:flex-end;padding:96px 16px 26px;background-size:cover;background-position:center 25%;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,.15) 0%,rgba(10,10,12,.1) 35%,rgba(10,10,12,.85) 78%,var(--bg) 100%)}
.hero-in{position:relative;z-index:1;display:grid;gap:10px;max-width:640px}
.hero .kicker{font:700 12px var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:#fff;opacity:.85;display:flex;align-items:center;gap:8px}
.hero .kicker i{width:22px;height:22px;border-radius:4px;background:var(--felt);display:inline-grid;place-items:center;font:400 16px var(--f-brand);font-style:normal;color:#fff}
.hero h2{font-family:var(--f-brand);font-weight:400;font-size:clamp(48px,13vw,92px);line-height:.92;letter-spacing:.01em;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:#e6e6ea;font-size:15px}

.hero .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.hero .acts .btn{min-height:44px;padding-inline:20px;font-size:16px}
.rows{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;padding-top:6px}
.rows > *{min-width:0}
.row h3{font:800 19px var(--f-display);padding-inline:16px;margin-bottom:8px;display:flex;align-items:baseline;gap:10px}
.row h3 small{font:700 13px var(--f-body);color:var(--muted)}
.row h3 .lnk{margin-left:auto;font:700 13px var(--f-body);color:var(--muted);background:none;border:0;padding:4px 0}
.rail{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.card{flex:none;width:min(44vw,220px);aspect-ratio:16/9;max-width:100%;border-radius:6px;border:0;padding:0;position:relative;overflow:hidden;scroll-snap-align:start;background:var(--surface2) center/cover no-repeat;text-align:left;color:#fff;transition:transform .15s}
.card:hover{transform:scale(1.04)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.85))}
.card .ct{position:absolute;left:8px;right:8px;bottom:6px;z-index:1;font:800 15px/1.15 var(--f-display);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .kb2{position:absolute;top:6px;right:6px;z-index:1;font:700 12px var(--f-mono);background:rgba(0,0,0,.65);padding:2px 6px;border-radius:4px}
.card.pending{opacity:.6}
.card .ex.pend{background:#3a3a42}
.card .ex{position:absolute;top:6px;left:6px;z-index:1;font:700 10px var(--f-body);text-transform:uppercase;letter-spacing:.08em;background:var(--felt);padding:2px 6px;border-radius:3px}
.card .mono{position:absolute;inset:0;display:grid;place-items:center;font:400 54px var(--f-brand);color:rgba(255,255,255,.14)}
.top10{flex:none;display:flex;align-items:flex-end;scroll-snap-align:start;border:0;background:none;padding:0;color:#fff}
.top10 .num{font:400 128px/0.8 var(--f-brand);color:var(--bg);-webkit-text-stroke:2px #8a8a92;margin-right:-14px;position:relative;z-index:0}
.top10 .poster{position:relative;z-index:1;width:104px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--surface2) center/cover no-repeat;display:flex;align-items:flex-end}
.top10 .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.9))}
.top10 .poster span{position:relative;z-index:1;padding:6px;font:800 13px/1.15 var(--f-display);text-align:left}
.top10 .poster em{position:absolute;top:5px;right:5px;z-index:1;font:700 11px var(--f-mono);font-style:normal;background:var(--felt);padding:1px 5px;border-radius:3px}
.artist{flex:none;width:118px;border:0;background:none;padding:0;color:var(--ink);display:grid;gap:6px;text-align:center;scroll-snap-align:start}
.artist .ph{width:118px;aspect-ratio:3/4;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.4);background:var(--surface2) center/cover no-repeat;display:grid;place-items:center;font:400 46px var(--f-brand);color:rgba(255,255,255,.5);border:2px solid transparent;transition:border-color .15s}
.artist:hover .ph{border-color:#fff}
.artist b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artist.add .ph{box-shadow:none;border:2px dashed var(--line);font:400 54px var(--f-body);color:var(--muted)}
.nf-search{padding:calc(70px + env(safe-area-inset-top,0px)) 16px 0}
.nf-search .search{font-size:17px;background:var(--surface2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid .card{width:auto}
.foot{padding:28px 16px 0;font-size:12px;color:var(--muted)}

/* página do artista / banner da música */
.banner{position:relative;margin:0 -16px 14px;padding:calc(64px + env(safe-area-inset-top,0px)) 16px 18px;background:var(--surface) center 25%/cover no-repeat;min-height:220px;display:flex;align-items:flex-end}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,.35),rgba(10,10,12,.55) 50%,var(--bg))}
.banner > *{position:relative;z-index:1}
.banner .back{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:2}
.banner .edit{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:2}
.banner h2{font-family:var(--f-brand);font-weight:400;font-size:clamp(40px,11vw,72px);line-height:.95;color:#fff;letter-spacing:.01em}
.banner .eyebrow{color:#ddd}
.pill-btn{border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:8px 14px;font-weight:700;min-height:38px}
.photo-pick{display:grid;gap:10px;justify-items:start}
.photo-pick .ph{width:160px;aspect-ratio:1;border-radius:50%;background:var(--surface2) center/cover no-repeat;display:grid;place-items:center;font:400 60px var(--f-brand);color:rgba(255,255,255,.4);border:2px solid var(--line)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

@media (min-width:900px){ .hero{padding-inline:48px} .row h3,.rail,.foot{padding-inline:48px} .nf-head{padding-inline:48px} }
@media (max-width:420px){ .top h1{font-size:22px} .song-head h2{font-size:21px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

.bb-ask label{display:block;font-weight:700}.bb-ask textarea{display:block;width:100%;min-height:110px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px;line-height:1.5;margin-top:6px}
.bb-ask-examples{display:flex;flex-wrap:wrap;gap:6px}.bb-ask-examples .btn{font-size:13px;min-height:36px;padding:6px 10px}
.bb-ask-context{display:flex!important;align-items:flex-start;gap:8px;font-weight:400!important;font-size:14px;color:var(--muted)}.bb-ask-context input{margin-top:5px;accent-color:var(--felt)}
.bb-ask-status{margin:0;color:var(--cream);font-size:14px}.bb-ask-status.error{color:#F2D6FF}
.bb-ask-result{border-top:1px solid var(--line);padding-top:16px}.bb-ask-result h3{font-size:16px;margin-bottom:8px}.bb-ask-answer{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;margin:0 0 14px}.bb-ask-refs{display:flex;flex-wrap:wrap;gap:6px}.bb-ask-refs .btn{color:var(--cream);font-size:14px}.bb-ask-note{font-size:12px;color:var(--muted);margin:10px 0 0}
@media(max-width:360px){.bb-ai-launch{flex-wrap:wrap}.bb-ai-launch .btn{width:100%;justify-content:center}}
.bb-pick{flex:1;justify-content:space-between;font-weight:800;min-width:0}
.bb-title{font-family:"Anton",var(--f-brand);font-weight:400;text-transform:uppercase;color:var(--cream);font-size:34px;line-height:1;margin:4px 0 6px}
.bb-tip{font-size:13px;margin:0 0 8px}
.bb-ch{font-size:var(--bfs);line-height:1.7}
.bv{margin:0;padding:5px 8px;border-radius:10px;cursor:pointer;-webkit-user-select:none;user-select:none}
.bv sup{color:var(--felt);font-weight:800;font-size:.62em;margin-right:5px;vertical-align:.45em}
.bv.sel{background:rgba(183,12,255,.18);box-shadow:inset 4px 0 0 var(--felt)}
.bv-add{color:var(--muted)}
.bb-nav{display:flex;justify-content:space-between;margin:16px 0}
.bb-credit{font-size:12px;color:var(--muted);margin:10px 0 90px}.bb-credit a{color:var(--muted)}
.bb-h{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px}
.bb-books{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bb-book{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;display:grid;gap:2px;text-align:center;color:var(--ink)}
.bb-book b{font:400 20px "Anton",var(--f-brand);color:var(--cream)}.bb-book span{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb-book.on{border-color:var(--felt);background:var(--felt-soft)}
.bb-chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.bb-chs button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:48px;font-weight:800;color:var(--ink)}
.bb-chs button.on{background:var(--felt);border-color:var(--felt);color:#fff}
.bb-search{display:flex;gap:8px;margin-bottom:8px}.bb-search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px}
.bb-results{display:grid;gap:6px;margin-bottom:16px;max-height:55vh;overflow:auto}
.bb-res{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:3px;color:var(--ink)}
.bb-res b{color:var(--cream);font-size:14px}.bb-res span{font-size:14px;color:#d8d8de}
.bb-actions{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:15;max-width:736px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.bb-actions b{flex:1 1 100%;font-size:14px;color:var(--cream)}
.bb-story img{width:100%;max-height:58vh;object-fit:contain;border-radius:14px;background:#000}
.ag-h{font-size:17px;margin:0 0 10px}
.ag-up{margin-bottom:14px}
.ag-ev{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.ag-ev.past{opacity:.55}
.ag-ev.k-igreja{border-color:rgba(70,211,195,.35)}
.ag-date{flex:none;width:50px;height:54px;border-radius:12px;background:var(--felt-soft);display:grid;place-items:center;align-content:center;line-height:1}
.ag-date b{font:400 24px "Anton",var(--f-brand);color:var(--cream)}.ag-date span{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--felt);margin-top:2px}
.ag-ev.k-igreja .ag-date{background:rgba(70,211,195,.12)}.ag-ev.k-igreja .ag-date span{color:var(--degree)}
.ag-body{flex:1;min-width:0;display:grid;gap:1px}.ag-body b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ag-body .muted{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-when{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ag-acts{display:flex;gap:4px;flex:none}
.ag-add{width:100%;justify-content:center;margin:-4px 0 14px}
.ag-churches h3{font-size:17px;margin:0 0 8px}
.ag-church{padding:8px 0;border-top:1px solid var(--line)}.ag-church:first-of-type{border-top:0}
.ag-church-h{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;color:var(--ink);text-align:left;margin-bottom:6px}.ag-church-h span{display:grid}.ag-church-h .muted{font-size:12px}
.ag-svc{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;font-size:15px}
.cm-addsvc{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px}.cm-addsvc .btn{grid-column:1/-1;justify-content:center}
.cm-addsvc select,.cm-addsvc input{min-width:0}
.miniyt{position:fixed;right:12px;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:28;width:min(250px,64vw);border-radius:16px;overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.12);touch-action:none}
.miniyt-bar{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;background:rgba(28,21,29,.96);cursor:grab;color:var(--ink)}
.miniyt-bar b{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.miniyt-bar button{border:0;background:rgba(255,255,255,.08);color:#fff;width:30px;height:30px;border-radius:9px;font-size:15px;flex:none}
.miniyt-grip{color:var(--muted);font-size:14px}
.miniyt-v{aspect-ratio:16/9}.miniyt-v iframe{width:100%;height:100%;border:0;display:block}
.set-row .icon-btn{min-width:34px;min-height:38px;padding:0}
.set-row .set-open b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
.set-row{gap:5px}
/* Topo de vidro (igual à barra de baixo), ícones de linha, aro colorido, Contato */
.glass-top{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:9;margin:0 -4px 16px;padding:9px 10px 9px 18px;border:1px solid rgba(236,214,255,.25);border-radius:24px;background:linear-gradient(120deg,rgba(100,44,145,.86),rgba(42,24,67,.93) 60%,rgba(74,38,111,.88));box-shadow:inset 0 1px 0 rgba(238,214,255,.12),0 9px 28px rgba(0,0,0,.28)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass-top{background:linear-gradient(120deg,rgba(123,57,171,.5),rgba(55,23,80,.7) 60%,rgba(100,53,133,.5));-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%)}}
.glass-top .page-title{font-size:26px;flex:1}
.glass-top .dm-icon{width:40px;height:40px;background:rgba(236,214,255,.08);border-color:rgba(236,214,255,.25);margin-left:auto}
.glass-top .cm-me .cm-av{width:38px!important;height:38px!important}
.cm-chips.pick button{display:inline-flex;align-items:center;gap:6px}.cm-chips.pick button svg{width:18px;height:18px;flex:none}
.cm-kind{display:inline-flex;align-items:center;gap:5px}.cm-kind svg,.cm-church svg{width:14px;height:14px;flex:none;vertical-align:-2px;margin-right:4px}
.cm-person-main>.cm-av,.cm-person .cm-av{box-shadow:0 0 0 2.5px var(--bg,#0C0B0E),0 0 0 5px var(--acc)}
.ct-form fieldset{border:0;padding:0;margin:0}.ct-form legend{font-weight:700;margin-bottom:4px}
.ct-ok h2{font-size:22px;margin:0 0 8px}
.ct-row{border-top:1px solid var(--line);padding:12px 0}.ct-row:first-of-type{border-top:0}
.ct-contact{margin:4px 0 0;font-weight:700;overflow-wrap:anywhere}.ct-text{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
/* Tocadas recentemente (bolinhas de vidro) */
.rc-sec{margin:6px 0 14px}
.rc-row{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none;scroll-snap-type:x mandatory}.rc-row::-webkit-scrollbar{display:none}
.rc{flex:none;width:92px;scroll-snap-align:start;display:grid;justify-items:center;gap:3px;text-align:center;border:0;background:none;color:var(--ink);font:inherit;padding:0}
.rc-av{width:78px;height:78px;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;font:700 22px var(--f-body);color:#fff;border:1px solid rgba(232,208,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 4px rgba(170,110,255,.16),0 8px 22px rgba(0,0,0,.35)}
.rc b{font-size:13px;line-height:1.2;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.rc small{font-size:11px;color:var(--muted);max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Posts de texto */
.cm-post-text{display:block;width:100%;text-align:left;border:1px solid var(--glass-edge,var(--line));background:var(--glass-surface,var(--surface));border-radius:18px;padding:18px 18px 20px;color:var(--ink);font:500 19px/1.45 var(--f-body);white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--glass-highlight,none)}
.cm-grid-tx{display:grid;place-items:center;padding:8px;background:linear-gradient(150deg,rgba(150,70,230,.55),rgba(40,20,60,.92))!important;color:#fff;font:600 12px/1.3 var(--f-body);text-align:center;overflow:hidden}
.cm-grid-tx span{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.cm-mix{display:grid;gap:3px}
.tw{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left}
.cm-mix .tw{padding:12px 4px}
.tw-av{border:0;background:none;padding:0;align-self:start}
.tw-b{min-width:0}
.tw-h{margin:0;display:flex;align-items:center;gap:4px;min-width:0;font-size:15px}
.tw-n{border:0;background:none;padding:0;color:var(--ink);font:700 15px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.tw-m{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tw-t{display:block;width:100%;border:0;background:none;padding:2px 0 0;text-align:left;color:var(--ink);font:400 16px/1.42 var(--f-body);white-space:pre-wrap;overflow-wrap:anywhere}
.tw-t.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.tw-or{display:inline-block;margin:2px 0 4px;font:700 12px var(--f-body);color:#ffd9ff;background:rgba(176,92,240,.25);border:1px solid rgba(218,194,239,.35);padding:3px 10px;border-radius:99px}.tw-pray{display:block;margin:10px 0 2px;border:1px solid rgba(218,194,239,.45);background:rgba(176,92,240,.18);color:var(--ink);font:700 14px var(--f-body);padding:9px 16px;border-radius:99px}.tw-pray.on{background:linear-gradient(135deg,#9b4fd8,#6a2aae);color:#fff;border-color:transparent}
.tw-more{border:0;background:none;padding:2px 0;color:#C58BFF;font:600 14px var(--f-body)}
.tw-bar{display:flex;justify-content:space-between;max-width:420px;margin-top:8px}
.tw-bar button{border:0;background:none;color:var(--muted);display:inline-flex;align-items:center;gap:5px;font:500 13px var(--f-body);padding:4px 2px;min-height:32px}
.tw-bar svg{width:19px;height:19px}
.tw-bar .lk{color:#F91880}.tw-bar .lk svg{fill:currentColor}.tw-bar .rp{color:#00BA7C}
.cm-txrow{display:grid;gap:6px;width:100%;text-align:left;border:1px solid var(--glass-edge,var(--line));border-radius:14px;padding:12px 14px;font:inherit;box-shadow:var(--glass-highlight,none)}
.cm-txrow-h{display:flex;align-items:center;gap:8px;min-width:0}.cm-txrow-h b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cm-txrow-h small{margin-left:auto;font-size:11px;opacity:.7}
.cm-txrow-t{font-size:16px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cm-tx-in{border-radius:16px!important;font-size:18px!important;line-height:1.45!important;padding:14px!important;border:1px solid var(--glass-edge,var(--line))!important}
.cm-tx-in::placeholder{color:currentColor;opacity:.6}
.cm-tx-colors{display:grid;gap:6px}.cm-tx-colors>div{display:flex;gap:10px;flex-wrap:wrap}
.cm-swatch{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}
.cm-swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg,#0C0B0E),0 0 0 5px #C58BFF;border-color:#fff}
.terms .terms-body{max-height:58vh;overflow-y:auto;padding-right:4px;margin-bottom:12px}
.terms h3{font-size:15px;margin:14px 0 4px}.terms p,.terms li{font-size:14px;line-height:1.45;margin:0 0 6px}.terms ul{padding-left:18px;margin:0 0 6px}
.terms-check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}.terms-check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:#B05CF0}
.cm-wheel{position:relative;width:34px;height:34px;border-radius:50%;background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red);border:2px solid rgba(255,255,255,.35);cursor:pointer;display:inline-block;overflow:hidden}
.cm-wheel.on{box-shadow:0 0 0 3px var(--bg,#0C0B0E),0 0 0 5px var(--c,#fff)}
.cm-wheel input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
/* Mensagens */
.dm-icon{position:relative;margin-left:auto;margin-right:10px;width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:#fff;display:grid;place-items:center}.dm-icon svg{width:23px;height:23px}
.dm-icon .badge{position:absolute;top:-5px;right:-5px;margin:0}.top .dm-icon + .cm-me{margin-left:0}
.dm-lock{font-size:13px;color:var(--muted);margin:0 0 12px;display:block;text-align:left;background:none;border:0;padding:0}
.dms-list{margin:0 0 14px;padding:0;list-style:none;display:grid;gap:8px;font-size:15px}
.dm-rows{display:grid}
.dm-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#fff;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);font:inherit}
.dm-row-t{flex:1;min-width:0;display:grid;gap:2px}.dm-row-t .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.dm-row.un .dm-row-t .muted{color:#fff;font-weight:700}
.dm-row-x{display:grid;justify-items:end;gap:6px}.dm-dot{width:10px;height:10px;border-radius:50%;background:#C561FF;display:block}
.dm-head{position:fixed;top:0;left:0;right:0;z-index:8;max-width:720px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;background:rgba(12,11,14,.95);border-bottom:1px solid var(--line)}
.dm-head .btn{min-width:44px;font-size:22px}
.dm-who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;color:#fff;text-align:left;font:inherit}.dm-who span{display:grid;min-width:0}.dm-who b{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-list{position:fixed;top:calc(66px + env(safe-area-inset-top,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));left:0;right:0;max-width:720px;margin:0 auto;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:4px}
.dm-list .dm-lock{align-self:center;text-align:center;margin-top:30px}
.dm-day{align-self:center;font-size:12px;color:var(--muted);margin:10px 0 4px}
.dm-msg{display:flex}.dm-msg.me{justify-content:flex-end}
.dm-b{max-width:78%;border:0;text-align:left;font:15px/1.35 var(--f-body);color:#fff;background:#2B2A31;padding:8px 12px 6px;border-radius:18px 18px 18px 6px;overflow-wrap:anywhere;display:grid;gap:2px}
.dm-msg.me .dm-b{background:#8B10DF;border-radius:18px 18px 6px 18px}
.dm-b small{font-size:11px;opacity:.7;justify-self:end}
.dm-form{position:fixed;bottom:0;left:0;right:0;z-index:8;max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(12,11,14,.97);border-top:1px solid var(--line)}
.dm-form textarea{flex:1;min-width:0;resize:none;max-height:120px;border-radius:20px;padding:10px 14px;margin:0}
/* Perfil: abas, marcações */
.cm-seg.pf-tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin:18px 0 12px;justify-self:stretch}.pf-tabs::-webkit-scrollbar{display:none}
.pf-tabs button{flex:none;white-space:nowrap;padding-inline:12px}
.pf-bl{position:relative}.pf-bl span{position:absolute;inset:0;display:grid;place-items:center;color:#fff}.pf-bl span svg{width:30px;height:30px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
.pf-with{margin:4px 0 0;font-size:13px;color:var(--muted)}.pf-with .lnk2{font-weight:700}
.bl-info .pf-with{color:#fff}.bl-info .pf-with .lnk2{color:#fff}
.pf-tagpick{display:grid;gap:6px}.pf-tagpick input{width:100%;min-width:0;box-sizing:border-box}
.pf-chip{border:1px solid var(--line);background:var(--surface);color:#fff;border-radius:99px;padding:5px 11px;font:600 13px var(--f-body)}
.pf-bc-list{max-height:50vh;overflow-y:auto;margin-bottom:10px}
/* Blessings */
.bl-feed{position:fixed;top:0;bottom:0;left:max(0px,calc(50% - 260px));right:max(0px,calc(50% - 260px));overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;background:#000;z-index:5;scrollbar-width:none}
.bl-feed::-webkit-scrollbar{display:none}
.bl-top{position:fixed;top:0;left:max(0px,calc(50% - 260px));right:max(0px,calc(50% - 260px));z-index:7;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 22px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
.bl-top>*{pointer-events:auto}.bl-top .page-title{font-size:28px;flex:1;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.bl-sound{width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center}.bl-sound svg{width:22px;height:22px}
.bl-new{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;background:var(--red,#B70CFF);color:#fff;font:800 14px var(--f-body);padding:9px 14px 9px 11px}.bl-new svg{width:18px;height:18px}
.top .bl-new{margin-left:auto}
.bl-item{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden}
.bl-v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
@media (max-aspect-ratio:3/4){.bl-v{object-fit:cover}}
.bl-tap{position:absolute;inset:0;z-index:1;border:0;background:none;padding:0;display:grid;place-items:center}

<script type="text/plain" id="blessed-push-worker">
// BLESSED-PUSH-WORKER: dados do aparelho sobrevivem à atualização do cache do app.
function pushOwner(value,write=false){return new Promise((resolve,reject)=>{
 const request=indexedDB.open('blessed-push-device',1);request.onupgradeneeded=()=>request.result.createObjectStore('state');request.onerror=()=>reject(new Error('storage'));
 request.onsuccess=()=>{const db=request.result,tx=db.transaction('state',write?'readwrite':'readonly'),store=tx.objectStore('state'),op=write?store.put(value,'owner'):store.get('owner');let result;op.onsuccess=()=>{result=op.result;};tx.oncomplete=()=>{db.close();resolve(result);};tx.onerror=()=>{db.close();reject(new Error('storage'));};};
});}
function pushSafeURL(value){try{const u=new URL(value,self.location.origin);if(u.origin!==self.location.origin||u.pathname!=='/')return '/';const entries=[...u.searchParams];if(entries.length!==1)return '/';const [kind,id]=entries[0];return ['conversation','foto','blessing','story','profile'].includes(kind)&&/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(id)?u.pathname+u.search:'/';}catch{return '/';}}
self.addEventListener('message',e=>{
 if(e.data?.type==='BLESSED_PUSH_OWNER'||e.data?.type==='BLESSED_PUSH_LOGOUT'){
  const owner=e.data.type==='BLESSED_PUSH_LOGOUT'?null:e.data.owner;
  if(owner!==null&&!/^[a-f0-9-]{36}$/i.test(owner||'')){e.ports?.[0]?.postMessage({ok:false});return;}
  e.waitUntil(pushOwner(owner,true).then(()=>e.ports?.[0]?.postMessage({ok:true})).catch(()=>e.ports?.[0]?.postMessage({ok:false})));
 }
});
self.addEventListener('push',e=>{
 e.waitUntil((async()=>{
  let data;try{data=e.data?.json();}catch{}const owner=await pushOwner().catch(()=>null);
  const known=owner&&owner===data?.account,notification=known?data:{};
  if(known&&data.activity==='attention'&&/^[a-f0-9-]{36}$/i.test(data.actor||'')&&/^[a-f0-9-]{36}$/i.test(data.target||'')){
   const windows=await self.clients.matchAll({type:'window',includeUncontrolled:true});
   for(const client of windows)if(client.visibilityState==='visible'&&new URL(client.url).origin===self.location.origin)client.postMessage({type:'BLESSED_PUSH_ACTIVITY',account:owner,activity:'attention',actor:data.actor,target:data.target});
  }
  await self.registration.showNotification(String(notification.title||'Blessed').slice(0,140),{
   body:String(notification.body||'Abra o Blessed para ver seus avisos.').slice(0,200),
   icon:'/img/icon-192.png',badge:'/img/icon-192.png',tag:known?String(data.tag||data.id).slice(0,100):'blessed',
   data:{url:known?pushSafeURL(data.url):'/',account:known?owner:null},
   renotify:!!known,silent:!known,...(known?{vibrate:[180,90,180]}:{})
  });
 })());
});
self.addEventListener('notificationclick',e=>{
 e.notification.close();e.waitUntil((async()=>{
  const data=e.notification.data||{},owner=await pushOwner().catch(()=>null),url=owner&&owner===data.account?pushSafeURL(data.url):'/';
  const windows=await self.clients.matchAll({type:'window',includeUncontrolled:true});
  const client=windows.find(c=>new URL(c.url).origin===self.location.origin);
  if(client){await client.focus();client.postMessage({type:'BLESSED_PUSH_OPEN',url,account:owner});}
  else await self.clients.openWindow(url);
 })());
});

const NOISE_RE = /^(\|+:?|:?\|+|\(?\d+x\)?|x\d+|%|-+|\/|\.+|:|\*)$/i;
function tokenize(line){
  const out = []; const re = /\S+/g; let m;
  while ((m = re.exec(line))) out.push({col:m.index, text:m[0]});
  return out;
}
function parseChordLine(line){
  const toks = tokenize(line); if (!toks.length) return null;
  let n = 0; const res = [];
  for (const t of toks) {
    // "G7M(9)" é um acorde inteiro; só separa parênteses de fora como em "(G D)"
    const whole = parseChord(t.text);
    const pre = whole ? "" : (t.text.match(/^[(\[]+/)||[""])[0];
    const post = whole ? "" : (t.text.match(/[)\]]+$/)||[""])[0];
    const core = t.text.slice(pre.length, t.text.length - post.length);
    const c = core ? parseChord(core) : null;
    if (c) { n++; res.push({col:t.col, pre, post, chord:c}); }
    else if (NOISE_RE.test(t.text)) res.push({col:t.col, text:t.text});
    else return null;
  }
  return n ? res : null;
}
function chordProToLines(line){
  // converts "[G]Tu és [D]fiel" into a chord line + lyric line
  const re = /\[([^\]]+)\]/g; let m, chords = [], lyric = "", last = 0;
  while ((m = re.exec(line))) {
    if (!parseChord(m[1])) return null;
    lyric += line.slice(last, m.index);
    chords.push({col:lyric.length, name:m[1]});
    last = m.index + m[0].length;
  }
  if (!chords.length) return null;
  lyric += line.slice(last);
  let cl = "";
  for (const c of chords) { const at = Math.max(c.col, cl.length ? cl.length + 1 : 0); cl = cl.padEnd(at) + c.name; }
  return [cl, lyric];
}
function parseSong(text){
  const raw = (text||"").replace(/\r/g,"").replace(/\t/g,"    ").split("\n");
  const lines = [];
  let inTab = false; // trecho de tablatura do Cifra Club: repete os acordes, então pula até a próxima seção
  for (const l of raw) {
    if (/^\s*parte \d+ de \d+\s*$/i.test(l) || TAB_RE.test(l)) continue;
    const sec = l.match(/^\s*\[([^\]]+)\]\s*(.*)$/);
    if (sec && /^\s*tab\b/i.test(sec[1])) { inTab = true; continue; }
    if (sec && !parseChord(sec[1].trim())) inTab = false;
    if (inTab) continue;
    if (sec && !parseChord(sec[1].trim())) {
      lines.push({type:"sec", text:sec[1].trim()});
      if (sec[2].trim()) {
        const cl = parseChordLine(sec[2]);
        lines.push(cl ? {type:"chords", toks:cl} : {type:"lyric", text:sec[2]});
      }
      continue;
    }
    if (/\[[^\]]+\]/.test(l)) { const cp = chordProToLines(l); if (cp) { lines.push({type:"chords", toks:parseChordLine(cp[0])}); if (cp[1].trim()) lines.push({type:"lyric", text:cp[1]}); continue; } }
    const cl = parseChordLine(l);
    lines.push(cl ? {type:"chords", toks:cl} : {type:"lyric", text:l});
  }
  return lines;
}
function songChords(lines){
  const out = [];
  for (const l of lines) if (l.type==="chords") for (const t of l.toks) if (t.chord) out.push(t.chord);
  return out;
}
function detectKey(chords){
  if (!chords.length) return null;
  let best = null;
  for (const mode of ["major","minor"]) for (let pc = 0; pc < 12; pc++) {
    let s = mode==="major" ? 0.05 : 0;
    chords.forEach((c, idx) => {
      const i = (c.root - pc + 12) % 12, e = EXP[mode][i];
      if (e && (e.includes(cls(c)) || ((c.sus4||c.sus2) && !e.includes("d")))) s += 1;
      if ((idx===0 || idx===chords.length-1) && i===0 && (mode==="major" ? cls(c)==="M" : cls(c)==="m")) s += 1.5;
    });
    if (!best || s > best.s) best = {s, pc, mode};
  }
  const first = chords.find(c => c.root === best.pc);
  let tonic = first ? first.rootName : DEFAULT_NAME[best.mode][best.pc];
  if (!TONICS[best.mode].includes(tonic)) tonic = DEFAULT_NAME[best.mode][best.pc];
  return {tonic, mode: best.mode};
}

/* ---------- storage ---------- */
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
const store = {mode:"local", coll:null};
const writeChain = {};
function songBody(s){ return {name:s.name, artist:s.artist||"", text:s.text, pending:!!s.pending, cifraUrl:s.cifraUrl||"", origTonic:s.origTonic, origMode:s.origMode, targetTonic:s.targetTonic, capo:s.capo||0, youtube:s.youtube||"", updatedAt:s.updatedAt||Date.now()}; }
function persist(song){
  song.updatedAt = Date.now();
  if (store.mode === "team") { if (canEditTeam()) teamWrite(song.id, "song", songBody(song)); return; }
  if (store.mode === "db") {
    const id = song.id;
    writeChain[id] = (writeChain[id]||Promise.resolve()).then(() => store.coll.doc(id).set(songBody(song))).catch(() => flash("Não consegui salvar agora. Tente de novo em instantes."));
    lsSet("cc-cache", state.songs);
  } else {
    lsSet("cc-local-songs", state.songs.filter(s=>!s.example));
  }
}
function persistSetlist(){
  if (store.mode === "team") { if (canEditTeam()) teamWrite("_setlist", "setlist", {items: state.setlist}); return; }
  if (store.mode === "db") {
    writeChain._s = (writeChain._s||Promise.resolve()).then(() => store.coll.doc("_setlist").set({items:state.setlist, updatedAt:Date.now()})).catch(()=>{});
    lsSet("cc-setlist-cache", state.setlist);
  } else lsSet("cc-local-setlist", state.setlist);
}
/* pastas de artista: {id, kind:"artist", name, photo(dataURL)} no mesmo lugar das músicas */
function persistArtist(a){
  a.updatedAt = Date.now();
  if (store.mode === "team") { if (canEditTeam()) teamWrite(a.id, "artist", {kind: "artist", name: a.name, photo: a.photo || "", updatedAt: a.updatedAt}); return; }
  if (store.mode === "db") {
    writeChain[a.id] = (writeChain[a.id]||Promise.resolve()).then(() => store.coll.doc(a.id).set({kind:"artist", name:a.name, photo:a.photo||"", updatedAt:a.updatedAt})).catch(() => flash("Não consegui salvar a pasta agora. Tente de novo."));
    lsSet("cc-artists-cache", state.artists);
  } else lsSet("cc-local-artists", state.artists);
}
function removeArtist(id){
  state.artists = state.artists.filter(a => a.id !== id);
  if (store.mode === "team") { if (canEditTeam()) teamDelete(id); return; }
  if (store.mode === "db") { store.coll.doc(id).delete().catch(()=>{}); lsSet("cc-artists-cache", state.artists); }
  else lsSet("cc-local-artists", state.artists);
}
function removeSong(id){
  state.songs = state.songs.filter(s => s.id !== id);
  if (state.setlist.includes(id)) { state.setlist = state.setlist.filter(x => x !== id); persistSetlist(); }
  if (store.mode === "team") { if (canEditTeam()) teamDelete(id); return; }
  if (store.mode === "db") { store.coll.doc(id).delete().catch(()=>{}); lsSet("cc-cache", state.songs); }
  else lsSet("cc-local-songs", state.songs);
}
async function initStore(){
  try {
    const c = window.claude; if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const coll = db.collection("data/users/" + uid);
    const local = lsGet("cc-local-songs", []);
    for (const s of local) { try { await coll.doc(s.id).set(songBody(s)); } catch(e){} }
    if (local.length) lsSet("cc-local-songs", []);
    const localSet = lsGet("cc-local-setlist", []);
    if (localSet.length) { try { await coll.doc("_setlist").set({items:localSet, updatedAt:Date.now()}); lsSet("cc-local-setlist", []); } catch(e){} }
    const localArt = lsGet("cc-local-artists", []);
    for (const a of localArt) { try { await coll.doc(a.id).set({kind:"artist", name:a.name, photo:a.photo||"", updatedAt:a.updatedAt||Date.now()}); } catch(e){} }
    if (localArt.length) lsSet("cc-local-artists", []);
    store.mode = "db"; store.coll = coll;
    coll.onSnapshot(snap => {
      const docs = snap.docs.filter(d=>d.exists);
      state.songs = docs.filter(d => d.id !== "_setlist" && d.data().kind !== "artist").map(d => Object.assign({id:d.id}, d.data()));
      state.artists = docs.filter(d => d.data().kind === "artist").map(d => Object.assign({id:d.id}, d.data()));
      const sl = docs.find(d => d.id === "_setlist");
      state.setlist = sl && Array.isArray(sl.data().items) ? sl.data().items.slice() : [];
      lsSet("cc-cache", state.songs); lsSet("cc-setlist-cache", state.setlist); lsSet("cc-artists-cache", state.artists);
      if (state.view !== "editor" && state.view !== "artist-edit") render();
    }, () => { store.mode = "local"; });
    // histórias pesquisadas na internet (coleção compartilhada, só leitura no app)
    db.collection("info").onSnapshot(snap => {
      const m = {}; for (const d of snap.docs) if (d.exists) m[d.id] = d.data();
      state.infoDocs = m; lsSet("cc-info-cache", m);
      if (state.view === "song" || state.view === "artist") rerenderKeepScroll();
    }, () => {});
  } catch(e) {}
}

  const have = new Set(state.songs.map(x => catKey(x.artist, x.name)));
  const extra = [];
  (CATALOG.songs || []).forEach(([artist, name, url], i) => {
    if (have.has(catKey(artist, name))) return;
    extra.push({id: "cat-" + slug(artist) + "--" + slug(name), name, artist, cifraUrl: url || "", catalog: true, pending: true, text: "", origTonic: "C", origMode: "major", targetTonic: "C", order: i, updatedAt: 0});
  });
  return state.songs.concat(extra);
}
function catalogArtists(){
  const have = new Set(state.artists.map(a => norm(a.name)));
  return state.artists.concat((CATALOG.artists || []).filter(a => !have.has(norm(a.name))).map(a => ({id: "cat-a-" + slug(a.name), name: a.name, photo: a.photo || "", catalog: true})));
}
function artistsAll(){
  if (canSeeCatalog()) return catalogArtists();
  const withSongs = new Set(songsAll().map(x => norm(x.artist)));
  return catalogArtists().filter(a => withSongs.has(norm(a.name)));
}
function catalogPhoto(name){ const a = (CATALOG.artists || []).find(x => norm(x.name) === norm(name)); return a && a.photo ? a.photo : ""; }
function artistPhoto(name){ const f = state.artists.find(a => norm(a.name) === norm(name)); return (f && f.photo) || catalogPhoto(name); }
function folderFor(name){ const n = norm(name); return n ? artistsAll().find(a => norm(a.name) === n) : null; }
function hue(s){ let h = 0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0)) >>> 0; return h % 360; }
function coverStyle(name, seed){
  const p = artistPhoto(name), h = hue(seed || name || "x");
  const grad = `linear-gradient(135deg,hsl(${h} 55% 26%),hsl(${(h+40)%360} 60% 10%))`;
  return p ? `background-image:url('${p}'),${grad}` : `background-image:${grad}`;
}
function initials(name){ return esc(String(name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase() || "?"); }

}

/* ---------- equipe: login com e-mail e senha (Supabase), só no site ----------

const TEAM = {client: null, user: null, profile: null, sub: null, users: null, msg: "", busy: false,recovering:false,profileIntroPending:null};
const ROLE_NAME = {pending: "Aguardando", member: "Membro", editor: "Editor", admin: "Administrador", blocked: "Bloqueado"};
function teamAvailable(){ return !window.claude && !!(window.CC_SUPABASE && window.CC_SUPABASE.url && window.CC_SUPABASE.key && window.supabase); }
function teamRole(){ return TEAM.profile ? TEAM.profile.role : "none"; }
function canEditTeam(){ return store.mode !== "team" || teamRole() === "editor" || teamRole() === "admin"; }
function saveOverride(s){ const ov = lsGet("cc-ov", {}); ov[s.id] = {targetTonic: s.targetTonic, capo: s.capo || 0}; lsSet("cc-ov", ov); }

async function teamInit(){
  if (!teamAvailable()) return;
  TEAM.client = window.supabase.createClient(window.CC_SUPABASE.url, window.CC_SUPABASE.key, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  TEAM.client.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT" && TEAM.user) teamLeave();
    if (ev === "PASSWORD_RECOVERY") {TEAM.recovering=true;setTimeout(() => { state.ajBack = "community"; state.aj = {msg: "Você entrou pelo link do e-mail. Crie sua senha nova abaixo."}; state.view = "ajustes"; render(); scrollTo(0, 0); }, 600);} });
  try {
    const {data} = await TEAM.client.auth.getSession();
    if (data && data.session) await teamEnter(data.session.user);

async function teamEnter(user,onboard=false){

    .on("postgres_changes", {event: "*", schema: "public", table: "items"}, () => {

async function teamLoad(){
  const {data, error} = await TEAM.client.from("items").select("id,kind,data").limit(5000);
  if (error) { flash("Não consegui carregar o repertório da equipe. Confira a internet."); return; }
  const songs = [], artists = []; let setlist = [];
  for (const r of data) {
    if (r.kind === "song") songs.push(Object.assign({}, r.data, {id: r.id}));
    else if (r.kind === "artist") artists.push(Object.assign({}, r.data, {id: r.id}));
    else if (r.kind === "setlist") setlist = Array.isArray(r.data.items) ? r.data.items : [];
  }
  state.songs = applyOverrides(songs); state.artists = artists; state.setlist = setlist;
}

  if (kind === "signup" && !($("#l-terms") || {}).checked) { teamAuthFail("Para criar a conta, leia e aceite os Termos de Uso."); return; }

const PR={owner:null,session:null,timer:null,busy:false,reading:false,rows:null,at:0,received:0,error:'',denied:false,generation:0};
function prStop(){clearInterval(PR.timer);PR.timer=null;PR.owner=null;PR.session=null;PR.rows=null;PR.at=0;PR.error='';PR.denied=false;PR.generation++;PR.busy=false;PR.reading=false;}
function prStart(){prStop();if(!TEAM.user||teamRole()==='blocked')return;PR.owner=TEAM.user.id;PR.session=crypto.randomUUID();prBeat();PR.timer=setInterval(()=>{if(!document.hidden){prBeat();if(state.view==='team')prRead();}},30000);}
async function prBeat(active=!document.hidden){if(!TEAM.client||!PR.owner||PR.owner!==TEAM.user?.id||PR.busy)return;const gen=PR.generation;PR.busy=true;try{await TEAM.client.rpc('presence_heartbeat',{session_id:PR.session,active});}catch(e){}finally{if(gen===PR.generation)PR.busy=false;}}
async function prRead(force=false){if(teamRole()!=='admin'||PR.reading||PR.denied||(!force&&Date.now()-PR.at<25000))return;const gen=PR.generation;PR.reading=true;PR.at=Date.now();try{const {data,error}=await TEAM.client.rpc('presence_dashboard');if(gen!==PR.generation||teamRole()!=='admin')return;if(error){PR.denied=error.code==='42501';PR.error='A presença ainda precisa ser ativada. Cole o SQL de presença no Supabase.';}else if(data&&Array.isArray(data.users)&&Number.isFinite(Date.parse(data.server_now))){PR.rows=data.users;PR.server=Date.parse(data.server_now);PR.received=Date.now();PR.error='';}else PR.error='Não consegui atualizar a presença agora.';}catch(e){if(gen===PR.generation)PR.error='Sem conexão para atualizar a presença.';}finally{if(gen===PR.generation){PR.reading=false;prPaint();}}}
function prClock(ms){const n=Math.max(0,Math.floor(ms/1000));return String(Math.floor(n/3600)).padStart(2,'0')+':'+String(Math.floor(n/60)%60).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function prBody(){if(PR.denied)return '';if(!PR.rows)return `<p class="muted">${esc(PR.error||'Carregando presença…')}</p>`;const now=PR.server+Date.now()-PR.received,online=PR.rows.filter(u=>u.online);return `<div class="pr-summary"><b><span class="pr-dot"></span> ${online.length} online</b><small>${PR.rows.length} usuários cadastrados</small></div>${PR.error?`<p class="muted">${esc(PR.error)} Dados da última atualização.</p>`:''}<div class="pr-users">${PR.rows.map(u=>`<div class="pr-user"><b>${esc(u.name)}</b><span class="${u.online?'pr-live':'muted'}">${u.online?'Online · conectado há <time data-pr-since="'+esc(u.online_since)+'">'+prClock(now-Date.parse(u.online_since))+'</time>':u.last_left_at?'Saiu há <time data-pr-since="'+esc(u.last_left_at)+'">'+prClock(now-Date.parse(u.last_left_at))+'</time>':'Ainda não acessou após a ativação'}</span></div>`).join('')}</div><p class="muted" style="font-size:12px">Somente você vê esta lista. Conta usuários com o app visível. Saídas sem conexão podem levar até 90 segundos para aparecer. Atualizado às ${new Date(PR.server).toLocaleTimeString('pt-BR')}.</p>`;}
function prPanel(){if(PR.denied)return '';if(!PR.reading&&Date.now()-PR.at>=25000)setTimeout(()=>prRead());return `<section class="panel" id="pr-panel"><div class="actions" style="justify-content:space-between"><h3>Usuários online</h3><button class="btn ghost" data-a="pr-refresh">Atualizar</button></div><div id="pr-body">${prBody()}</div></section>`;}
function prPaint(){const el=$('#pr-body');if(teamRole()!=='admin'){$('#pr-panel')?.remove();return;}if(PR.denied){$('#pr-panel')?.remove();return;}if(el)el.innerHTML=prBody();}
setInterval(()=>{if(document.hidden||teamRole()!=='admin'||state.view!=='team'||!PR.rows)return;const now=PR.server+Date.now()-PR.received;document.querySelectorAll('[data-pr-since]').forEach(el=>{const date=Date.parse(el.dataset.prSince);el.textContent=Number.isFinite(date)?prClock(now-date):'—';});},1000);

  if (BIBLE.cache[code]) return Promise.resolve(BIBLE.cache[code]);

function bibleRange(nums){

function stTick(){

async function stCameraOpen(facing='user'){

  const c={facing,filter,strength,stopped:false,busy:false,rendered:0,lutImage:null,loading:false};p.camera=c;stRender(true);

    const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30},resizeMode:{ideal:'none'}}});

}
async function stCameraApplyTone(c){

  if(c.video){c.video.style.filter='none';c.video.style.transform=c.facing==='user'?'scaleX(-1)':'none';}if(c.preview){c.preview.hidden=true;c.preview.style.transform=c.facing==='user'?'scaleX(-1)':'none';}

}
function stCameraSnapshot(c,max=720){

function stCameraLoop(p,c){

  const now=performance.now();if(!c.lastPaint||now-c.lastPaint>=(c.paintInterval||32)){
    c.lastPaint=now;

function stCameraBack(p=ST.panel){if(!p||p.kind!=='camera')return;stCameraStop(p);p.kind='gallery';p.busy=false;stRender(true);}
async function stPhotoEncode(source){
  let scale=Math.min(1,ST_PHOTO.maxSide/Math.max(source.width,source.height));
  for(let size=0;size<6;size++){
    const out=stCanvas(source.width*scale,source.height*scale),ctx=out.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,out.width,out.height);ctx.drawImage(source,0,0,out.width,out.height);
    for(const quality of [.9,.85,.8,.75,.7,.65]){
      const data=out.toDataURL('image/jpeg',quality),bytes=Math.floor((data.length-data.indexOf(',')-1)*3/4);
      if(bytes<=ST_PHOTO.maxBytes)return data;
    }
    scale*=.82;
  }

}

  if(window.ImageCapture){
    const capture=new window.ImageCapture(track);let settings={};
    try{const caps=await stCameraWait(capture.getPhotoCapabilities(),1500);if(caps.imageWidth?.max)settings.imageWidth=caps.imageWidth.max;if(caps.imageHeight?.max)settings.imageHeight=caps.imageHeight.max;}catch(_){}

function stCameraClick(action,button){

function stSocialRender(p){

/* STORIES-AUDIO-START: biblioteca só no editor; o áudio acompanha a publicação, sem rádio. */
const ST_AUDIO={owner:null,rows:[],loading:false,loaded:false,error:'',request:0};
function stAudioReset(){ST_AUDIO.request++;ST_AUDIO.owner=null;ST_AUDIO.rows=[];ST_AUDIO.loading=false;ST_AUDIO.loaded=false;ST_AUDIO.error='';}
const stAudioNorm=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function stAudioUrl(key){
  if(!/^(?:story-audio\/)?[a-f0-9]{24}\.m4a$/.test(key||''))return '';
  const base=blBase();try{const url=new URL(base);if(url.protocol!=='https:')return '';return base+'/'+key;}catch(_){return '';}
}
async function stAudioLoad(force=false){
  const p=ST.panel;if(!p||p.kind!=='compose'||!ST.audioLibrary||!stPanelCurrent(p))return;
  if(ST_AUDIO.owner!==p.actor.owner){stAudioReset();ST_AUDIO.owner=p.actor.owner;}

  try{
    const {data,error}=await actor.client.from('story_music_tracks').select('id,artist,title,object_key,duration_seconds').eq('ready',true).order('artist').limit(1000);
    if(error)throw error;if(!stCurrent(actor)||ST_AUDIO.request!==request)return;
    ST_AUDIO.rows=(data||[]).filter(t=>/^[a-f0-9]{24}$/.test(t.id)&&(t.object_key===t.id+'.m4a'||t.object_key==='story-audio/'+t.id+'.m4a')&&t.duration_seconds===30);ST_AUDIO.loaded=true;

function stMusicOptions(p){

  const mini=$('#miniyt');if(mini){mini.hidden=true;mini.innerHTML='';}

  const ended=()=>{if(!current())return;p.musicPlaying=false;p.musicEnded=true;p.musicWaiting=false;p.elapsed=music.duration*1000;p.lastTick=performance.now();status('Trecho concluído.');};

  const play=async()=>{
    try{await audio.play();}
    catch(error){if(!current())return;p.musicStarting=false;p.musicPlaying=false;if(error.name==='NotAllowedError'){p.musicWaiting=true;status('Toque para ativar o som.');}else failed();}
  };

      onAutoplayBlocked(){if(current()){if(button){button.hidden=false;button.textContent='▶ Ativar som';}stMusicStatus('Toque para ouvir.');}},
      onStateChange(event){if(!current())return;const playing=event.data===1;if(playing&&(document.hidden||p.audience)){event.target.pauseVideo();return;}p.musicPlaying=playing;p.lastTick=performance.now();if(playing){p.musicWaiting=false;if(!p.musicStarted){p.musicStarted=true;p.elapsed=0;}if(p.kind==='viewer'){p.paused=false;stPauseControl(p);}if(button)button.hidden=true;const status=$('#st-music-status');if(status)status.hidden=true;}else if(event.data===0){if(p.kind==='viewer'){p.musicWaiting=false;p.musicEnded=true;p.elapsed=music.duration*1000;}else stMusicStatus('Trecho concluído.');}else if(event.data===2)stMusicStatus('Clipe pausado.');},
      onError(){if(!current())return;p.musicWaiting=false;p.musicError=true;p.musicPlaying=false;if(button){button.hidden=false;button.textContent='▶ Tentar novamente';}stMusicStatus('Este clipe não pôde tocar aqui. Você pode abrir no YouTube.');}

/* ---------- Agenda: cultos, ensaios, lembretes, escala e cultos das igrejas seguidas ----------

const DOW = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const DOW3 = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const ICS_DAY = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];

function agItems(){ return lsGet("cc-agenda", []); }
function agSave(list){

function agChurches(){
